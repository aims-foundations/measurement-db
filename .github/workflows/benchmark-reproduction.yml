name: Benchmark table reproduction

on:
  # Inspect the full Git diff in the changes job. GitHub's paths filters inspect
  # only the first 300 changed files and can miss benchmarks in large PRs.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark folders to rebuild, comma-separated (empty means all benchmarks)'
        type: string
        required: false
      prepare_gallery:
        description: 'Prepare a complete reusable gallery after validation (bootstrap or data refresh)'
        type: boolean
        default: false
      source_mode:
        description: 'Archived snapshots for reproduction, or upstream for author-source checks'
        type: choice
        options: [archive, upstream]
        default: archive

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: benchmark-reproduction-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Rebuild reviewed repository branches; fork PRs must not execute on this host.
    if: >-
      github.repository == 'aims-foundations/measurement-db' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_benchmarks: ${{ steps.select.outputs.has_benchmarks }}
      withheld: ${{ steps.select.outputs.withheld }}
      hf_revision: ${{ steps.reference.outputs.revision }}
      prepare_gallery: ${{ steps.gallery.outputs.prepare }}
    defaults:
      run:
        working-directory: measurement_db
    steps:
      - uses: actions/checkout@v4
        with:
          path: measurement_db
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create a fresh job environment
        run: |
          python -m venv --clear "$RUNNER_TEMP/measurement-db-venv"
          echo "$RUNNER_TEMP/measurement-db-venv/bin" >> "$GITHUB_PATH"
      - name: Install the metadata reader
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Test change detection, release policy, and strict byte comparison
        run: python -m unittest discover -s tests -p 'test_benchmark_reproduction*.py' -v
      - name: Read release metadata and select public benchmarks
        id: select
        run: python scripts/ci/benchmark_reproduction.py select
      - name: Select gallery preparation for repository PRs
        id: gallery
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          MANUAL_PREPARE: ${{ inputs.prepare_gallery }}
        run: |
          prepare=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            prepare=${MANUAL_PREPARE:-false}
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_ACTOR" != 'dependabot[bot]' ]; then
            base=$(git merge-base "$BEFORE" "$AFTER")
            changed=$(git diff --name-only --no-renames "$base" "$AFTER" -- \
              benchmarks/ website/ schema.md scripts/render_website/ scripts/analyze_measurements/ \
              scripts/ci/ .github/workflows/deploy-website.yml .github/workflows/benchmark-reproduction.yml)
            if [ -n "$changed" ]; then prepare=true; fi
          fi
          echo "prepare=$prepare" >> "$GITHUB_OUTPUT"
      - name: Install Hub client
        id: hub
        if: steps.select.outputs.has_benchmarks == 'true' || steps.gallery.outputs.prepare == 'true'
        continue-on-error: true
        run: python -m pip install 'huggingface_hub>=1.0,<2'
      - name: Resolve the HF branch to one immutable commit
        id: reference
        if: (steps.select.outputs.has_benchmarks == 'true' || steps.gallery.outputs.prepare == 'true') && steps.hub.outcome == 'success'
        # Upstream mode can still build if reference resolution fails.
        # Archive mode requires an immutable input revision before execution.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/ci/benchmark_reproduction.py resolve

  reproduce:
    needs: changes
    if: needs.changes.outputs.has_benchmarks == 'true'
    name: Reproduce ${{ join(matrix.benchmarks, ', ') }}
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    # Stanford-ORB downloads about 95 GB upstream and 94 GB of reference tables.
    timeout-minutes: ${{ contains(matrix.benchmarks, 'stanford_orb') && 720 || 360 }}
    env:
      HF_REVISION: ${{ needs.changes.outputs.hf_revision }}
      REPRODUCTION_SOURCE_MODE: ${{ inputs.source_mode || 'archive' }}
      REPRODUCTION_LOCAL_ARCHIVE_DIR: ${{ vars.REPRODUCTION_LOCAL_ARCHIVE_DIR }}
      BENCHMARKS_JSON: ${{ toJSON(matrix.benchmarks) }}
      # Keep library thread pools bounded when many builders share this host.
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ARROW_IO_THREADS: '4'
    strategy:
      fail-fast: false
      # Bound concurrent environments and builds to the host's available storage.
      max-parallel: ${{ fromJSON(vars.REPRODUCTION_MAX_PARALLEL || '64') }}
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: measurement_db
    steps:
      - uses: actions/checkout@v4
        with:
          path: measurement_db
          persist-credentials: false
      - name: Initialize individual benchmark results
        run: /usr/bin/python3 scripts/ci/benchmark_reproduction_report.py init --report "$RUNNER_TEMP/benchmark-report/results.json"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            measurement_db/requirements.txt
            measurement_db/scripts/ci/reproduction-constraints.txt
      - name: Create a fresh job environment
        env:
          ENVIRONMENT_BASE: ${{ vars.REPRODUCTION_ENVIRONMENT_DIR }}
          MATRIX_INDEX: ${{ strategy.job-index }}
        run: |
          environment="$RUNNER_TEMP/measurement-db-venv"
          if [ -n "$ENVIRONMENT_BASE" ]; then
            environment="$ENVIRONMENT_BASE/reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MATRIX_INDEX"
          fi
          echo "REPRODUCTION_ENVIRONMENT=$environment" >> "$GITHUB_ENV"
          python -m venv --clear "$environment"
          echo "$environment/bin" >> "$GITHUB_PATH"
      - name: Install the build dependencies and matching Parquet writer
        run: python -m pip install -r requirements.txt -c scripts/ci/reproduction-constraints.txt
      - name: Select LexEval's declared ROUGE implementation
        if: contains(matrix.benchmarks, 'lexeval')
        # rouge-chinese also installs files in the rouge module. Install the
        # scorer declared by LexEval last so dependency order cannot change grades.
        run: python -m pip install --no-deps --force-reinstall 'rouge==1.0.1'
      - name: Use configured scratch storage for benchmark builds
        env:
          SCRATCH_BASE: ${{ vars.REPRODUCTION_SCRATCH_DIR || vars.GALLERY_SCRATCH_DIR }}
          MATRIX_INDEX: ${{ strategy.job-index }}
        run: |
          if [ -n "$SCRATCH_BASE" ]; then
            scratch="$SCRATCH_BASE/reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MATRIX_INDEX"
            mkdir -p "$scratch"
            echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
            echo "REPRODUCTION_SCRATCH=$scratch" >> "$GITHUB_ENV"
            # Source downloads belong to the same bounded job storage as builds.
            echo "HF_HUB_CACHE=$scratch/huggingface/hub" >> "$GITHUB_ENV"
            echo "HF_XET_CACHE=$scratch/huggingface/xet" >> "$GITHUB_ENV"
          fi
      - name: Rebuild selected inputs and compare every table byte for byte
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ci/benchmark_reproduction.py verify --source-mode "$REPRODUCTION_SOURCE_MODE" --revision "$HF_REVISION" --report "$RUNNER_TEMP/benchmark-report/results.json"
      - name: Summarize this group's benchmark results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: /usr/bin/python3 scripts/ci/benchmark_reproduction_report.py finalize --report "$RUNNER_TEMP/benchmark-report/results.json" --job-status "$JOB_STATUS"
      - name: Upload individual benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/benchmark-report/results.json
          if-no-files-found: warn
      - name: Remove this job's build scratch and Python environment
        if: always()
        run: |
          if [ -n "${REPRODUCTION_SCRATCH:-}" ]; then
            rm -rf -- "$REPRODUCTION_SCRATCH"
          fi
          if [ -n "${REPRODUCTION_ENVIRONMENT:-}" ]; then
            rm -rf -- "$REPRODUCTION_ENVIRONMENT"
          fi

  report:
    name: Benchmark report
    env:
      REPRODUCTION_SOURCE_MODE: ${{ inputs.source_mode || 'archive' }}
    needs: [changes, reproduce]
    if: always() && needs.changes.result != 'skipped'
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: measurement_db
          persist-credentials: false
      - name: Download every group's results
        id: results
        if: needs.changes.outputs.has_benchmarks == 'true'
        continue-on-error: true
        # v8.0.1 includes the final artifact page when a run has over 100 groups.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-results-*
          path: ${{ runner.temp }}/benchmark-results
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Publish the complete benchmark report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          WITHHELD_JSON: ${{ needs.changes.outputs.withheld }}
          HF_REVISION: ${{ needs.changes.outputs.hf_revision }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOWNLOAD_OUTCOME: ${{ steps.results.outcome }}
        run: >-
          /usr/bin/python3 measurement_db/scripts/ci/benchmark_reproduction_report.py aggregate
          --reports-dir "$RUNNER_TEMP/benchmark-results"
          --output-dir "$RUNNER_TEMP/benchmark-run-report"
      - name: Upload the complete benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-run-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-run-report/
          if-no-files-found: warn

  prepare-gallery:
    name: Prepare gallery
    needs: [changes, report]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.report.result == 'success' &&
      needs.changes.outputs.prepare_gallery == 'true'
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    timeout-minutes: 720
    env:
      GALLERY_CACHE_DIR: ${{ vars.GALLERY_CACHE_DIR }}
      GALLERY_SCRATCH_DIR: ${{ vars.GALLERY_SCRATCH_DIR }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REVISION: ${{ needs.changes.outputs.hf_revision }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ARROW_IO_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure gallery scratch storage
        id: storage
        run: |
          root="${GALLERY_SCRATCH_DIR:-$RUNNER_TEMP}"
          directory="$root/gallery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$directory/tmp"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "GALLERY_JOB_DIR=$directory" >> "$GITHUB_ENV"
          echo "TMPDIR=$directory/tmp" >> "$GITHUB_ENV"
          if [ -n "$GALLERY_SCRATCH_DIR" ]; then
            # Share immutable Hub downloads across this host's runner pool and
            # keep large downloads off the runner checkout filesystem.
            mkdir -p "$root/huggingface/hub" "$root/huggingface/xet" "$root/pip"
            echo "HF_HUB_CACHE=$root/huggingface/hub" >> "$GITHUB_ENV"
            echo "HF_XET_CACHE=$root/huggingface/xet" >> "$GITHUB_ENV"
            echo "PIP_CACHE_DIR=$root/pip" >> "$GITHUB_ENV"
          fi
          df -h "$directory"
      - uses: actions/setup-python@v5
        with:
          # Keep the preparation cache identity identical across runner caches.
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: scripts/ci/gallery-requirements.txt
      - name: Install isolated preparation dependencies
        run: |
          python -m venv --clear "$GALLERY_JOB_DIR/venv"
          echo "$GALLERY_JOB_DIR/venv/bin" >> "$GITHUB_PATH"
          "$GALLERY_JOB_DIR/venv/bin/pip" install -r scripts/ci/gallery-requirements.txt 'pytest>=8,<10'
          "$GALLERY_JOB_DIR/venv/bin/pip" install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Test gallery parity, cache reuse, and artifact integrity
        run: python -m pytest -q tests/test_gallery_*.py
      - name: Download this run's validation receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-run-report-${{ github.run_attempt }}
          path: ${{ steps.storage.outputs.directory }}/validation
      - name: Prepare benchmark bundles with four workers and stage timings
        run: >-
          python -m scripts.ci.gallery_prepare
          --report "$GALLERY_JOB_DIR/validation/results.json"
          --out "$GALLERY_JOB_DIR/candidate"
          --workers 4
      - name: Upload prepared benchmark archives and validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-candidate-${{ github.run_attempt }}
          path: ${{ steps.storage.outputs.directory }}/candidate/handoff/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload the small candidate manifest for merge lookup
        uses: actions/upload-artifact@v4
        with:
          name: gallery-manifest-${{ github.run_attempt }}
          path: |
            ${{ steps.storage.outputs.directory }}/candidate/manifest.json
            ${{ steps.storage.outputs.directory }}/candidate/validation.json
          retention-days: 30
          if-no-files-found: error

  preview:
    name: Preview prepared website
    needs: prepare-gallery
    if: ${{ !cancelled() && needs.prepare-gallery.result == 'success' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/deploy-website.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit

  ready:
    # Push runs must not publish the PR gate's check name: they deliberately
    # skip preparation and could otherwise satisfy protection with stale data.
    name: ${{ github.event_name == 'pull_request' && 'Gallery ready' || 'Gallery preparation (non-PR)' }}
    needs: [changes, report, prepare-gallery, preview]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.repository == 'aims-foundations/measurement-db'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation and any requested preparation and preview
        env:
          # Dependabot is excluded from preparation because it cannot use the
          # deployment secrets; its skipped preparation must not pass this gate.
          CONTRIBUTOR_BRANCH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          CHANGES: ${{ needs.changes.result }}
          REPORT: ${{ needs.report.result }}
          PREPARE: ${{ needs.changes.outputs.prepare_gallery }}
          PREPARED: ${{ needs.prepare-gallery.result }}
          PREVIEW: ${{ needs.preview.result }}
        run: |
          test "$CONTRIBUTOR_BRANCH" = true
          test "$CHANGES" = success
          test "$REPORT" = success
          if [ "$PREPARE" = true ]; then
            test "$PREPARED" = success
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$PREVIEW" = success; fi
          fi
