name: Benchmark table reproduction

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark folders to rebuild, comma-separated (empty means all benchmarks)'
        type: string
        required: false
      source_mode:
        description: 'Archived snapshots for reproduction, or upstream for author-source checks'
        type: choice
        options: [archive, upstream]
        default: archive

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: benchmark-reproduction-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Rebuild reviewed repository branches; fork PRs must not execute on this host.
    if: >-
      github.repository == 'aims-foundations/measurement-db' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_benchmarks: ${{ steps.select.outputs.has_benchmarks }}
      withheld: ${{ steps.select.outputs.withheld }}
      hf_revision: ${{ steps.reference.outputs.revision }}
    defaults:
      run:
        working-directory: measurement_db
    steps:
      - uses: actions/checkout@v4
        with:
          path: measurement_db
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create a fresh job environment
        run: |
          python -m venv --clear "$RUNNER_TEMP/measurement-db-venv"
          echo "$RUNNER_TEMP/measurement-db-venv/bin" >> "$GITHUB_PATH"
      - name: Install the metadata reader
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Test change detection, release policy, and strict byte comparison
        run: python -m unittest discover -s tests -p 'test_benchmark_reproduction*.py' -v
      - name: Read release metadata and select public benchmarks
        id: select
        run: python scripts/ci/benchmark_reproduction.py select
      - name: Install Hub client
        id: hub
        if: steps.select.outputs.has_benchmarks == 'true'
        continue-on-error: true
        run: python -m pip install 'huggingface_hub>=1.0,<2'
      - name: Resolve the HF branch to one immutable commit
        id: reference
        if: (steps.select.outputs.has_benchmarks == 'true') && steps.hub.outcome == 'success'
        # Upstream mode can still build if reference resolution fails.
        # Archive mode requires an immutable input revision before execution.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/ci/benchmark_reproduction.py resolve

  reproduce:
    needs: changes
    if: needs.changes.outputs.has_benchmarks == 'true'
    name: Reproduce ${{ join(matrix.benchmarks, ', ') }}
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    # Stanford-ORB downloads about 95 GB upstream and 94 GB of reference tables.
    timeout-minutes: ${{ contains(matrix.benchmarks, 'stanford_orb') && 720 || 360 }}
    env:
      HF_REVISION: ${{ needs.changes.outputs.hf_revision }}
      REPRODUCTION_SOURCE_MODE: ${{ inputs.source_mode || 'archive' }}
      REPRODUCTION_LOCAL_ARCHIVE_DIR: ${{ vars.REPRODUCTION_LOCAL_ARCHIVE_DIR }}
      BENCHMARKS_JSON: ${{ toJSON(matrix.benchmarks) }}
      # Keep library thread pools bounded when many builders share this host.
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ARROW_IO_THREADS: '4'
    strategy:
      fail-fast: false
      # Bound concurrent environments and builds to the host's available storage.
      max-parallel: ${{ fromJSON(vars.REPRODUCTION_MAX_PARALLEL || '64') }}
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: measurement_db
    steps:
      - uses: actions/checkout@v4
        with:
          path: measurement_db
          persist-credentials: false
      - name: Initialize individual benchmark results
        run: /usr/bin/python3 scripts/ci/benchmark_reproduction_report.py init --report "$RUNNER_TEMP/benchmark-report/results.json"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            measurement_db/requirements.txt
            measurement_db/scripts/ci/reproduction-constraints.txt
      - name: Create a fresh job environment
        env:
          ENVIRONMENT_BASE: ${{ vars.REPRODUCTION_ENVIRONMENT_DIR }}
          MATRIX_INDEX: ${{ strategy.job-index }}
        run: |
          environment="$RUNNER_TEMP/measurement-db-venv"
          if [ -n "$ENVIRONMENT_BASE" ]; then
            environment="$ENVIRONMENT_BASE/reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MATRIX_INDEX"
          fi
          echo "REPRODUCTION_ENVIRONMENT=$environment" >> "$GITHUB_ENV"
          python -m venv --clear "$environment"
          echo "$environment/bin" >> "$GITHUB_PATH"
      - name: Install the build dependencies and matching Parquet writer
        run: python -m pip install -r requirements.txt -c scripts/ci/reproduction-constraints.txt
      - name: Select LexEval's declared ROUGE implementation
        if: contains(matrix.benchmarks, 'lexeval')
        # rouge-chinese also installs files in the rouge module. Install the
        # scorer declared by LexEval last so dependency order cannot change grades.
        run: python -m pip install --no-deps --force-reinstall 'rouge==1.0.1'
      - name: Use configured scratch storage for benchmark builds
        env:
          SCRATCH_BASE: ${{ vars.REPRODUCTION_SCRATCH_DIR || vars.GALLERY_SCRATCH_DIR }}
          MATRIX_INDEX: ${{ strategy.job-index }}
        run: |
          if [ -n "$SCRATCH_BASE" ]; then
            scratch="$SCRATCH_BASE/reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MATRIX_INDEX"
            mkdir -p "$scratch"
            echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
            echo "REPRODUCTION_SCRATCH=$scratch" >> "$GITHUB_ENV"
            # Source downloads belong to the same bounded job storage as builds.
            echo "HF_HUB_CACHE=$scratch/huggingface/hub" >> "$GITHUB_ENV"
            echo "HF_XET_CACHE=$scratch/huggingface/xet" >> "$GITHUB_ENV"
          fi
      - name: Rebuild selected inputs and compare every table byte for byte
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ci/benchmark_reproduction.py verify --source-mode "$REPRODUCTION_SOURCE_MODE" --revision "$HF_REVISION" --report "$RUNNER_TEMP/benchmark-report/results.json"
      - name: Summarize this group's benchmark results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: /usr/bin/python3 scripts/ci/benchmark_reproduction_report.py finalize --report "$RUNNER_TEMP/benchmark-report/results.json" --job-status "$JOB_STATUS"
      - name: Upload individual benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/benchmark-report/results.json
          if-no-files-found: warn
      - name: Remove this job's build scratch and Python environment
        if: always()
        run: |
          if [ -n "${REPRODUCTION_SCRATCH:-}" ]; then
            rm -rf -- "$REPRODUCTION_SCRATCH"
          fi
          if [ -n "${REPRODUCTION_ENVIRONMENT:-}" ]; then
            rm -rf -- "$REPRODUCTION_ENVIRONMENT"
          fi

  report:
    name: Benchmark report
    env:
      REPRODUCTION_SOURCE_MODE: ${{ inputs.source_mode || 'archive' }}
    needs: [changes, reproduce]
    if: always() && needs.changes.result != 'skipped'
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: measurement_db
          persist-credentials: false
      - name: Download every group's results
        id: results
        if: needs.changes.outputs.has_benchmarks == 'true'
        continue-on-error: true
        # v8.0.1 includes the final artifact page when a run has over 100 groups.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-results-*
          path: ${{ runner.temp }}/benchmark-results
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Publish the complete benchmark report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_JSON: ${{ needs.changes.outputs.matrix }}
          WITHHELD_JSON: ${{ needs.changes.outputs.withheld }}
          HF_REVISION: ${{ needs.changes.outputs.hf_revision }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOWNLOAD_OUTCOME: ${{ steps.results.outcome }}
        run: >-
          /usr/bin/python3 measurement_db/scripts/ci/benchmark_reproduction_report.py aggregate
          --reports-dir "$RUNNER_TEMP/benchmark-results"
          --output-dir "$RUNNER_TEMP/benchmark-run-report"
      - name: Upload the complete benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-run-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-run-report/
          if-no-files-found: warn
