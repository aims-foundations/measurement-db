name: Deploy website to Vercel

on:
  workflow_call:
    inputs:
      candidate_run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful preparation run ID (empty: find the candidate matching this Git tree)'
        type: string
        required: false
      reuse_published_gallery:
        description: 'Fast preview using the accepted published gallery (non-main branches only)'
        type: boolean
        default: false
      preview_pr:
        description: 'PR number for the review alias (optional)'
        type: string
        required: false
      preview_gallery_revision:
        description: 'Pinned unpromoted gallery commit for a migration preview (non-main only)'
        type: string
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for benchmark or website changes
        id: check
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          website_changed=false
          if [ -n "$CANDIDATE_RUN_ID" ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            website_changed=true
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              BEFORE=$(git merge-base "$BEFORE" "$AFTER")
            fi
            changed_paths=$(git diff --name-only --no-renames "$BEFORE" "$AFTER" -- \
              benchmarks/ website/ schema.md scripts/render_website/ \
              scripts/analyze_measurements/ scripts/ci/ .github/workflows/deploy-website.yml \
              .github/workflows/prepare-gallery.yml)
            if [ -n "$changed_paths" ]; then website_changed=true; fi
          fi
          echo "deploy=$website_changed" >> "$GITHUB_OUTPUT"

  deploy:
    defaults:
      run:
        working-directory: ${{ env.DEPLOY_CODE_DIR }}
    needs: changes
    if: >-
      needs.changes.outputs.deploy == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    concurrency:
      group: vercel-measurement-db-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    timeout-minutes: 90
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.number) || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
      url: ${{ steps.deploy.outputs.url }}/measurement-db
    env:
      GALLERY_CACHE_DIR: ${{ vars.GALLERY_CACHE_DIR }}
      DEPLOY_CODE_DIR: ${{ vars.GALLERY_SCRATCH_DIR != '' && format('{0}/website-{1}-{2}/repo', vars.GALLERY_SCRATCH_DIR, github.run_id, github.run_attempt) || github.workspace }}
      REUSE_PUBLISHED_GALLERY: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_published_gallery || false }}
      PREVIEW_GALLERY_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_gallery_revision || '' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: '1'
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MEILISEARCH_HOST: ${{ vars.MEILISEARCH_HOST }}
      MEILISEARCH_ADMIN_KEY: ${{ secrets.MEILISEARCH_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure deployment scratch storage
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$REUSE_PUBLISHED_GALLERY" = true ]; then
            test "$DEPLOY_ENV" = preview
          fi
          if [ "$DEPLOY_CODE_DIR" != "$GITHUB_WORKSPACE" ]; then
            mkdir -p "$DEPLOY_CODE_DIR"
            cp -a "$GITHUB_WORKSPACE/." "$DEPLOY_CODE_DIR/"
          fi
          directory="${DEPLOY_CODE_DIR}/.deployment"
          mkdir -p "$directory/tmp"
          echo "DEPLOY_JOB_DIR=$directory" >> "$GITHUB_ENV"
          echo "TMPDIR=$directory/tmp" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Read optional search configuration
        id: search
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { enabled } = JSON.parse(readFileSync('website/meilisearch.config.json', 'utf8'));
          if (typeof enabled !== 'boolean') throw new Error('Meilisearch enabled must be a boolean.');
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          const message = enabled
            ? 'Meilisearch enabled; production search indexes will be synchronized.'
            : 'Meilisearch disabled; local benchmark search remains available and cloud sync is skipped.';
          console.log(message);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          NODE
      - name: Check deployment credentials
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID HF_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Pull Vercel environment
        run: |
          flags=()
          if [ "$DEPLOY_ENV" = preview ]; then flags+=(--git-branch="$DEPLOY_BRANCH"); fi
          pnpm dlx vercel@62.2.0 pull --yes --environment="$DEPLOY_ENV" \
            "${flags[@]}" --token="$VERCEL_TOKEN"
      - name: Verify Vercel project settings
        run: |
          node --input-type=module - <<'NODE'
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const projectUrl = new URL(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}`);
          projectUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(projectUrl, {
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) fail(`Vercel project check returned HTTP ${response.status}.`);
          const project = await response.json();
          if (project.rootDirectory !== 'website' || project.framework !== 'nextjs') {
            fail('The Vercel project must use the website root directory and Next.js framework.');
          }
          console.log('Vercel project verified; viewer data is included in the deployment.');
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the artifact download client
        run: |
          python -m venv --clear "$DEPLOY_JOB_DIR/venv"
          echo "$DEPLOY_JOB_DIR/venv/bin" >> "$GITHUB_PATH"
          "$DEPLOY_JOB_DIR/venv/bin/pip" install 'huggingface_hub>=1,<2'
      - name: Download the validated candidate matching this Git tree
        if: env.REUSE_PUBLISHED_GALLERY != 'true' && env.PREVIEW_GALLERY_REVISION == ''
        run: >-
          python -m scripts.ci.gallery_release download
          --run-id "$CANDIDATE_RUN_ID"
          --candidate "$DEPLOY_JOB_DIR/candidate"
      - name: Restore verified static files and generated catalogs
        if: env.REUSE_PUBLISHED_GALLERY != 'true' && env.PREVIEW_GALLERY_REVISION == ''
        run: >-
          python -m scripts.ci.gallery_release restore
          --candidate "$DEPLOY_JOB_DIR/candidate"
      - name: Restore accepted published data for a fast website preview
        if: env.REUSE_PUBLISHED_GALLERY == 'true' && env.PREVIEW_GALLERY_REVISION == ''
        run: >-
          python -m scripts.ci.gallery_release preview
          --candidate "$DEPLOY_JOB_DIR/candidate"
      - name: Restore pinned unpromoted data for a migration preview
        if: env.PREVIEW_GALLERY_REVISION != ''
        run: >-
          python -m scripts.ci.gallery_preview
          --revision "$PREVIEW_GALLERY_REVISION"
          --candidate "$DEPLOY_JOB_DIR/candidate"
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website lint
      - run: pnpm --dir website typecheck
      - run: pnpm --dir website search:check
      - name: Build Vercel output
        run: |
          flags=()
          if [ "$DEPLOY_ENV" = production ]; then flags+=(--prod); fi
          pnpm dlx vercel@62.2.0 build "${flags[@]}" --token="$VERCEL_TOKEN"
      - name: Check the upload file budget
        run: |
          python - <<'PY'
          from pathlib import Path
          count = sum(path.is_file() for path in Path('.vercel/output').rglob('*'))
          if not 0 < count < 10000:
              raise SystemExit(f'Unexpected Vercel output file count: {count}; investigate gallery packing')
          print(f'Vercel output contains {count} files (budget: 10,000).')
          PY
      - name: Publish the accepted gallery release to HF
        if: env.DEPLOY_ENV == 'production'
        id: gallery
        run: >-
          python -m scripts.ci.gallery_release publish
          --candidate "$DEPLOY_JOB_DIR/candidate"
      - name: Deploy
        id: deploy
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/website/scripts/vercel-fetch.cjs
        run: |
          url=$(pnpm dlx vercel@62.2.0 deploy --prebuilt --target="$DEPLOY_ENV" \
            --env HF_TOKEN="$HF_TOKEN" \
            --meta githubDeployment=1 --meta githubCommitRef="$DEPLOY_BRANCH" \
            --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Website: $url/measurement-db" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or reuse the PR review link
        if: env.DEPLOY_ENV == 'preview' && (github.event_name == 'pull_request' || inputs.preview_pr != '')
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.number || inputs.preview_pr }}
        run: python scripts/ci/vercel_preview_link.py --url "$DEPLOYMENT_URL" --pr "$PR_NUMBER"
      - name: Check deployed pages
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in /measurement-db /measurement-db/schema-definition /measurement-db/researchcodebench /measurement-db/benchmark-data/researchcodebench/records/manifest.json; do
            pnpm dlx vercel@62.2.0 curl "$path" --deployment "$DEPLOYMENT_URL" \
              -- --fail --silent --show-error --max-time 120 --output /dev/null
          done
          status=$(pnpm dlx vercel@62.2.0 curl /measurement-db/api/gallery-source/researchcodebench/items \
            --deployment "$DEPLOYMENT_URL" -- --fail --silent --show-error --max-time 120 \
            --retry 6 --retry-delay 30 --retry-max-time 600 --range 0-99 \
            --output /dev/null --write-out '%{http_code}')
          [[ "$status" = 307 || "$status" = 206 ]]
          node - <<'JS'
          const assert = require('node:assert/strict');
          const records = require('./website/content/generated/gallery-records.json');
          const sources = require('./website/content/generated/gallery-sources.json');
          assert.deepEqual(Object.keys(records).sort(), Object.keys(sources).sort());
          for (const entry of Object.values(records)) {
            assert.ok(entry.manifest.windows && entry.manifest.pack);
            assert.ok(entry.manifest.windows.maxRows <= 4096);
            assert.ok(entry.manifest.windows.maxBytes <= 2 * 1024 * 1024);
          }
          console.log(`Every published benchmark uses canonical records (${Object.keys(records).length}).`);
          JS
          for slug in aegis real_pocqi mmlu kernelbench monkey_power_laws; do
            for path in "/measurement-db/$slug" "/measurement-db/benchmark-data/$slug/records/manifest.json" "/measurement-db/benchmark-data/$slug/records/pack-index.json" "/measurement-db/benchmark-data/$slug/records-validation.json"; do
              pnpm dlx vercel@62.2.0 curl "$path" --deployment "$DEPLOYMENT_URL" \
                -- --fail --silent --show-error --max-time 120 --output /dev/null
            done
          done
      - name: Sync production search indexes
        if: env.DEPLOY_ENV == 'production' && steps.search.outputs.enabled == 'true'
        run: pnpm --dir website search:sync
