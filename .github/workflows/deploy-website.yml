name: Packed gallery preview experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/perf/gallery-packed-preview'
    runs-on: [self-hosted, linux, x64, measurement-db-reproduction]
    timeout-minutes: 90
    concurrency:
      group: gallery-packed-preview-experiment
      cancel-in-progress: false
    environment: preview
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPERIMENT_RESULTS: /lfs/skampere1/0/sttruong/aims/measurement-db-worktrees/gallery-feasibility-20261012/preview-runs/${{ github.run_id }}/${{ github.run_attempt }}
      PREPARED: /lfs/skampere1/0/sttruong/aims/measurement-db-worktrees/gallery-feasibility-20261012/preview-input
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Verify preview target
        run: python scripts/ci/packed_preview_experiment.py preflight
      - name: Restore the checksummed local experiment snapshot
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ['PREPARED'])
          data = (source / 'manifest.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '15bfa5258ab60087676fc50673d3e4ee563071b33c256c95b34821679091e1a3'
          manifest = json.loads(data)
          assert manifest['benchmarks'] == 270
          for entry in manifest['files']:
              path = Path(entry['path'])
              assert path.parts[0] == 'website' and '..' not in path.parts
              payload = (source / path).read_bytes()
              assert len(payload) == entry['bytes'] and hashlib.sha256(payload).hexdigest() == entry['sha256']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(payload)
          print('Restored verified packed data and catalogs for 270 benchmarks.')
      - run: pnpm --dir website install --frozen-lockfile
      - run: node website/scripts/test-gallery-lookup.mjs
      - run: pnpm --dir website lint
      - run: pnpm --dir website typecheck
      - name: Pull preview environment
        run: pnpm dlx vercel@62.2.0 pull --yes --environment=preview --git-branch=perf/gallery-packed-preview --token="$VERCEL_TOKEN"
      - name: Build the full preview
        run: pnpm dlx vercel@62.2.0 build --token="$VERCEL_TOKEN"
      - name: Initial packed upload
        run: python scripts/ci/packed_preview_experiment.py deploy --label initial
      - name: Repeat with identical build output
        run: python scripts/ci/packed_preview_experiment.py deploy --label repeat
      - name: Change one prompt in preview output
        run: python scripts/ci/packed_preview_experiment.py edit
      - name: Measure one-benchmark update
        run: python scripts/ci/packed_preview_experiment.py deploy --label one-benchmark
      - name: Create an experiment preview link for the unchanged data
        run: python scripts/ci/packed_preview_experiment.py share
      - name: Upload non-sensitive measurement summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-preview-measurements
          path: |
            ${{ env.EXPERIMENT_RESULTS }}/*-summary.json
            ${{ env.EXPERIMENT_RESULTS }}/*-requests.jsonl
            ${{ env.EXPERIMENT_RESULTS }}/controlled-edit.json
            ${{ env.EXPERIMENT_RESULTS }}/final-state.json
          if-no-files-found: ignore
