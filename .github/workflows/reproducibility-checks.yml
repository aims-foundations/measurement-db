name: Reproducibility contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==8.3.5 httpx==0.28.1
      - name: Validate procedures without paid calls or containers
        run: |
          bash -n scripts/reproduce_evaluations/procedure.sh
          for benchmark in matharena mmdocrag multi_swebench real_webagents researchcodebench swe_rebench; do
            bash -n "benchmarks/$benchmark/reproduction_checks/check.sh"
          done
          python -m pytest -q tests/reproduction
