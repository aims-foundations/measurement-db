name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/render_website/**'
      - 'scripts/analyze_measurements/**'
      - 'tests/**'
      - 'schema.md'
      - 'requirements.txt'
      - '.github/workflows/website.yml'
      - '.github/workflows/deploy-website.yml'
  push:
    branches: [main, 'migration/**']
    paths:
      - 'website/**'
      - 'scripts/render_website/**'
      - 'scripts/analyze_measurements/**'
      - 'tests/**'
      - 'schema.md'
      - 'requirements.txt'
      - '.github/workflows/website.yml'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest==8.3.5
      - name: Test rendering and analysis without downloads
        run: >-
          python -m pytest -q tests/test_ai_subjects.py
          tests/test_benchmark_saturation.py tests/test_fit_rasch_models.py
          tests/test_generate_benchmark_attributions.py
          tests/test_generate_benchmark_gallery.py tests/test_generate_chart_marginals.py
          tests/test_gallery_output_parity.py tests/test_gallery_response_filenames.py
          tests/test_website_deployment.py
      - run: python scripts/render_website/generate_benchmark_attributions.py --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website lint
      - run: pnpm --dir website build --webpack
      - run: pnpm --dir website search:check
