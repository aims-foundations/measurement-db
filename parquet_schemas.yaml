# Parquet schema version 3 (stored in measurement_db.schema_version metadata).
# Single source of truth for the canonical columns in the six per-benchmark
# parquet schemas. Every benchmark writes exactly these columns, in this order,
# with these types and nullability. Benchmark-specific extra columns are rejected.
#
# The operational owners are:
#   * `scripts/build_measurement_tables/validate_measurement_tables.py`
#       — loads these schemas and validates all six table types
#   * `scripts/build_measurement_tables/write_measurement_tables.py`
#       — writes subjects / items / benchmarks
#   * `build_base.py` — writes responses / traces / assets
#
# ENFORCED, not just documentation: `validate_table` checks every table's
# canonical columns against this file immediately before it is written
# (column presence and order, `nullable`, `type`) and raises on violation, so a
# build that breaks the canonical schema fails loudly.
#
# Column ORDER here is the written column order — do not reorder casually.
# A column with `derived: true` is computed by shared build code rather than
# supplied as a free-form field (`BenchmarkBuild.add_response` derives
# `response_id`; the terminal build pipeline derives benchmark statistics).
# Derived columns are excluded from legacy registration-time column lists but
# included when a modern build registers and writes its completed benchmark row.
#
# Every canonical column is written even when all-null (e.g. test_condition).
# Storage types are explicit: float64, int64, string, bool, binary, and
# list<string>, with the declared nullability even for empty/all-null columns.
# Each primary_key is non-null and unique within its table. Validation rejects
# identical and conflicting duplicate rows without deduplicating them. The same
# subject may retain its subject_id in a different benchmark's subjects table.
# Retiring columns requires an explicit schema-version migration.

subjects:
  file: "{dataset}/formatted_tables/subjects.parquet"
  primary_key: [subject_id]
  description: >-
    The AI test-takers (models, agents, judges, classifiers) this benchmark
    evaluated — one row per distinct subject configuration.
  columns:
    - name: subject_id
      type: string
      nullable: false
      description: >-
        Primary key. sha256 of canonical model identity plus every metadata
        column at its observed value (nulls included), truncated to 16 hex
        chars. Pass the upstream AI-system label and final
        harness/reasoning/other subject features to `add_subject` (or the
        lower-level `resolve_subject`).
    - name: display_name
      type: string
      nullable: false
      description: The AI system's name as given by the provider / upstream source.
    - name: normalized_name
      type: string
      nullable: true
      description: >-
        Canonical model name from `scripts/build_measurement_tables/map_model_registry.json`,
        auto-filled by `resolve_subject(raw_label)`. Null when the provider's
        released label has no established registry mapping; display_name and
        the raw-label fallback identity still preserve that subject.
    - name: provider
      type: string
      nullable: true
      description: >-
        Provider of the AI system (OpenAI, Anthropic, Meta, Alibaba, ...) —
        the registry entry's `company`, auto-filled together with `normalized_name`.
        Null when no provider mapping is established; never inferred from the label.
    - name: release_date
      type: string
      nullable: true
      description: >-
        Date of first public release of the canonical model (one date per
        `normalized_name`, `YYYY-MM-DD` or `YYYY-MM`) when established by an
        upstream source; null when no defensible release date is known.
        Auto-filled from the registry entry's `release_date`; a non-null
        value's `release_date_url` cites the provider announcement, official
        HF repo, or model paper.
    - name: access_date
      type: string
      nullable: true
      description: >-
        When this benchmark queried the model — caller-supplied and
        per-benchmark, not in `map_model_registry.json`. Subject metadata, so it
        never reaches responses.parquet.
    - name: harness
      type: string
      nullable: true
      description: The agent scaffold the system ran inside (e.g. Claude Code, Codex). Passed at subject registration; part of the `subject_id` hash.
    - name: reasoning_effort
      type: string
      nullable: true
      description: The reasoning/thinking effort the system was configured to. Passed at subject registration; part of the `subject_id` hash.
    - name: harness_version
      type: string
      nullable: true
      description: The version of `harness`. Passed at subject registration; part of the `subject_id` hash.
    - name: subject_features_extra
      type: string
      nullable: true
      description: Any other features of the subject. Passed at subject registration; part of the `subject_id` hash.

items:
  file: "{dataset}/formatted_tables/items.parquet"
  primary_key: [item_id]
  description: One row per distinct stimulus and grading protocol within this benchmark.
  columns:
    - name: item_id
      type: string
      nullable: false
      description: >-
        Primary key: the first 16 hex chars of a SHA-256 hash over benchmark,
        normalized content, item features, asset manifest, grading_criterion,
        the complete canonical verifier, and the effective response scale
        (inherited from the benchmark or specified in a mixed-scale criterion).
        New registrations use item identity version 4. Equivalent effective
        scales have the same identity regardless of where they are declared.
        Content is NFC-normalized and stripped. Canonical JSON formatting and
        key order do not affect identity; text inside the criterion and verifier
        is preserved exactly. Legacy ungraded IDs are not rewritten automatically.
    - name: benchmark_id
      type: string
      nullable: false
      description: The owning benchmark; constant within a single items file.
    - name: raw_item_id
      type: string
      nullable: false
      description: Original item identifier from the upstream data, kept for traceability.
    - name: content
      type: string
      nullable: true
      description: >-
        The exact released textual component of the prompt / question. For
        agentic/coding tasks include the full task specification the subject
        was given. This might include the issue or instruction text and the
        identifiers that make it answerable (e.g., repo, base commit,
        environment image). If an unreleased harness transformation prevents
        exact prompt reconstruction, preserve the known text and linked files
        and document that gap rather than fabricating it. Null is permitted only
        when asset_manifest supplies the complete non-text stimulus (or in a
        legacy folder built before this rule).
    - name: asset_manifest
      type: string
      nullable: true
      description: >-
        Canonical compact JSON array linking this item to exact byte payloads
        in assets.parquet. Entries are ordered and contain exactly asset_id,
        path (a stable logical relative POSIX path), media_type, role, and a
        1-based ordinal. The role records whether the file was input data, a
        source document, or another item artifact; a link alone does not claim
        that raw bytes were directly delivered to the subject. Null when the
        item has no external files. The manifest is part of item identity; the
        curator's local source path is not.
    - name: grading_criterion
      type: string
      nullable: false
      description: >-
        Canonical JSON object with reference_answer and rule fields. Each is
        a nonempty string or null, and at least one must be nonempty. The
        answer is a released answer/reference solution; the rule is a rubric,
        test requirement, tolerance, or other condition used to assign a grade.
        Both may be supplied. The complete criterion contributes to item identity.
        For mixed-scale benchmarks, also requires response_scale: a concrete
        discrete or interval object using the benchmarks.response_scale format.
        Uniform benchmark scales are inherited and must not be repeated here.
    - name: verifier
      type: string
      nullable: false
      description: >-
        Canonical JSON of how the response was graded — exactly one of two
        classes: a `Judge` (an LLM or human reads the response) or an
        `ExactMatcher` (a deterministic rule). The complete protocol is part
        of item identity for both text and asset-bearing items; JSON key
        order and formatting do not affect identity. Required. Describes the
        grader or implementation that applies grading_criterion, including
        parsing, normalization, prompts, or executable implementation details.
    - name: content_hash
      type: string
      nullable: true
      description: >-
        `sha256(normalized_content)[:16]`. Makes cross-benchmark duplicate
        detection a simple equality query; deliberately computed WITHOUT
        item features so feature variants of one prompt remain discoverable
        as duplicates.
    - name: item_features
      type: string
      nullable: true
      description: >-
        Canonical sorted `key=value;...` encoding of the item's features;
        empty/null when the item has none. Part of the `item_id` hash — the
        same content under two feature values is two items. Pass the complete,
        final feature mapping when the item is registered.

assets:
  file: "{dataset}/formatted_tables/assets.parquet"
  primary_key: [asset_id]
  description: >-
    Exact external-file bytes referenced by items.asset_manifest. One row per
    distinct byte payload within the benchmark; shared files are content-
    addressed once and may be linked from many items. This optional table is
    omitted when no item has attachments.
  columns:
    - name: asset_id
      type: string
      nullable: false
      description: Primary key and full lowercase SHA-256 digest of data.
    - name: benchmark_id
      type: string
      nullable: false
      description: The benchmark that owns this sidecar row.
    - name: byte_size
      type: int
      nullable: false
      description: Exact number of bytes in data.
    - name: data
      type: binary
      nullable: false
      description: Exact file bytes; media type and logical filename live on each item link.

benchmarks:
  file: "{dataset}/formatted_tables/benchmarks.parquet"
  primary_key: [benchmark_id]
  description: A single row describing the benchmark's own metadata.
  columns:
    - name: benchmark_id
      type: string
      nullable: false
      description: Primary key, typically the same as the folder name (e.g. `mtbench`).
    - name: name
      type: string
      nullable: false
      description: Display name of the benchmark (e.g. "MT-Bench").
    - name: version
      type: string
      nullable: true
      description: >-
        Upstream benchmark release identifier from metadata.yaml's
        benchmark.version (or INFO.version), preserved verbatim. Null when
        omitted or unknown. Distinct from the table schema version, builder
        contract version, and revisions of individual source artifacts.
    - name: license
      type: string
      nullable: false
      description: SPDX license identifier.
    - name: source_url
      type: string
      nullable: false
      description: URL of the upstream repository or paper the data was ingested from.
    - name: description
      type: string
      nullable: false
      description: Full human-readable overview of the benchmark.
    - name: one_line_description
      type: string
      nullable: true
      description: >-
        Concise display-ready summary of the benchmark. Starts with an active
        present-tense verb, omits the benchmark name, contains no logical
        newline, and is at most 160 characters. Null for legacy definitions
        not yet migrated to this field.
    - name: modality
      type: list[string]
      nullable: false
      description: >-
        Input modalities required to solve items: "text", "image", "video",
        "grid", "gui_screenshot", or "audio". Defaults to ["text"]. Multimodal
        benchmarks list multiple modalities.
    - name: domain
      type: list[string]
      nullable: false
      description: >-
        One or more of the canonical domains in
        `scripts/build_measurement_tables/define_benchmark_vocabulary.py`
        (`DOMAINS`):
        "software_engineering", "ml_engineering", "mathematics", "science",
        "medicine", "law", "finance", "cybersecurity", "cultural",
        "education", "knowledge", "reasoning", "safety",
        "agents_and_tool_use", "preference", "reward_modeling", "nlp_task",
        "multilingual", "general". Defaults to ["general"]. A benchmark
        carries as many domains as genuinely apply; prefer a specific domain
        over "general" and drop "general" when another tag is present. The
        list is a norm, not a hard closed set — propose a new domain rather
        than forcing a poor fit (new domains are added by decision).
    - name: multi_single_turn
      type: string
      nullable: false
      description: >-
        Whether the benchmark measures the subject over one exchange or
        several. "single_turn" if the subject receives no additional input
        after its first output; "multi_turn" if it receives anything
        afterward, from a counterpart or an environment (tool results, bash
        output, a re-rendered page — agent loops are "multi_turn"). If items
        genuinely span both structures, "multi_turn, single_turn". No
        default: every build declares this explicitly from evidence about
        how the benchmark was actually run; if a benchmark fits neither
        value, report it.
    - name: response_type
      type: string
      nullable: false
      description: >-
        How the grader emits the response. Controlled vocabulary: "binary",
        "likert_5", "likert_10", "win_rate", "ordinal", "fraction",
        "continuous_bounded", "continuous_unbounded", "error_presence",
        "mixed". Defaults to "binary".
    - name: response_scale
      type: string
      nullable: false
      description: >-
        Canonical JSON object declaring the grade domain: {"kind":"discrete",
        "values":[0,1]} enumerates allowed grades; {"kind":"interval","min":0,
        "max":1} sets inclusive bounds (null means unbounded). {"kind":"mixed"}
        requires a concrete response_scale in every item's grading_criterion.
        Uniform benchmarks declare the scale once here, without item overrides.
        Binary and error-presence scales require exactly 0 and 1; Likert scales
        explicitly list their five or ten categories. Concrete scales may add
        direction: higher_is_better, lower_is_better, or unordered. Omission or
        null means unknown and is omitted from canonical JSON. Discrete scales
        may add meanings, a nonempty mapping from quoted allowed values to
        nonempty descriptions; partial mappings are allowed for known meanings.
        Numeric key aliases are canonicalized and duplicates rejected. Mixed
        benchmarks declare interpretations on each item's concrete scale.
        These semantics participate in item identity. No automatic rescaling,
        grade reversal, or inference of meanings from response_type.
    - name: categorical
      type: bool
      nullable: false
      description: >-
        Classification for downstream categorical versus numeric modeling.
        Derived as true for binary, error_presence, Likert, and ordinal types;
        false for continuous types. Contradictory declarations are rejected.
        Fractions, win rates, and mixed scales retain an explicit curator-supplied
        boolean; finite numeric support alone does not imply categorical
        measurement. Optional in metadata only where derivable; always a
        non-null boolean in this table.
    - name: paper_url
      type: string
      nullable: true
      description: >-
        URL of the benchmark's originating paper, usually
        `https://arxiv.org/abs/YYMM.NNNNN`. Distinct from `source_url`,
        which points at the data repository. Pulled from `INFO.paper_url`.
    - name: release_date
      type: string
      nullable: true
      description: >-
        Benchmark release date as `YYYY-MM` or `YYYY-MM-DD`, with valid calendar
        values and years 0001–9999, supplied by metadata.yaml's
        benchmark.release_date (or INFO.release_date). Preserve the known
        precision; use null when unknown rather than placeholders or guessed
        dates. Usually the originating paper's first release.
    - name: granularity
      type: string
      nullable: false
      description: >-
        Granularity of the response data upstream released: "item" when
        per-(subject, item) responses were ingested; "aggregate" when only
        aggregate scores were released; "not_released" when no usable per-item
        response artifact was released. Aggregate/not-released builds still
        register their real item bank and attributable reported subjects but
        write no responses.parquet. Pulled
        from `INFO.granularity`; omitted item builds default to "item".
    - name: release
      type: string
      nullable: true
      description: >-
        Public/private publish gate (replaced the old manifest.yaml):
        "public" makes the benchmark eligible for the public HF mirror,
        "private" keeps it private. Declared in build.py's `INFO`; omitting
        it defaults to "private".
    - name: n_response_values
      type: int
      nullable: true
      description: >-
        Number of distinct (non-null) values in responses.parquet's
        `response` column, not the number of observations. Zero for a
        no-responses build or when all grades are null. Populated when the
        completed benchmark row is registered; null for lower-level legacy
        registrations.
    - name: benchmark_features
      type: string
      nullable: true
      description: >-
        Benchmark-level features as a canonical sorted `k=v;...` string
        (settings that are a property of the whole benchmark rather than of
        any subject, item, or observation).
    - name: n_subjects
      type: int
      nullable: false
      derived: true
      description: Distinct `subject_id` count in subjects.parquet (bank size). Derived.
    - name: n_items
      type: int
      nullable: false
      derived: true
      description: >-
        Distinct `item_id` count in items.parquet (bank size). 
    - name: n_responses
      type: int
      nullable: false
      derived: true
      description: >-
        Row count of responses.parquet, including repeated trials and ungraded
        attempts (0 for a no-responses build). Derived.
    - name: max_trial
      type: int
      nullable: false
      derived: true
      description: >-
        Maximum final repetition index `max(trial)` in responses.parquet,
        including ungraded attempts (0 for a no-responses build). This is an
        index, not a count of trials or observations.
    - name: coverage
      type: float
      nullable: false
      derived: true
      description: >-
        Number of distinct (subject_id, item_id) pairs with at least one
        non-null response, divided by `n_subjects * n_items`. The denominator
        uses the registered subject and item banks. Repeated trials,
        conditions, and interactors do not increase coverage; ungraded-only
        pairs are unobserved. Ranges from 0.0 to 1.0, with 0.0 when no pairs
        are observed or the denominator is zero.
    - name: has_reference_answer
      type: bool
      nullable: false
      derived: true
      description: >-
        True if any item in items.parquet carries a non-null
        grading_criterion.reference_answer. False when every item uses only a
        grading rule. This indicates reference-answer availability for at least
        one item, not grading completeness or whether every item has an answer.

responses:
  file: "{dataset}/formatted_tables/responses.parquet"
  primary_key: [response_id]
  description: >-
    The long-form data. Within each benchmark, one row per
    (subject, item, trial, test_condition, interactors) — that tuple is the
    unique observation key, with NULL in `test_condition` / `interactors`
    treated as a single value; every dataset must satisfy this uniqueness invariant.
    Lives at the benchmark root. Written only for granularity "item"; an
    aggregate/not-released item-bank build deliberately has no responses file.
  columns:
    - name: subject_id
      type: string
      nullable: false
      description: Foreign key to `subjects.subject_id`.
    - name: item_id
      type: string
      nullable: false
      description: Foreign key to `items.item_id`.
    - name: response_id
      type: string
      nullable: false
      derived: true
      description: >-
        Unique observation identifier, also used by traces.response_id.
        Derived by BenchmarkBuild.add_response using the version-1 identity
        payload so schema cleanup does not change existing IDs. Treat this
        as an opaque identifier, not a hash of the current exported columns.
    - name: benchmark_id
      type: string
      nullable: false
      description: Denormalized foreign key to benchmarks.benchmark_id; must match the referenced item.
    - name: trial
      type: int
      nullable: false
      description: >-
        1-indexed trial number. Use 1 for single-trial observations;
        increment for repeated measurements (reruns, additional annotators
        of the same (subject, item, test_condition, interactors) cell). This
        count is positional, not a run label. The builder and shared table
        validator require a positive int64 integer and reject duplicate
        observation keys and response IDs. Gaps in trial numbering are allowed;
        validation does not renumber attempts or remove rows.
    - name: test_condition
      type: string
      nullable: true
      description: >-
        Observation-level condition — used when the same item (same
        content, same `item_id`) is scored under multiple occasions. Holds
        ONLY true conditions (which is usually only temperature).
        Null when a benchmark has none — the column is still written.
    - name: interactors
      type: string
      nullable: true
      description: >-
        Other parties in the interaction, in the same sorted `key=value;...`
        encoding, such as attacker, user_sim (user simulation), or opponent. Null when the subject interacted with no
        one but the item.
    - name: response
      type: float
      nullable: true
      description: >-
        The graded outcome. Usually binary (correct/incorrect, pass/fail,
        safe/unsafe), but may be one of a small finite set of categories
        (Likert 1..5, ordinal level). Stored as float for a uniform schema
        even when the values are integer-coded categories. Stored as nullable
        float64; every non-null grade must be finite and belong to the declared
        response_scale. Interval bounds and integer-coded categories are exact.
        Fractional discrete categories allow only float64 roundoff (eight machine
        epsilons, relative and absolute); stored grades are never rounded or clipped.
        Null records a released attempt whose grade is unavailable or unusable;
        retain its trial, condition and trace without inventing a zero grade.
        No row means no available observation, not proof that no attempt occurred.
        Builder calls use explicit None for an ungraded attempt and reject NaN;
        pandas missing sentinels in assembled tables are serialized as null.

traces:
  file: "{dataset}/formatted_tables/traces.parquet"
  primary_key: [response_id]
  description: >-
    The raw text each model produced, zero or one row per response.
    Join to responses.parquet on response_id. The repeated subject, item,
    benchmark, trial, condition and interactor fields must agree with that
    response. If no response has trace text, this file is not written.
  columns:
    - name: response_id
      type: string
      nullable: false
      description: Unique foreign key to responses.response_id; identifies the exact recorded attempt.
    - name: subject_id
      type: string
      nullable: false
      description: Foreign key to `subjects.subject_id`.
    - name: item_id
      type: string
      nullable: false
      description: Foreign key to `items.item_id`.
    - name: benchmark_id
      type: string
      nullable: false
      description: Denormalized foreign key to `benchmarks.benchmark_id`.
    - name: trial
      type: int
      nullable: false
      description: 1-indexed trial number, as in responses.parquet.
    - name: test_condition
      type: string
      nullable: true
      description: Observation-level condition, as in responses.parquet.
    - name: interactors
      type: string
      nullable: true
      description: Other parties in the interaction, as in responses.parquet.
    - name: trace
      type: string
      nullable: false
      description: Raw model output text -- what the AI models actually answered to the prompts.
