benchmark:
  name: FinanceBench
  one_line_description: Evaluates whether models can answer financial questions about public-company filings
    across closed-book and context-assisted settings.
  description: FinanceBench's open-source 150-question financial-QA evaluation sample, including 16 model/context
    configurations, human correctness labels, model answers, and the 84 provider-released filing PDFs
    referenced by the sample.
  paper_url: https://arxiv.org/abs/2311.11944v1
  data_source_url: https://github.com/patronus-ai/financebench/tree/22257c455f9f9ca9ca3dc67456d9a32e60c7ef08
  license: unknown
  modality:
  - text
  domain:
  - finance
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': incorrect answer or refusal
      '1': correct answer
  categorical: true
  release_date: 2023-11
  multi_single_turn: single_turn
  testing_condition: 'The provider reports evaluations in November 2023 with temperature 0.01, maximum
    output length 2,048, and provider-default system prompts. The 16 subject configurations combine four
    model endpoint labels with closed-book, oracle, long-context, and retrieval harness modes. Each response
    is 1 only for the provider''s human label Correct Answer; the original three-way label and full released
    model answer are retained. Each semantic question links its provider-released target filing PDF as
    a source_document asset. This is source preservation, not a claim that every model directly received
    the PDF: closed-book did not, oracle received released evidence-page text, long-context used an unpinned
    PyMuPDF/tokenizer transformation, and retrieval used dynamic chunks that were not retained. The paper
    says the historical shared store indexed 360 documents, while the released notebook now constructs
    only the 84-document open-sample corpus; no historical vector store or dependency lock was released.'
  subject_type: model configuration
  item_type: financial question with source filing
  citation: "@misc{islam2023financebench,\n  title={FinanceBench: A New Benchmark for Financial Question\
    \ Answering},\n  author={Pranab Islam and Anand Kannappan and Douwe Kiela and Rebecca Qian and Nino\
    \ Scherrer and Bertie Vidgen},\n  year={2023},\n  eprint={2311.11944},\n  archivePrefix={arXiv},\n\
    \  primaryClass={cs.CL}\n}"
  tags:
  - financial-qa
  - retrieval
  - long-context
  benchmark_features:
    item_bank: open_source_human_eval_sample
    grading: provider_human_review
  release: private
