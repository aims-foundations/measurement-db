grading:
  rule: The released research-team human review labels the answer Correct Answer, rather than Incorrect
    Answer or Refusal.
  verifiers:
    human_review:
      spec: FinanceBench research-team human review. Label Correct Answer when the response is substantively
        correct, allowing minor unit deviations and very small rounding errors; label Incorrect Answer
        when it is wrong or its stated reasoning contradicts the evidence; label Refusal when the model
        explicitly says it cannot answer.
