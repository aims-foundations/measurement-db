benchmark:
  description: Item-level MMLU predictions released for AGI-Elo, a study of joint task difficulty and AI-system
    competency. This curation covers the released question-answering observations, not derived Elo ratings.
  testing_condition: Twenty released MMLU model exports. Keep observations whose task identifier and reference
    answer agree with the author-published item bank. Other AGI-Elo task families are not included.
  paper_url: https://openreview.net/forum?id=hYVhxKGD8Y
  data_source_url: https://github.com/SS47816/AGI-Elo
  subject_type: model
  item_type: question
  license: Apache-2.0
  citation: "@inproceedings{sun2025agielo,\n  title={AGI-Elo: How Far Are We From Mastering A Task?},\n  author={Sun,\
    \ Shuo and Zhao, Yimin and Lee, Christina Dao Wen and Sun, Jiawei and Yuan, Chengran and Huang, Zefan and\
    \ Li, Dongen and Yeoh, Justin K. W. and Prakash, Alok and Malone, Thomas W. and Ang Jr., Marcelo H.},\n\
    \  booktitle={NeurIPS 2025 Datasets and Benchmarks Track},\n  year={2025},\n}"
  tags:
  - elo
  - rating_system
  - task_difficulty
  - model_competency
  - agi
  modality:
  - text
  domain:
  - general
  - reasoning
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': incorrect
      '1': correct
  categorical: true
  release_date: 2025-12
  name: AGI-Elo
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    answer_parser:
      reasoning_block: (?s)<think>.*?</think>
      choice: \b([ABCD])\b
grading:
  rule: Remove <think>...</think> blocks and select the first standalone uppercase A, B, C, or D. Correctness
    is exact agreement with the released reference choice; an unparsed output is incorrect.
  verifiers:
    multiple_choice:
      source: https://github.com/SS47816/AGI-Elo/blob/39fdf034932548e370b211d39524e99e2a1e8087/AGI_Elo/pipeline/question_answering.py
      function: compute_match_results
      rule: Remove <think>...</think> blocks and select the first standalone uppercase A, B, C, or D. Correctness
        is exact agreement with the released reference choice; an unparsed output is incorrect.
