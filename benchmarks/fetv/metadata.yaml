grading:
  verifiers:
    static_quality:
      rule: "Rate individual-frame naturalness and visual artifacts using the released 1\u20135 rubric."
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      implementation:
        kind: released_human_rating
        field: static_quality
        source: https://drive.google.com/file/d/1bqeuOIhZ2YJdqfNr3B1azNXXs5tRSncg/view
        local_instructions: manual-instructions.zip
        historical_rater_identity: Anonymous human0, human1 or human2 as reported in the source path.
    temporal_quality:
      rule: "Rate the naturalness and consistency of frame transitions using the released 1\u20135 rubric."
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      implementation:
        kind: released_human_rating
        field: temporal_quality
        source: https://drive.google.com/file/d/1bqeuOIhZ2YJdqfNr3B1azNXXs5tRSncg/view
        local_instructions: manual-instructions.zip
        historical_rater_identity: Anonymous human0, human1 or human2 as reported in the source path.
    alignment:
      rule: "Rate overall agreement between the generated video and the original English evaluation prompt using\
        \ the released 1\u20135 rubric."
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      implementation:
        kind: released_human_rating
        field: alignment
        source: https://drive.google.com/file/d/1bqeuOIhZ2YJdqfNr3B1azNXXs5tRSncg/view
        local_instructions: manual-instructions.zip
        historical_rater_identity: Anonymous human0, human1 or human2 as reported in the source path.
    attribute_color:
      rule: "Rate agreement with the original English evaluation prompt for color using the released 1\u20133 rubric."
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        direction: higher_is_better
        meanings:
          '1': Does not match the specified attribute.
          '2': Partly matches the specified attribute.
          '3': Matches the specified attribute.
      implementation:
        kind: released_human_rating
        field: fine-grained_alignment.color
        source: https://drive.google.com/file/d/1bqeuOIhZ2YJdqfNr3B1azNXXs5tRSncg/view
        local_instructions: manual-instructions.zip
        historical_rater_identity: Anonymous human0, human1 or human2 as reported in the source path.
    attribute_quantity:
      rule: "Rate agreement with the original English evaluation prompt for quantity using the released 1\u2013\
        3 rubric."
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
