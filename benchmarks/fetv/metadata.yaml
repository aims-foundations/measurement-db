        - 2
        - 3
        direction: higher_is_better
        meanings:
          '1': Does not match the specified attribute.
          '2': Partly matches the specified attribute.
          '3': Matches the specified attribute.
      implementation:
        kind: released_human_rating
        field: fine-grained_alignment.event order
        source: https://drive.google.com/file/d/1bqeuOIhZ2YJdqfNr3B1azNXXs5tRSncg/view
        local_instructions: manual-instructions.zip
        historical_rater_identity: Anonymous human0, human1 or human2 as reported in the source path.
    CLIPScore:
      rule: Preserve the released cosine similarity between the prompt embedding and the normalized mean of 16 frame
        embeddings from CLIP ViT-B/32.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
      implementation:
        kind: released_automatic_score
        metric: CLIPScore
        source: https://github.com/llyx97/FETV-EVAL/blob/1385218bc92899e85aae0941888d8ddcf94bd65d/auto_eval.py
        historical_verifier_revision: null
    CLIPScore-ft:
      rule: Preserve the released CLIP video-text cosine similarity using the MSR-VTT fine-tuned model.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
      implementation:
        kind: released_automatic_score
        metric: CLIPScore-ft
        source: https://github.com/llyx97/FETV-EVAL/blob/1385218bc92899e85aae0941888d8ddcf94bd65d/auto_eval.py
        historical_verifier_revision: null
    BLIPScore:
      rule: Preserve the released normalized video-text embedding dot product from BLIP; the published export uses
        dot_sims, not the separately computed ITM probability.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
      implementation:
        kind: released_automatic_score
        metric: BLIPScore
        source: https://github.com/llyx97/FETV-EVAL/blob/1385218bc92899e85aae0941888d8ddcf94bd65d/auto_eval.py
        historical_verifier_revision: null
    Otter-VQA:
      rule: Preserve the released fraction of Vicuna-generated questions that receive an Otter answer beginning
        with yes. No new question generation or judging is performed.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      implementation:
        kind: released_automatic_score
        metric: Otter-VQA
        source: https://arxiv.org/html/2311.01813v3#A4.SS1
        historical_verifier_revision: null
    UMTScore:
      rule: Preserve the released UMT cross-modal matching logit; negative values are valid and must not be clipped
        or rescaled.
      response_scale:
        kind: interval
        min: null
        max: null
        direction: higher_is_better
      implementation:
        kind: released_automatic_score
        metric: UMTScore
        source: https://github.com/llyx97/FETV-EVAL/blob/1385218bc92899e85aae0941888d8ddcf94bd65d/UMT/tasks/t2v_eval_utils.py
        historical_verifier_revision: null
