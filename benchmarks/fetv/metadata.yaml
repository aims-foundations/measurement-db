benchmark:
  name: FETV
  description: Released video-generation measurements for four models on 619 prompts, including individual human
    ratings and five automatic alignment metrics.
  testing_condition: "Retain each published rating without averaging or rejudging: three 1\u20135 human dimensions,\
    \ applicable 1\u20133 attribute-alignment dimensions, and five automatic metrics. Distinguish annotators and\
    \ metrics in item grading protocols. These are correlated ratings of one generated video per model/prompt, not\
    \ independent generation trials. Keep the 2,476 complete generated outputs in their original archives and link\
    \ every measurement to its exact member and SHA-256. CogVideo receives the released Chinese source prompt; preserve\
    \ the original English evaluation prompt in the grading rule and trace. Other models use the English prompt.\
    \ Input text represents the released source prompts, not an independently recorded historical inference envelope.\
    \ Historical weight revisions, complete runtime settings and Otter judge-to-score associations are not asserted.\
    \ Auxiliary QA records remain captured for review. Real reference videos are not AI subjects; corpus-level FID/FVD\
    \ statistics are excluded from item-level responses."
  paper_url: https://arxiv.org/abs/2311.01813
  data_source_url: https://github.com/llyx97/FETV-EVAL
  subject_type: model
  item_type: prompt
  license: CC-BY-4.0 for the FETV dataset, as declared by the authors. Captured code retains its component-specific
    upstream licenses.
  citation: 'Liu, Y. et al. (2023). FETV: A Benchmark for Fine-Grained Evaluation of Open-Domain Text-to-Video Generation.
    NeurIPS Datasets and Benchmarks.'
  tags:
  - text_to_video
  - human_evaluation
  - video_generation
  modality:
  - text
  - video
  domain:
  - general
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2023-11
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      prompts: FETV/fetv_data.json
      chinese_prompts: FETV-EVAL/cogvideo/datas/fetv_data_cn.txt
      human_scores: FETV-EVAL/manual_eval_results/*/*.json
      automatic_scores: FETV-EVAL/auto_eval_results/*/*.json
    models:
      cogvideo: CogVideo
      modelscope-t2v: ModelScopeT2V
      text2video-zero: Text2Video-Zero
      zeroscope: ZeroScope-v2-576w
    model_aliases:
      damo-text2video: modelscope-t2v
    human_dimensions:
      static_quality: static_quality
      temporal_quality: temporal_quality
      alignment: alignment
      fine-grained_alignment.color: attribute_color
      fine-grained_alignment.quantity: attribute_quantity
      fine-grained_alignment.camera view: attribute_camera_view
      fine-grained_alignment.speed: attribute_speed
      fine-grained_alignment.motion direction: attribute_motion_direction
      fine-grained_alignment.event order: attribute_event_order
    archives:
      cogvideo: videos/cogvideo.zip
      modelscope-t2v: videos/modelscope-t2v.zip
      text2video-zero: videos/text2video-zero.zip
      zeroscope: videos/zeroscope.zip
    video_prefixes:
      cogvideo: cogvideo/videos/
      modelscope-t2v: modelscope-t2v/videos/
      text2video-zero: text2video-zero/videos/
      zeroscope: output_videos/videos/
    media_types:
      .gif: image/gif
      .mp4: video/mp4
    input_scope:
      description: Released generation source prompt. Exact historical inference envelope and stage-specific runtime
        settings are not asserted.
    subject_features:
      harness: FETV
      configuration_scope: Author-reported generator. Historical weight revision and complete inference settings
        are not recorded in the score files.
