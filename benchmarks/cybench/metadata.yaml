benchmark:
  description: Recorded agent runs on 40 capture-the-flag tasks, with unguided flag recovery, guided flag recovery
    and guided subtask completion scores.
  testing_condition: 'Preserve all 960 original paper scores and add 61 measurements from 50 additional released
    runs. The 689 accessible logs cover 11 exact deployment identifiers and retain complete requests, model
    outputs, tool observations and recorded subtask verdicts. All 959 overlapping scores reconcile exactly.
    Flag recovery follows the author''s case-sensitive search for the reference flag body in terminal stdout
    during the final subtask; successful answer submission and filename success labels are not substitutes.
    Guided fractions describe progress within the same run and are not additional independent attempts. One
    Gemini/Unbreakable unguided log is blocked by its upstream host: keep the paper''s failure, leave its trace/configuration
    unavailable, and supply both authored task descriptions without claiming which variant it received. All
    other items retain their complete captured first request. Exact historical runtime filesystem snapshots
    are not reconstructed. No model inference, task execution or new judging.'
  paper_url: https://arxiv.org/abs/2408.08926
  data_source_url: https://github.com/andyzorigin/cybench
  subject_type: agent
  item_type: ctf_challenge
  license: Apache-2.0
  citation: "@misc{zhang2025cybenchframeworkevaluatingcybersecurity,\n      title={Cybench: A Framework for\
    \ Evaluating Cybersecurity Capabilities and Risks of Language Models},\n      author={Andy K. Zhang and\
    \ Neil Perry and Riya Dulepet and Joey Ji and Celeste Menders and Justin W. Lin and Eliot Jones and Gashon\
    \ Hussein and Samantha Liu and Donovan Jasper and Pura Peetathawatchai and Ari Glenn and Vikram Sivashankar\
    \ and Daniel Zamoshchin and Leo Glikbarg and Derek Askaryar and Mike Yang and Teddy Zhang and Rishi Alluri\
    \ and Nathan Tran and Rinnara Sangpisit and Polycarpos Yiorkadjis and Kenny Osele and Gautham Raghupathi\
    \ and Dan Boneh and Daniel E. Ho and Percy Liang},\n      year={2025},\n      eprint={2408.08926},\n  \
    \    archivePrefix={arXiv},\n      primaryClass={cs.CR},\n      url={https://arxiv.org/abs/2408.08926},\n\
    }"
  tags:
  - agent
  modality:
  - text
  domain:
  - cybersecurity
  response_type: fraction
  response_scale:
    kind: interval
    min: 0
    max: 1
    direction: higher_is_better
  categorical: false
  release_date: 2024-08
  name: Cybench
  version: arXiv v4 and the released task logs
  multi_single_turn: multi_turn
