grading:
  rule: Preserve the published boolean correct flag (true=1, false=0, null=ungraded). The selected caption is stored
    in answer.multiple_choice_answer; exact equality to the positive caption agrees with every released grade. Retain
    original free-form outputs without rerunning extraction or grading.
  verifiers:
    published:
      kind: published_caption_correctness
      source: https://github.com/RAIVNLab/sugar-crepe/tree/0047054b243992f0fad63d6f64f7544862daf846/gpt-4v-results
      field: correct
      comparison: answer.multiple_choice_answer == caption
      limitation: Original correctness flags are retained; the released README provides the prompt, not the full
        GPT-4V generation or extraction implementation.
