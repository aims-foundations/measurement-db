    labels:
      subject_prefix: 'LLM survey simulation / '
    subject_features:
      harness: UQ LLM survey simulation
      historical_configuration: request_parameters_and_persona_assignments_not_recorded
    unlinked_results:
      OpinionQA/deepseek-v3: Raw lists contain 200 outputs but clean lists contain 150 scores; no authoritative
        source mapping is available.
grading:
  verifiers:
    EEDI:
      kind: published_assessment
      source: https://github.com/yw3453/uq-llm-survey-simulation/blob/fe3eb19111a2d9327e9ec051bd96f68750a7895d/data.zip
      documented_processor: https://github.com/yw3453/uq-llm-survey-simulation/blob/fe3eb19111a2d9327e9ec051bd96f68750a7895d/src/simulations.py
      function: process_responses_EEDI
      rule: 'Preserve the published binary grade of the simulated student choice. The documented cleaner extracts
        a bracketed capital letter, falls back to SequenceMatcher against answer-map values, then compares A/B/C/D
        with the released answer index. Its historical outputs can disagree with the published cleaner. Explicit
        API-error outputs have no observed student answer: store null and retain the original random imputation
        in the trace.'
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '0': Published simulated student answer was graded incorrect.
          '1': Published simulated student answer was graded correct.
    OpinionQA:
      kind: published_choice_encoding
      source: https://github.com/yw3453/uq-llm-survey-simulation/blob/fe3eb19111a2d9327e9ec051bd96f68750a7895d/data.zip
      documented_processor: https://github.com/yw3453/uq-llm-survey-simulation/blob/fe3eb19111a2d9327e9ec051bd96f68750a7895d/src/simulations.py
      function: process_responses_OpinionQA
      rule: Preserve the published opinion-choice encoding without regrading or rounding. The documented cleaner
        maps choices 1/2/3/4/5 to 1, 1/3, -1/3, -1, 0 and falls back to the item-specific choice-text mapping. These
        are answer categories, not correctness or higher-is-better performance. Preserve floating-point variants
        of thirds as released. Explicit associated API errors are ungraded; source imputations remain in traces.
        An unmatched raw-output list is not linked by guessing its offset.
      response_scale:
        kind: discrete
        values:
        - -1
        - -0.3333333333333333
        - 0
        - 0.3333333333333333
        - 1
        direction: unordered
        meanings:
          '1': First listed opinion choice
          '0.3333333333333333': Second listed opinion choice
          '-0.3333333333333333': Third listed opinion choice
          '-1': Fourth listed opinion choice
          '0': Fifth listed choice, commonly refused; not a correctness score
