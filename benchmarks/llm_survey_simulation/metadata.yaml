      deepseek-v3: deepseek-ai/DeepSeek-V3
      gpt-3.5-turbo: gpt-3.5-turbo
      gpt-4o-mini: gpt-4o-mini
      gpt-4o: gpt-4o
      gpt-5-mini: gpt-5-mini
      llama-3.3-70B-instruct-turbo: meta-llama/Llama-3.3-70B-Instruct-Turbo
