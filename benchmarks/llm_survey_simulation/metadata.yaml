benchmark:
  description: Published synthetic survey responses from eight LLMs on 412 EEDI questions and 385 OpinionQA questions.
    These are simulated human responses, not direct estimates of the LLMs' question-solving ability.
  testing_condition: 'Preserve all 669,350 published cleaned entries and their exact numeric values; do not snap
    fractional values to a rounded category. Each item contains the complete released base question and choices.
    The source conditions generation on synthetic human personas, but per-response persona IDs and historical request
    settings are absent. Do not substitute a guessed persona or claim that the base question is a complete historical
    prompt. Raw profile banks and templates remain available in the unchanged archive. Equal-length raw/clean lists
    are linked by their documented question and list position. DeepSeek OpinionQA has 200 raw outputs versus 150
    cleaned entries per question, with no recoverable run mapping; its 57,750 scores retain no fabricated output
    association. Known API-error outputs have random imputed scores in the source: retain the attempt with response=null
    and preserve the published value in its trace. Other published scores remain unchanged, including discrepancies
    with the currently published postprocessor. Human survey records, random baselines and aggregate analyses stay
    raw-only. Trial is the one-based clean-list position, not a persona ID.'
  paper_url: https://arxiv.org/abs/2502.17773
  data_source_url: https://github.com/yw3453/uq-llm-survey-simulation
  subject_type: model
  item_type: survey_question
  license: The captured source repository declares MIT. The included EEDI and OpinionQA source data retain any applicable
    upstream terms; the repository license alone does not establish those rights.
  citation: Huang, Chengpiao; Wu, Yuhang; Wang, Kaizheng. How Many Human Survey Respondents is a Large Language
    Model Worth? An Uncertainty Quantification Perspective. arXiv:2502.17773.
  tags:
  - survey_simulation
  - opinion
  - education
  - persona
  - social_science
  modality:
  - text
  domain:
  - mathematics
  - cultural
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: true
  release_date: 2025-02
  release: public
  name: LLM survey-simulation responses (EEDI and OpinionQA)
  granularity: item
  multi_single_turn: single_turn
