grading:
  rule: Preserve the source binary judgment. Success means every evaluation selected by this protocol passed. Preserve
    evaluator errors and failures as released; do not rerun judges or infer success from the agent's prose.
  verifiers:
    strict_all:
      source: https://github.com/som-shahlab/health-admin-bench/blob/cdc0703c43cae78c2dea8a7254512d1430664888/scripts/recompute_accuracy_without_process_checks.py
      field: pass_orig
      protocol: '_per_run_metrics: n_total > 0 and n_passed == n_total. Include every task eval, including process
        checks. Do not substitute the process-check-removed pass_new result.'
    without_process_checks:
      source: https://github.com/som-shahlab/health-admin-bench/blob/cdc0703c43cae78c2dea8a7254512d1430664888/scripts/recompute_accuracy_without_process_checks.py
      field: pass_new
      protocol: '_per_run_metrics: n_kept > 0 and n_passed_kept == n_kept. Remove exactly the task/index entries
        in flagged_process_subevals.csv; retain the other checks in their original order.'
    task_evaluator:
      source: https://github.com/som-shahlab/health-admin-bench/blob/cdc0703c43cae78c2dea8a7254512d1430664888/harness/evaluators/llm_evaluator.py
      protocol: Tasks combine deterministic JMESPath state checks and LLM-judge rubrics. The captured evaluator
        implementation selects gpt-5, but exported rows do not establish the historical judge invocation/checkpoint.
        Preserve native boolean verdicts and available raw judge outputs without regrading.
