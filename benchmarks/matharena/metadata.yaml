benchmark:
  description: MathArena scores models on problems from recent mathematics competitions, checking the
    final answer where there is one and having judges grade written proofs criterion by criterion where
    the problem asks for a proof.
  testing_condition: One released attempt per trial; proof judges and criteria are item verifiers, not
    test conditions. No unrecorded inference conditions are supplied.
  paper_url: https://arxiv.org/abs/2505.23281
  data_source_url: https://github.com/eth-sri/matharena
  subject_type: model
  item_type: task
  license: CC-BY-NC-SA-4.0 AND CC-BY-SA-4.0
  citation: "@misc{balunović2026matharenaevaluatingllmsuncontaminated,\n      title={MathArena: Evaluating\
    \ LLMs on Uncontaminated Math Competitions},\n      author={Mislav Balunović and Jasper Dekoninck\
    \ and Ivo Petrov and Nikola Jovanović and Martin Vechev},\n      year={2026},\n      eprint={2505.23281},\n\
    \      archivePrefix={arXiv},\n      primaryClass={cs.AI},\n      url={https://arxiv.org/abs/2505.23281},\n\
    }"
  tags:
  - reasoning
  modality:
  - text
  - image
  domain:
  - mathematics
  multi_single_turn: multi_turn, single_turn
  response_type: mixed
  response_scale: binary for AIME family (per-attempt correct); continuous fraction points/max for rubric
    comps (USAMO/IMO/IMC/Putnam/Miklos, per-criterion)
  categorical: false
  release_date: 2025-05
  release: public
  name: MathArena
  granularity: item
  one_line_description: Measures mathematical problem solving through final-answer correctness and criterion-level
    proof grades.
