benchmark:
  description: Classify six subjective dimensions of earnings-call question/answer pairs against released human
    labels.
  testing_condition: Preserve literal response-model identifiers, recorded completion prompts and request arguments.
    Where prompts are absent, use the corresponding released chat template as canonical task context, without claiming
    the historical request was recorded. Preserve missing ratings and all source variants. Repeated request IDs
    are source aliases, not fresh trials.
  paper_url: https://arxiv.org/abs/2410.20651
  data_source_url: https://github.com/gtfintechlab/SubjECTive-QA
  subject_type: model
  item_type: task
  license: CC-BY-4.0
  citation: "@article{pardawala2024subjective,\n  title={SubjECTive-QA: Measuring Subjectivity in Earnings Call\
    \ Transcripts' QA Through Six-Dimensional Feature Analysis},\n  author={Pardawala, Huzaifa and Sukhani, Siddhant\
    \ and Shah, Agam and Kejriwal, Veer and Pillai, Abhishek and Bhasin, Rohan and DiBiasio, Andrew and Mandapati,\
    \ Tarun and Adha, Dhruv and Chava, Sudheer},\n  journal={arXiv preprint arXiv:2410.20651},\n  year={2024}\n}"
  tags:
  - finance
  - subjectivity
  - classification
  - earnings_calls
  modality:
  - text
  domain:
  - finance
  - nlp_task
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Parsed model rating differs from the released human class
      '1': Parsed model rating equals the released human class
  categorical: true
  release_date: 2024-10
  release: public
  name: SubjECTive-QA
  granularity: item
  multi_single_turn: single_turn
  version: 612ff46a5c2da6734157e1824e305509637c31cf
build:
  contract_version: 2
  parameters:
    layout:
      release: release
      results: benchmarking_results/llm_results
      bank: scripts/final_datasets_test_5768.xlsx
    definitions:
      RELEVANT: The speaker has answered the question entirely and appropriately.
      SPECIFIC: The speaker includes specific and technical details in the answer.
      CAUTIOUS: The speaker answers using a more conservative, risk-averse approach.
      ASSERTIVE: The speaker answers with certainty about the company's events.
      CLEAR: The speaker is transparent in the answer and about the message to be conveyed.
      OPTIMISTIC: The speaker answers with a positive tone regarding outcomes.
    templates:
      openai: "Given the following feature: {feature} and its corresponding definition: {definition}\n\n       \
        \            Give the answer a rating of:\n\n                   2: If the answer positively demonstrates\
        \ the chosen feature, with regards to the question.\n\n                   1: If there is no evident/neutral\
        \ correlation between the question and the answer for the feature.\n\n                   0: If the answer\
        \ negatively correlates to the question on the chosen feature.\n\n                   Provide the rating\
        \ only. No explanations. This is the question: {question} and this is the answer: {answer}."
      together: "Given the following feature: {feature} and its corresponding definition: {definition}\n\n     \
        \         Rate the answer with:\n\n              2: Positive demonstration of the feature in the answer.\n\
        \n              1: Neutral or no correlation.\n\n              0: Negative correlation to the question on\
        \ the feature.\n\n              Provide the rating only. This is the question: {question}, and this is the\
        \ answer: {answer}."
      system: You are an expert sentence classifier.
    patterns:
      request_id: ^(?:ChatCompletion\()?id='([^']+)'
      reported_model: created=\d+,? model='([^']+)'
      rating: ([012])
    labels:
      harness: SubjECTive-QA released API evaluation
      recorded: recorded_completion_prompt
      reconstructed: released_chat_template_historical_prompt_unrecorded
      annotation: released_rating_annotation
      fallback: legacy_curator_rating_parser
      missing: rating_unavailable
      known_settings: recorded_request_arguments
      unknown_settings: historical_request_settings_unrecorded
grading:
  rule: 'Compare the released parsed Rating with the human class (0, 1 or 2). For the six Mixtral-8x22B exports
    without a Rating annotation, retain the earlier curation rule: take the first 0, 1 or 2 character in llm_responses,
    then compare it with the reference. These fallback grades are curator-derived and are not reported upstream
    accuracy. Keep missing or unparseable ratings null, preserve the full output, and flag the rating source. Repeated
    exports of the same request ID are aliases, not independent trials.'
  verifiers:
    classification:
      kind: released_rating_or_legacy_parser_exact_match
      source: https://github.com/gtfintechlab/SubjECTive-QA/tree/612ff46a5c2da6734157e1824e305509637c31cf/benchmarking_results/llm_results
      rule: 'Compare the released parsed Rating with the human class (0, 1 or 2). For the six Mixtral-8x22B exports
        without a Rating annotation, retain the earlier curation rule: take the first 0, 1 or 2 character in llm_responses,
        then compare it with the reference. These fallback grades are curator-derived and are not reported upstream
        accuracy. Keep missing or unparseable ratings null, preserve the full output, and flag the rating source.
        Repeated exports of the same request ID are aliases, not independent trials.'
sources:
  upstream:
  - name: release
    url: https://github.com/gtfintechlab/SubjECTive-QA
    revision: 612ff46a5c2da6734157e1824e305509637c31cf
    files:
    - match: ^(?:LICENSE|README\.md|scripts/(?:openai_benchmarking\.py|togetherai_benchmarking\.py|final_datasets_test_5768\.xlsx)|benchmarking_results/(?:llm_results/.*\.csv|plm_results/.*\.xlsx))$
      path: release/{path}
