      requested_scale: An integer from 0 to 10. Published 11/12 values are retained in traces and flagged invalid,
        not clipped or rejudged.
      prompt_version: Exact historical prompt version is not recorded per judgment; current and older source implementations
        are retained for reference.
      execution: Import the native score and judge explanation unchanged; do not rerun the judge or replace unavailable
        scores.
