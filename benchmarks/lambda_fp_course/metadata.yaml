grading:
  rule: Preserve released per-item assessment categories and flags; do not recompute ratings or infer missing grades.
  verifiers:
    codegen:
      kind: reported_assessment
      source: https://github.com/jaylene-zhang/ArtifactProgramming2025/blob/91c0ac534b86164cae782e5a83f668ce76ba4032/results/CodeGenResults/raw_results.csv
      rule: Preserve the released Rating for source question {source_task} on its ordinal 0–4 encoding. The stimulus
        is the entire homework. The source writer discards the generation attempt ID, so occurrence numbers do not
        establish a correspondence with saved model outputs. The published rating-generation helper contains a random
        fallback for Beginning versus Developing; do not rerun it or claim independent rubric verification. For
        hw7/q1, the two function metadata entries share one question key; neither is selected as the sole graded
        function.
      response_scale: &id001
        kind: discrete
        values:
        - 0
        - 1
        - 2
        - 3
        - 4
        direction: higher_is_better
        meanings:
          '0': Explicit Non-gradable category
          '1': Beginning
          '2': Developing
          '3': Proficient
          '4': Mastery
    explain:
      kind: reported_assessment
      source: https://github.com/jaylene-zhang/ArtifactProgramming2025/blob/91c0ac534b86164cae782e5a83f668ce76ba4032/results/ExplainResults/Explain_raw.csv
      rule: Preserve the released performance category for source question {source_task} on its ordinal 0–4 encoding.
        Paper Table 6 describes conceptual understanding, strategy and explanation quality. Non-gradable is an explicit
        lowest category, not an absent assessment. Only the released assessment is imported; no new manual or model
        grading occurs.
      response_scale: *id001
    repair_syntax:
      kind: reported_assessment
      source: https://github.com/jaylene-zhang/ArtifactProgramming2025/blob/91c0ac534b86164cae782e5a83f668ce76ba4032/results/RepairResults/syntax_error_results.csv
      rule: 'Preserve the literal released Fixed flag for source task {source_task}: False=0, True=1. Its computation
        is not supplied and some True records still report syntax or type errors, so this is not a verified compiler-pass
        or task-success measure. No case-normalization or regrading is applied.'
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '0': Released Fixed flag is False
          '1': Released Fixed flag is True
    repair_type:
      kind: reported_assessment
      source: https://github.com/jaylene-zhang/ArtifactProgramming2025/blob/91c0ac534b86164cae782e5a83f668ce76ba4032/results/RepairResults/type_error_results.csv
      rule: Preserve the released Rating for source task {source_task} on its ordinal 0–4 encoding. Paper Table
        5 describes localization, repair quality and redundant changes. The supplied original compiler diagnostic
        is part of the task input. No new code execution or grading occurs.
      response_scale: *id001
