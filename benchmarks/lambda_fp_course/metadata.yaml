benchmark:
  release: public
  name: Functional Programming Course LLM Evaluation
  description: Released OCaml course code-generation, program-repair and conceptual-question assessments.
  testing_condition: Nine released model labels, with API defaults reported in the paper and numeric inference settings
    unrecorded. Import every CodeGen, Explain, syntax-repair and type-repair result row without inferring missing
    assessments. CodeGen trials enumerate source-record occurrences because the original writer discarded attempt
    IDs; generated code cannot be uniquely attached. Other native attempt IDs are preserved and saved outputs are
    joined by explicit model/task/attempt names when available. Item content preserves source task files, plus the
    original type-error diagnostic for type repair. Historical system-message versions are not established. CodeGen
    question IDs remain separate grading units even though the stimulus is shared. The logical-repair CSV is identical
    to the syntax CSV and none of its IDs match logical tasks; it remains in raw but is excluded from observations.
    Syntax Fixed flags and published ordinal ratings are source-reported assessments, not independently verified
    correctness. Aggregate tables and unassociated outputs, including o1 excluded by the authors, remain in raw
    and are not fabricated into graded responses.
  paper_url: https://arxiv.org/abs/2603.05646
  data_source_url: https://github.com/jaylene-zhang/ArtifactProgramming2025
  subject_type: model
  item_type: task
  license: MIT (Zenodo artifact declaration)
  citation: 'Zhang, Pientka and Si. Evaluating LLMs in the Context of a Functional Programming Course: A Comprehensive
    Study (2026).'
  tags:
  - ocaml
  - functional_programming
  - code_generation
  - program_repair
  - education
  modality:
  - text
  domain:
  - education
  - software_engineering
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: true
  release_date: '2026-02-03'
  multi_single_turn: single_turn
