benchmark:
  description: 'AgentDojo: prompt-injection evaluation across many tool-using agents and environments.'
  testing_condition: 'Two observation types per released run when available: user-task utility and, under
    attack, attacker-goal success (upstream field security). Both preserve their recorded booleans. Utility
    uses higher-is-better; attacker success uses lower-is-better for the evaluated defending agent. Metric
    is part of item grading identity; defense is a subject feature and attack type remains an interactor.
    Captured definitions resolve task text; historical per-run definition revisions are not recorded.'
  paper_url: https://arxiv.org/abs/2406.13352
  data_source_url: https://github.com/ethz-spylab/agentdojo
  subject_type: agent
  item_type: task
  license: MIT
