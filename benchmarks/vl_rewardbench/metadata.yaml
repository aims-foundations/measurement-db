grading:
  rule: The recorded choice agrees with the reference preference (1) or rejects it (0). An unparsed choice
    has no binary grade.
  verifiers:
    released_preference:
      kind: provider_verdict
      source: https://github.com/vl-rewardbench/VL_RewardBench/blob/9b10abdc91678bc5fb2bd7eea4d73d3af484db9f/cal.py
      logic: 'Preserve meta.flag_status: agree=1, reject=0, doesntMatch=null. Do not rerun the optional
        LLM parser or convert trial judgments into majority votes.'
