benchmark:
  description: 'VL-RewardBench: judge VLM accuracy on (image, query, chosen, rejected) preference pairs.'
  testing_condition: Released per-trial preference judgments matched to the public question, candidate
    answers, and reference ranking. Unparsed judgments retain null grades; this is not the paper's majority-vote
    accuracy.
  paper_url: https://arxiv.org/abs/2411.17451
  data_source_url: https://huggingface.co/datasets/MMInstruction/VL-RewardBench
  subject_type: reward_model
  item_type: response_pair
  license: MIT
  citation: "@misc{li2025vlrewardbenchchallengingbenchmarkvisionlanguage,\n      title={VL-RewardBench:\
    \ A Challenging Benchmark for Vision-Language Generative Reward Models},\n      author={Lei Li and\
    \ Yuancheng Wei and Zhihui Xie and Xuqing Yang and Yifan Song and Peiyi Wang and Chenxin An and Tianyu\
    \ Liu and Sujian Li and Bill Yuchen Lin and Lingpeng Kong and Qi Liu},\n      year={2025},\n     \
    \ eprint={2411.17451},\n      archivePrefix={arXiv},\n      primaryClass={cs.CV},\n      url={https://arxiv.org/abs/2411.17451},\n\
    }"
  tags:
  - reasoning
  - preference
  modality:
  - text
  - image
  domain:
  - reward_modeling
  - preference
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': disagrees with reference preference
      '1': agrees with reference preference
  categorical: true
  release_date: 2024-11
  release: private
  granularity: item
  name: VL-RewardBench
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    models:
      InternVL2-8B-1023.jsonl: InternVL2-8B
      Phi-3.5-vision-instruct-1024.jsonl: Phi-3.5-vision-instruct
      Qwen-Qwen2-VL-2B-Instruct-1024.jsonl: Qwen/Qwen2-VL-2B-Instruct
      Qwen-Qwen2-VL-72B-Instruct-1024.jsonl: Qwen/Qwen2-VL-72B-Instruct
      Qwen-Qwen2-VL-7B-Instruct-1024.jsonl: Qwen/Qwen2-VL-7B-Instruct
      allenai-Molmo-72B-0924-1024.jsonl: allenai/Molmo-72B-0924
      allenai-Molmo-7B-D-0924-1025.jsonl: allenai/Molmo-7B-D-0924
