benchmark:
  description: Released 2024 LiveAoPSBench Olympiad mathematics questions and complete source-reported model correctness
    matrix.
  testing_condition: Import the 2024 website release only. Zero-based result question_id is associated with the
    ordered published task file (idx=question_id+1); the earlier author export preserves the same question/solution
    order and original AoPS topic links. Import pass@1/100 without regrading. Original model completions, historical
    prompt wrappers, decoding settings and exact grading-harness revision are not released with these scores. Generic
    website model release dates are placeholders, not subject metadata. Repeated identical question/reference definitions
    share an item and retain separate source-record occurrences; their trial numbers do not establish independent
    resampling. Earlier results cover a different 9,079-question set with unresolved mapping and are preserved only
    in raw. No new model or judge calls occur.
  paper_url: https://arxiv.org/abs/2501.14275
  data_source_url: https://github.com/LiveMathBench/LiveMathBench.github.io
  subject_type: model
  item_type: question
  license: 'Task dataset: Apache-2.0 (author HF card); website result/source release: CC-BY-SA-4.0; evaluator code:
    Apache-2.0. Original notices are captured.'
  citation: "@article{mahdavi2025leveraging,\n  title={Leveraging Online Olympiad-Level Math Problems for LLMs Training\
    \ and Contamination-Resistant Evaluation},\n  author={Mahdavi, Sadegh and Li, Muchen and Liu, Kaiwen and Thrampoulidis,\
    \ Christos and Sigal, Leonid and Liao, Renjie},\n  journal={International Conference on Machine Learning (ICML)},\n\
    \  year={2025}\n}"
  tags:
  - math
  - olympiad
  - contamination-resistant
  - aops
  modality:
  - text
  domain:
  - mathematics
  - reasoning
  response_type: binary
  response_scale: &id001
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Released leaderboard pass@1 is 0
      '1': Released leaderboard pass@1 is 100
  categorical: true
  release_date: 2025-01
  release: public
  name: LiveAoPSBench
  granularity: item
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      results: results.json
      questions: questions.jsonl
      source_questions: source_questions.jsonl
    labels:
      subject_prefix: 'LiveAoPSBench / '
      condition: published_2024_release
    subject_features:
      harness: LiveAoPSBench published 2024 results
      model_identifier_status: released_label
      historical_configuration: not_recorded
grading:
  rule: Source-reported correctness against the released question's answer. reference_answer is a JSON string preserving
    the exact native answer, including empty values. Published pass@1 values of 0 and 100 map to 0 and 1; model
    outputs are unavailable for independent regrading.
  verifiers:
    reported:
      kind: source_reported_metric
      metric: pass@1
      conversion: source pass@1 / 100
      source: https://github.com/LiveMathBench/LiveMathBench.github.io/blob/1fafd48912960842da0caa53a71e1d605a108246/src/mocks/acc2024.json
      published_evaluator: https://github.com/DSL-Lab/aops/blob/56f6bc1e670170e301f1c9ebc172124defd21e90/eval/evaluate.py
      historical_evaluator_revision: not_recorded_in_result_export
      response_scale: *id001
