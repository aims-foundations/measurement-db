# This folder is a source-study package; benchmark_id is defined in the shared catalog.
benchmark:
  name: AgentArch
  description: 110 released input cases, 18 architecture configurations, and 39 possible single-axis changes. Original run outcomes were not located; this package contains no response table.
  paper_url: https://arxiv.org/abs/2509.10769
  data_source_url: https://github.com/ServiceNow/AgentArch
  release: withheld
  release_reason: >-
    This study pilot uses intervention-pilot-v2. Production schema integration
    and complete stimulus, grader, and system-configuration auditing are pending.
build:
  pilot_schema: intervention-pilot-v2
study:
  id: agentarch
  manifest: study.json
  catalog_mapping: ../../docs/intervention-pilot/catalog-mapping.json
  source_lock: ../../docs/intervention-pilot/sources.lock.json
