benchmark:
  name: RealTime QA
  description: Released weekly news-question predictions in multiple-choice and free-text generation settings.
  testing_condition: Import single-week baseline exports from the pinned author release. Multiple-choice grades
    use native prediction-list equality without guessing an index offset; generation uses the native normalized
    exact-match metric, not token F1. Preserve full question definitions and original predictions separately for
    each mode. Question dates are part of the task; exact historical prompts, endpoint revisions, inference settings
    and the precise retrieved passages supplied to each run are not recorded in the prediction exports. Literal
    model/configuration filename tokens are preserved without inventing historical model versions. Generation questions
    excluded by the native except rule, malformed generation records and missing references remain ungraded observations.
    A raw score is model confidence, not correctness. Cumulative exports may overlap weekly releases and are kept
    raw-only; February 2022 demonstration outputs lack released questions and are also raw-only. The June 13 outputs
    explicitly identify June 10 tasks, available in backnumber/2022/20220610_qa.jsonl. Captured search inputs and
    complete evaluation code remain in raw. These grades reconstruct the released scoring protocol; no model, search,
    judge or generated program is run.
  paper_url: https://arxiv.org/abs/2207.13332
  data_source_url: https://github.com/realtimeqa/realtimeqa_public
  subject_type: model
  item_type: question
  license: No dataset license identified in the captured author result repository; the old MIT attribution is unverified.
  citation: 'Kasai et al. RealTime QA: What is the Answer Right Now? NeurIPS Datasets and Benchmarks, 2023.'
  tags:
  - question_answering
  - temporal
  - news
  - retrieval
  modality:
  - text
  domain:
  - knowledge
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Incorrect under the original exact-match rule
      '1': Correct under the original exact-match rule
  categorical: true
  release_date: 2022-07
  release: public
  granularity: item
  multi_single_turn: single_turn
  version: ceca0397bfb2f1075a5d51124c24cbaf048d9cb3
