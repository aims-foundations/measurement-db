grading:
  verifiers:
    multiple_choice:
      kind: reconstructed_native_metric
      metric: multiple_choice_accuracy
      source: https://github.com/realtimeqa/realtimeqa_public/blob/ceca0397bfb2f1075a5d51124c24cbaf048d9cb3/scripts/evaluate_main.py
      function: accuracy
      index_conversion: none
      rule: Compare the complete prediction list to the complete released answer list with native equality. Indices
        are zero-based as stored upstream; do not shift them. Missing references produce a null grade. reference_answer
        stores the original index list and all original choices as JSON.
    generation:
      kind: reconstructed_native_metric
      metric: generation_exact_match
      source: https://github.com/realtimeqa/realtimeqa_public/blob/ceca0397bfb2f1075a5d51124c24cbaf048d9cb3/scripts/evaluate_main.py
      function: gen_eval
      normalization_source: https://github.com/realtimeqa/realtimeqa_public/blob/ceca0397bfb2f1075a5d51124c24cbaf048d9cb3/scripts/utils/tools.py
      rule: Use normalized exact match against every permutation of the referenced answer texts, joined with spaces.
        Normalization lowercases, removes ASCII punctuation and the counters 年, 歳, 人, 년, and collapses whitespace.
        The native grader excludes questions ending with except in the final ten lowercased, stripped characters.
        Missing references, excluded questions and non-string generations remain null. The selected response metric
        is EM; token F1 is not substituted. reference_answer stores the original indices and choices as JSON.
  rule: Reconstruct native multiple-choice accuracy and generation exact match; keep ungradable attempts null.
