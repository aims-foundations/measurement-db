grading:
  rule: Match-SOTA is 1 exactly when the reported solution passes its declared validity judge and its best SOTA-normalized
    aggregate improvement g is at least zero; otherwise it is 0. No-score cells receive the upstream failure grade,
    not an invented numeric g. Preserve full-precision native index values when available, and the published leaderboard
    precision otherwise. The native evaluator takes the first primary metric of each dataset instance, chooses the
    strongest reported SOTA value for its direction, and computes direction*(score-SOTA)/abs(SOTA). Missing/nonfinite
    instance scores receive -1 before averaging. The best submission is followed by a validity judgment. Import
    the recorded results; do not rerun evaluators or judges.
  verifiers:
    published_match_sota:
      kind: recorded_scientific_score_and_validity_judgment
      score_source: https://github.com/FrontisAI/NatureBench/blob/57f6f511d9e0a09321a110ad7b47b32213890d9b/eval_service.py
      metric_source: https://github.com/FrontisAI/NatureBench/blob/57f6f511d9e0a09321a110ad7b47b32213890d9b/submit-results/compute_scores.py
      judge_policy_source: https://github.com/FrontisAI/NatureBench/blob/57f6f511d9e0a09321a110ad7b47b32213890d9b/judge_core/policy.py
      task_evaluators: https://huggingface.co/datasets/FrontisAI/NatureBench/tree/27e2dc304464257d2884fa6996bc8ca5d4a2256b/tasks
      rule: Match-SOTA is 1 exactly when the reported solution passes its declared validity judge and its best SOTA-normalized
        aggregate improvement g is at least zero; otherwise it is 0. No-score cells receive the upstream failure
        grade, not an invented numeric g. Preserve full-precision native index values when available, and the published
        leaderboard precision otherwise. The native evaluator takes the first primary metric of each dataset instance,
        chooses the strongest reported SOTA value for its direction, and computes direction*(score-SOTA)/abs(SOTA).
        Missing/nonfinite instance scores receive -1 before averaging. The best submission is followed by a validity
        judgment. Import the recorded results; do not rerun evaluators or judges.
      execution: Only import published scores and verdicts. Exact historical evaluator/judge-code revisions and
        the third-party judging prompts are not recorded per run. The captured current code documents the public
        protocol.
