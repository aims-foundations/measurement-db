benchmark:
  name: NatureBench
  description: Published Match-SOTA outcomes for 23 coding-agent configurations on 90 scientific ML tasks, with
    complete available native run files and recorded validity judgments.
  testing_condition: 'Import all 2070 explicitly published full-track cells, including scores embedded separately
    in five leaderboard rows; the 25-task view is not another run. Retain the published model/harness, compute,
    time allowance and access conditions; they differ for third-party configurations. Sixteen configurations have
    a native run index and 1439 released conversations. The remaining seven have published scores but no conversation
    files in this captured release. The legacy Sonnet-4.6 and current GPT-5.5 verdicts are preserved; current HELIX
    outcomes declare Claude Opus 5 as their validity judge. Current reported grades supersede 79 older Match-SOTA
    labels; all historical cells and verdicts remain in traces. Two saved submission histories do not reach the
    index-reported best score, and 21 scored index rows have no saved numeric submission. Preserve both records
    rather than recomputing their grades. Item text is the published task brief, not the complete scientific input
    data or historical system prompt. The approximately 1.26TB task-data collection and agent workspaces are not
    embedded. One task brief changed on 2026-08-24: retain the older text where original conversations or pre-change
    publication establish it; other rows use the current published description without claiming an exact historical
    task snapshot. Preserve all 26 malformed original JSON log lines inside complete text carriers. No evaluation,
    model call, judge call or generated code is executed. Compact subject features percent-escape separators; complete
    original configuration strings remain in every trace.'
  paper_url: https://arxiv.org/abs/2606.24530
  data_source_url: https://huggingface.co/datasets/FrontisAI/NatureBench-traces
  subject_type: model
  item_type: task
  license: CC-BY-4.0 for the released process traces and original result metadata; MIT for original task/code contributions.
    Task-specific third-party data retain their own licenses and are not mirrored here.
  citation: 'Wang, Yuru, et al. NatureBench: Can Coding Agents Match the Published SOTA of Nature-Family Papers?
    (2026), arXiv:2606.24530.'
  tags:
  - scientific_ml
  - coding_agents
  - recorded_evaluations
  modality:
  - text
  domain:
  - science
  - ml_engineering
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': The published result does not meet Match-SOTA, including invalid or no-score results.
      '1': A valid reported result has aggregate improvement g >= 0.
  categorical: true
  release_date: 2026-06
  release: public
  granularity: item
  multi_single_turn: multi_turn
