benchmark:
  name: VisualWebArena
  description: Released automatic and human success judgments of multimodal web-agent trajectories on VisualWebArena.
  testing_condition: Import the 300 native trajectories and 300 individual human ratings released by AgentRewardBench.
    Preserve both binary grading channels as distinct item protocols; two judgments do not represent two agent executions.
    Join each rating by exact agent, experiment and task ID. Use the 910-task bank from libvisualwebarena 0.0.15,
    the version recorded in every trajectory, and verify its instructions and input-image paths. Retain complete
    released JSON records, including failures; source image omissions and external screenshot paths remain explicit.
    No agents, environments or graders are run.
  paper_url: https://arxiv.org/abs/2401.13649
  data_source_url: https://huggingface.co/datasets/McGill-NLP/agent-reward-bench
  subject_type: agent
  item_type: task
  license: 'AgentRewardBench custom dataset terms: use must be lawful and respect third-party rights and applicable
    third-party conditions; the source describes research use under applicable fair-use provisions. Derivatives
    must retain those terms, captured in raw/README.md. The VisualWebArena code''s MIT license is not asserted to
    license these separately released trajectories.'
  citation: 'Koh et al. (2024), VisualWebArena: Evaluating Multimodal Agents on Realistic Visual Web Tasks, arXiv:2401.13649.
    Lu et al. (2025), AgentRewardBench: Evaluating Automatic Evaluations of Web Agent Trajectories, arXiv:2504.08942.'
  tags:
  - agent
  - web_agent
  - human_evaluation
  modality:
  - text
  - gui_screenshot
  domain:
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': unsuccessful
      '1': successful
  categorical: true
  multi_single_turn: multi_turn
  granularity: item
  release_date: 2024-01
  release: public
build:
  contract_version: 2
  parameters:
    layout:
      trajectories: cleaned/visualwebarena/*/*/*.json
      annotations: data/annotations.csv
      benchmark_filter: visualwebarena
      task_archive: packages/libvisualwebarena-0.0.15-py3-none-any.whl
      task_member: visualwebarena/test_raw.json
      input_images: task_reference/environment_docker/webarena-homepage/static/input_images
      input_url_prefix: __HOMEPAGE__/static/input_images/
      recorded_goal_pattern: '\nInput image '
      recorded_image_pattern: 'url: ''([^'']+)'''
      image_path_prefix: /static/input_images/
    labels:
      harness: AgentRewardBench / AgentLab GenericAgent
grading:
  verifiers:
    human:
      judge: AgentRewardBench expert annotators
      rule: The released human annotation assesses whether the trajectory successfully fulfilled its original task.
      values:
        Successful: 1.0
        Unsuccessful: 0.0
      spec:
        kind: released_human_annotation
        source: https://huggingface.co/datasets/McGill-NLP/agent-reward-bench/blob/b6d17e646009d6cb63d5dd7be78807b680693f61/data/annotations.csv
        field: trajectory_success
        interpretation: Keep each original human rating and its anonymous annotator label in the trace; do not majority-vote
          or regrade.
        publication: https://arxiv.org/abs/2504.08942
    automatic:
      rule: The released binary cum_reward reports the automatic environment success judgment for this trajectory.
      spec:
        kind: released_environment_reward
        field: summary_info.cum_reward
        package: libvisualwebarena==0.0.15
        interpretation: Retain the original 0 or 1 without regrading; the task-specific evaluation configuration
          is included as reference.
        differs_from_human: This judgment is a separate grading protocol from the human annotation.
