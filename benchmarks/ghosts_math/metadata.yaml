    size: 477273
    sha256: 253a6f6ae1ef8e908a88429c74bb0642dcf64aeffca07f43102855705bff22cf
grading:
  rule: 'Use the source human rating unchanged: 1 means the query was misunderstood, 2 an entirely wrong answer,
    3 a partly correct answer, 4 a mostly correct answer, and 5 a fully correct answer. This ordinal scale is not
    binary accuracy. The assessment applies to the released prompt and original response; comments are annotation
    evidence, not an automatically extracted reference solution.'
  verifiers:
    rating:
      kind: human_mathematics_rating
      source: https://arxiv.org/html/2301.13867v2#A2.SS4
      field: rating
      protocol: Paper Appendix B.4
      annotator: Author mathematicians; individual assignment not released
