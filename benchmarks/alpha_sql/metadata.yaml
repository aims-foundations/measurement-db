benchmark:
  name: Alpha-SQL (BIRD dev)
  description: Released final SQL queries from Alpha-SQL, a Monte Carlo tree-search system
    using Qwen2.5-Coder-32B-Instruct, on the BIRD development questions.
  testing_condition: Preserve all 1,534 released predictions, their original questions,
    database files, schema and column descriptions. Derive execution-match grades locally;
    the release does not provide individual official judgments or intermediate search traces.
    Compare complete result sets, following BIRD's execution criterion. Retain the previous
    curation's 60-second allowance per query; the upstream BIRD wrapper instead defaults to
    30 seconds for the combined prediction/reference execution. A failed or timed-out reference
    remains ungraded; a failed predicted query scores zero when its reference is executable.
    These are explicitly derived curation grades, not the paper's reported 69.7 percent result.
    Capture the released system configuration and prompt templates; exact historical intermediate
    model requests and retrieval outputs remain unavailable. No models or agents are run.
  paper_url: https://arxiv.org/abs/2502.17248
  data_source_url: https://github.com/HKUSTDial/Alpha-SQL
  subject_type: model
  item_type: text_question
  license: 'Alpha-SQL code and prediction release: MIT. BIRD data: CC-BY-SA-4.0,
    as declared by the authors on 2024-04-27.'
  citation: 'Li, B. et al. (2025). Alpha-SQL: Zero-Shot Text-to-SQL using Monte Carlo
    Tree Search. ICML. Li, J. et al. (2023). Can LLM Already Serve as A Database
    Interface? A BIg Bench for Large-Scale Database Grounded Text-to-SQLs. NeurIPS.'
  tags: [text_to_sql, databases, monte_carlo_tree_search]
  modality: [text]
  domain: [software_engineering]
  response_type: binary
  response_scale:
    kind: discrete
    values: [0, 1]
    meanings: {'0': different_result_or_failed_predicted_query, '1': equal_complete_result_sets}
    direction: higher_is_better
  categorical: true
  release_date: '2025-02'
  multi_single_turn: multi_turn
