grading:
  rule: Execute the recorded SQL prediction and reference SQL against the same original
    SQLite database in read-only mode. Compare their complete sets of result rows, retaining
    tuple column order while ignoring duplicate rows and row order. Equal sets score 1;
    unequal sets or an unexecutable prediction score 0 when the reference executes successfully.
    A reference error or timeout leaves the attempt ungraded. Every attempt and complete SQL
    prediction is retained. This curation uses a 60-second allowance for each distinct query;
    runtime-dependent timeouts can vary across machines.
  verifiers:
    execution:
      kind: sqlite_result_set_comparison
      source: https://github.com/AlibabaResearch/DAMO-ConvAI/blob/188835d4f9948563a6b9c8ac50cd0f3ae4021ed6/bird/llm/src/evaluation.py
      function: execute_sql
      timeout_per_query_seconds: 60
      connection: read_only
      reference_execution_failure: null_grade
      predicted_execution_failure: zero_when_reference_executes
      origin: derived_during_curation
