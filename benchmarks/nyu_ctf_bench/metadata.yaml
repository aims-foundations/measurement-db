benchmark:
  description: Published challenge-level flag-recovery assessments from 15 NYU CTF leaderboard submissions, with
    original challenge inputs and released agent trajectories.
  testing_condition: Each row is one published submission/challenge assessment, not an inferred individual execution
    attempt. The three baseline submissions report pass@5; other submissions report pass@1. Missing or errored runs
    count as failure under the upstream summary policy, but challenge keys absent from a submitted summary remain
    absent here. Published false assessments without released traces do not establish whether an attempt took place.
    Separate all submitted agent configurations, including CRAKEN with and without Graph-RAG. Task inputs come from
    the pinned original repository and its linked forensic archive. Historical server state and unreleased trajectories
    are not reconstructed. Original upstream truncation is retained; this builder adds none and executes no challenge
    or agent.
  paper_url: https://arxiv.org/abs/2406.05590
  data_source_url: https://github.com/NYU-LLM-CTF/NYU_CTF_Bench
  subject_type: model
  item_type: task
  license: GPL-2.0 for the NYU_CTF_Bench task repository, with original notices retained. The separate leaderboard_submissions
    repository and linked forensic input do not declare explicit redistribution terms; raw and formatted data remain
    local pending clarification. The previous blanket MIT attribution is unsupported.
  citation: "@inproceedings{shao2024nyuctf,\n  title={NYU CTF Bench: A Scalable Open-Source Benchmark Dataset for\
    \ Evaluating LLMs in Offensive Security},\n  author={Shao, Minghao and Jancheska, Sofija and Udeshi, Meet and\
    \ Dolan-Gavitt, Brendan and Xi, Haoran and Milner, Kimberly and Chen, Boyuan and Yin, Max and Garg, Siddharth\
    \ and Krishnamurthy, Prashanth and Khorrami, Farshad and Karri, Ramesh and Shafique, Muhammad},\n  booktitle={NeurIPS\
    \ 2024 Datasets and Benchmarks Track},\n  year={2024},\n}"
  tags:
  - cybersecurity
  - ctf
  - offensive_security
  - agent
  modality:
  - text
  domain:
  - cybersecurity
  - software_engineering
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': published assessment reports no successful flag recovery within its stated allowance
      '1': published assessment reports successful flag recovery within its stated allowance
  categorical: true
  release_date: 2024-06
  release: public
  name: NYU CTF Bench
  version: 69def02a79e8b1d890e1e0d5c11106a9f40e11e1
  granularity: item
  multi_single_turn: multi_turn
