benchmark:
  name: InterCode
  description: Released interactive coding episodes in SQL, Bash, Python and capture-the-flag environments,
    with their original maximum rewards and complete trajectories.
  testing_condition: Import all 57 AI result files, including the six files wrapped under logs; exclude the
    human run. Task IDs in results are task-bank row positions, including for MBPP. Each original source file
    and record identifies a published observation, not necessarily an independent generation. Preserve identical
    records across exports without deduplicating across models. Separate model, environment, prompting strategy
    and recorded turn/refinement budgets. The file named 25_turns reports 15 turns; the explicit model in a
    Python filename takes precedence over its inconsistent parent directory. Bash fs_1 to fs_4 identify different
    input filesystems, not few-shot counts. SQL handicap runs provide the released schema in the initial stimulus.
    Native SQL rewards can be negative; the original CTF pilot used a different signed flag grader. Keep each
    protocol and scale explicit. Attach pinned source SQL data, Bash setup descriptions and non-solution CTF
    input files without executing them. These are released task-context resources, not verified historical
    container images or external service snapshots. Recorded CTF questions remain authoritative where two differ
    from current descriptions. Historical CTF flags change between releases, so CTF criteria retain the grading
    rule without assigning a current flag to a historical run. Source traces retain every field and are not
    clipped; 91 original turn counts differ from the recorded action-list length, and one published best-step
    index is a -1 sentinel despite a recorded step; all remain unchanged. Historical runtime/model revisions
    and full API request dialogues are not generally available.
  paper_url: https://arxiv.org/abs/2306.14898
  data_source_url: https://github.com/princeton-nlp/intercode
  subject_type: model
  item_type: task
  license: InterCode declares MIT. Its NL2Bash, Spider, MBPP and CTF constituent sources retain their source-specific
    terms and attribution in the captured repository.
  citation: '@inproceedings{yang2023intercode, title={InterCode: Standardizing and Benchmarking Interactive
    Coding with Execution Feedback}, author={Yang, John and Prabhakar, Akshara and Narasimhan, Karthik and
    Yao, Shunyu}, booktitle={NeurIPS Datasets and Benchmarks}, year={2023}}'
  tags:
  - interactive_coding
  - agent
  - execution_feedback
  modality:
  - text
  - code
  domain:
  - code
  - tool_use
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2023-06
  release: public
  version: c3e46d827cfc9d4c704ec078f7abf9f41e3191d8
  granularity: item
  multi_single_turn: multi_turn
