grading:
  rule: Preserve each original summary.max_reward on the environment-specific grading scale, without clipping,
    normalization or regrading.
  verifiers:
    ic_sql:
      kind: released_execution_reward
      environment: ic_sql
      source: https://github.com/princeton-nlp/intercode/blob/c3e46d827cfc9d4c704ec078f7abf9f41e3191d8/intercode/envs/sql/sql_env.py
      rule: Maximum recorded execution reward across the episode. SQL compares result multisets by intersection
        over union, multiplied by signed Kendall correlation when defined; negative rewards are valid.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
      scope: Import summary.max_reward and preserve the original episode. No actions, evaluation code, model
        calls or new grading are executed.
    ic_bash:
      kind: released_execution_reward
      environment: ic_bash
      source: https://github.com/princeton-nlp/intercode/blob/c3e46d827cfc9d4c704ec078f7abf9f41e3191d8/intercode/envs/bash/bash_env.py
      rule: 'Maximum recorded execution reward across the episode. Bash combines a 0.01 base with three components
        weighted 0.33: filesystem changes, matching changed-file contents, and command-output similarity. Preserve
        recorded floating-point values.'
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      scope: Import summary.max_reward and preserve the original episode. No actions, evaluation code, model
        calls or new grading are executed.
    ic_python:
      kind: released_execution_reward
      environment: ic_python
      source: https://github.com/princeton-nlp/intercode/blob/c3e46d827cfc9d4c704ec078f7abf9f41e3191d8/intercode/envs/python/python_env.py
      rule: Maximum recorded execution reward across the episode. The MBPP grader compares each submitted-function
        RPC result with the reference-function RPC result under the released tests and setup code, and records
        the matching fraction.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      scope: Import summary.max_reward and preserve the original episode. No actions, evaluation code, model
        calls or new grading are executed.
    ic_ctf:
      kind: released_execution_reward
      environment: ic_ctf
      source: https://github.com/princeton-nlp/intercode/blob/c3e46d827cfc9d4c704ec078f7abf9f41e3191d8/intercode/envs/ctf/ctf_env.py
      rule: 'Maximum recorded flag reward across the episode: the later CTF grader compares the submitted flag
        to the historical target case-insensitively. Historical flags are not fixed by the released episode
        logs and are not inferred from the current task bank.'
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '0': No recorded successful flag submission.
          '1': At least one successful flag submission.
      scope: Import summary.max_reward and preserve the original episode. No actions, evaluation code, model
        calls or new grading are executed.
    ic_ctf_initial:
      kind: released_execution_reward
      environment: ic_ctf_initial
      source: https://github.com/princeton-nlp/intercode/blob/69922e2f331b36a7d94b5da4a7ed10289e6c4c94/intercode/envs/game/ctf_env.py
      rule: Maximum recorded reward in the original four-task CTF experiment. Its grader compares flags case-sensitively
        and assigns 1 for success and -1 for an incorrect submission; other steps may record 0. Historical
        reference flags are not inferred from later definitions.
      response_scale:
        kind: discrete
        values:
        - -1
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '-1': Best recorded step reward is an incorrect flag submission.
          '0': Best recorded step reward is neutral.
          '1': At least one successful flag submission.
      scope: Preserve this earlier grading protocol separately from the later 0/1 CTF protocol.
