benchmark:
  name: TheAgentCompany
  description: 'TheAgentCompany: ~175 consequential real-world workplace agent tasks across professional
    domains (admin, HR, finance/PM, software engineering, data science). Each task has an agent-facing
    prompt (task.md) and a checkpoint rubric; runs are graded into a partial-credit final_score. Per-(model,
    task) final scores are taken from the official experiments leaderboard repo.'
  testing_condition: Each recorded attempt is graded by the released final_score.result / final_score.total.
    The scaffold identifies the subject configuration; test_condition is null. Task-specific evaluator
    definitions distinguish identical prompts with different grading protocols. Native JSON and text trajectories
    are retained in full, including tool outputs, without reconstructing them from an earlier MeasurementDB
    table.
  paper_url: https://arxiv.org/abs/2412.14161
  data_source_url: https://github.com/TheAgentCompany/experiments
  subject_type: model
  item_type: task
  license: MIT
  citation: "@misc{xu2025theagentcompanybenchmarkingllmagents,\n      title={TheAgentCompany: Benchmarking\
    \ LLM Agents on Consequential Real World Tasks},\n      author={Frank F. Xu and Yufan Song and Boxuan\
    \ Li and Yuxuan Tang and Kritanjali Jain and Mengxue Bao and Zora Z. Wang and Xuhui Zhou and Zhitong\
    \ Guo and Murong Cao and Mingyang Yang and Hao Yang Lu and Amaad Martin and Zhe Su and Leander Maben\
    \ and Raj Mehta and Wayne Chi and Lawrence Jang and Yiqing Xie and Shuyan Zhou and Graham Neubig},\n\
    \      year={2025},\n      eprint={2412.14161},\n      archivePrefix={arXiv},\n      primaryClass={cs.CL},\n\
    \      url={https://arxiv.org/abs/2412.14161},\n}"
  tags:
  - agent
  modality:
  - text
  - gui_screenshot
  domain:
  - tool_use
  response_type: fraction
  response_scale:
    kind: interval
    min: 0
    max: 1
    direction: higher_is_better
  categorical: false
  release_date: 2024-12
  release: private
  one_line_description: Evaluates agents on workplace tasks in a simulated company using task-specific
    checkpoint scores.
  multi_single_turn: multi_turn
