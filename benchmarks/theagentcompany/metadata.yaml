sources:
  upstream:
  - name: runs
    url: https://github.com/TheAgentCompany/experiments
    revision: f9b1e9411fcb554e76509a0e1bc8fe7f8b0e69d6
    tree_paths:
    - README.md
    - evaluation/1.0.0/*
    files:
    - match: (?P<file>README\.md|evaluation/1\.0\.0/[^/]+/(?:README\.md|(?:results|trajectories)/[^/]+))
      path: experiments/{file}
  - name: tasks
    url: https://github.com/TheAgentCompany/TheAgentCompany
    revision: 98b68ef82a47690c316f42fddb05baafaab56851
    files:
    - match: workspaces/tasks/(?P<task>[^/]+)/(?P<file>task\.md|evaluator\.py)
      path: tasks/{task}/{file}
grading:
  rule: Response is the fraction of available checkpoint credit awarded by the task evaluator, as recorded
    in final_score.result / final_score.total.
  verifiers:
    checkpoint:
      kind: provider_result_mapping
      source_revision: 98b68ef82a47690c316f42fddb05baafaab56851
      interpretation: Read the released checkpoint fraction; captured grading code is versioned, not asserted
        to be the exact historical run commit.
