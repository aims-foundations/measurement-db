grading:
  rule: 'Apply the released model-specific parser and compare the numeric choice to ground_truth (1 or 2). GPT-3.5
    checks Recipe 1 before Recipe 2, then numeric conversion. Gemini takes the first character. o1 takes the first
    character after the notebook character-set strip when Answer: is present. Other models use numeric conversion.
    Missing or unparseable outputs remain ungraded; original text is retained.'
  verifiers:
    published:
      kind: released_model_specific_parser_then_exact_match
      source: https://github.com/thomasat/llms-sustainable-food/blob/916e6474d322554dcd5477e2f4e1caa5f7de9ba8/recipe-rating-prediction/task_4_step_3_performance_analysis.ipynb
      implementation: process_responses_gpt_3, process_responses_gemini, process_responses_o1; numeric comparison
        to ground_truth
      limitation: Preserve original parser precedence; do not rerun models or silently count unavailable output
        as failure.
