grading:
  rule: Import the original per-design metric cell from the final paper. Reported numerical precision and apparent
    source inconsistencies remain unchanged. Unreported metric values remain null; no aggregate is expanded into
    invented trials.
  verifiers:
    native_metric:
      kind: published_physical_measurement
      source: https://proceedings.neurips.cc/paper_files/paper/2025/file/1cba8502063fab9df252a63968691768-Paper-Datasets_and_Benchmarks_Track.pdf
      reference_implementation: https://github.com/MIRALab-USTC/ChiPBench/blob/ea28bebab06977b348a74d3fd07275bb828ca68e/benchmarking/getMetric.py
      historical_revision: The captured implementation documents the metric extraction; the exact historical runtime
        revision is not recorded.
      logic: Import printed native OpenROAD-flow measurements; each item identifies the metric, stage, reported
        unit and score direction. No new numerical simulation or normalization.
