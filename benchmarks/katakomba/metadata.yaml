grading:
  rule: Divide the recorded episode return by the released AutoAscend mean score for this role-race-alignment task.
    Keep the saved ratio without multiplying by 100, clipping or binarizing.
  verifiers:
    normalized_return:
      kind: recorded_environment_score
      source: https://github.com/tinkoff-ai/katakomba/blob/f7935bea46c5aa3ebc97fa5ab006afd4752aafe6/katakomba/env.py
      function: OfflineNetHackChallengeWrapper.get_normalized_score
      reference_source: https://github.com/tinkoff-ai/katakomba/blob/f7935bea46c5aa3ebc97fa5ab006afd4752aafe6/katakomba/utils/scores.py
      reference_table: MEAN_SCORES_AUTOASCEND
      execution: Read the published episode ratios and verify them against returns and the source normalizers. Do
        not run new policies or manufacture outcomes from summary statistics.
