benchmark:
  name: Katakomba
  description: Released final-checkpoint NetHack episode outcomes for 572 independently trained offline-RL policies
    across 38 character-configuration tasks.
  testing_condition: A subject is one recorded trained policy at its last saved evaluation checkpoint, with its
    actual training seed and configuration. An item is a procedural NetHack task specified by role, race and alignment;
    its 50 recorded episodes are repeated trials. Array positions record completion order within that policy's evaluation
    and do not identify a common game world across policies. The release contains 570 policies evaluated at step
    500000 and two longer runs at step 6600000. Of 738 finished public runs, 572 expose per-episode score arrays.
    The other 166 have configurations and aggregate summaries but no such arrays in their public run-file listings.
    Scores are ratios to the task's AutoAscend reference mean, may be negative, and are not success probabilities
    or percentages. The captured outcome records include return and depth, but no action/observation trajectories,
    exact starting game state or policy weights. The current pinned harness documents the task and normalization;
    run-specific code and configuration are preserved separately, without asserting that the current Git revision
    produced the historical runs.
  paper_url: https://arxiv.org/abs/2306.08772
  data_source_url: https://wandb.ai/tlab/NetHack
  subject_type: model
  item_type: procedural_rl_task
  license: Apache-2.0 for the Katakomba source code. NetHack, NLE and the published experiment files retain their
    respective upstream terms.
  citation: 'Kurenkov, Nikulin, Tarasov and Kolesnikov. Katakomba: Tools and Benchmarks for Data-Driven NetHack.
    NeurIPS Datasets and Benchmarks, 2023.'
  tags:
  - offline_rl
  - nethack
  - sequential_decision_making
  modality:
  - grid
  domain:
  - reinforcement_learning
  response_type: continuous_unbounded
  categorical: false
  response_scale:
    kind: interval
    min: null
    max: null
    direction: higher_is_better
  release_date: null
  multi_single_turn: multi_turn
