benchmark:
  description: Recorded answer choices and correctness from the NAEP LLM-as-student study, linked to original NAEP
    question pages.
  testing_condition: Import all 53,680 released observations for 488 questions and 11 models, retaining prompt type
    and target student grade. The article describes 489 questions; no extra question or response is fabricated.
    The original NAEP item HTML and linked source images are preserved losslessly, rather than stripping illustrations
    or mathematical notation. The article reports text-only inputs, but the historical text rendering and full generated
    solutions were not released. Source-document attachments do not claim that images were delivered to the models.
    Grades are the original is_correct flags, checked against predicted_option and gold_option. A follow-up model
    prompt extracted choices in the study; this import does not rerun extraction or grading. The 1,153 literal Omitted
    choices retain their source-recorded grade of zero. Human percent_correct is an aggregate source statistic,
    not an individual student response or an item input feature. Exact historical model, harness and extractor revisions
    are unknown. The four shortened LLaMA labels remain literal because their Chat/Instruct checkpoint variants
    were not established by the released records.
  paper_url: https://arxiv.org/abs/2507.08232
  data_source_url: https://github.com/kvadityasrivatsa/IRT-for-LLMs-as-Students
  subject_type: model
  item_type: question
  license: MIT for the authors' recorded results and analysis code. NAEP source pages and illustrations retain their
    original attributions.
  citation: "@article{srivatsa2025naepllm,\n  title={Can LLMs Reliably Simulate Real Students' Abilities in Mathematics\
    \ and Reading Comprehension?},\n  author={Srivatsa, KV Aditya and Maurya, Kaushal Kumar and Kochmar, Ekaterina},\n\
    \  journal={arXiv preprint arXiv:2507.08232},\n  year={2025}\n}"
  tags:
  - naep
  - student-simulation
  - item-response-theory
  - education
  - llm-eval
  modality:
  - text
  domain:
  - education
  - mathematics
  - reasoning
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': The recorded extracted choice differs from the released key.
      '1': The recorded extracted choice equals the released key.
  categorical: true
  release_date: 2025-07
  release: public
  name: NAEP LLM-as-Student
  granularity: item
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    layout:
      responses: study/naep_consolidated_responses.csv
      pages: naep/*/items/*.json
      images: naep/*/images/*
    parsing:
      question_prefix: 'Question ID:'
      resource_pattern: TableID=([0-9a-fA-F-]+)$
      correct_answer_pattern: ^The correct answer is:\s*([A-Z])\.
    labels:
      image_role: source_document_image
      input_scope: original_NAEP_HTML_with_historical_text_rendering_unreleased
      default_condition: prompt={prompt_type}
      enforced_condition: prompt={prompt_type};enforced_grade={student_grade}
      output_scope: released_extracted_choice; full_generation_unreleased
    image_media_types:
      89504e: image/png
      '474946': image/gif
      ffd8ff: image/jpeg
    model_aliases:
      CogBase-USTC--SocraticLM: CogBase-USTC/SocraticLM
      Qwen--Qwen2.5-7B-Instruct: Qwen/Qwen2.5-7B-Instruct
      Qwen--Qwen2.5-Math-7B-Instruct: Qwen/Qwen2.5-Math-7B-Instruct
      mistralai--Mistral-7B-Instruct-v0.3: mistralai/Mistral-7B-Instruct-v0.3
      learnlm-1.5-pro-experimental: learnlm-1.5-pro-experimental
      llama2-13B: llama2-13B
      llama2-70B: llama2-70B
      llama3.1-8B: llama3.1-8B
      llama3.1-70B: llama3.1-70B
      gpt-3.5-turbo: gpt-3.5-turbo
      o3-mini: o3-mini
    subject_features:
      benchmark_protocol: NAEP LLM-as-student study
      historical_model_revision: not_recorded
      historical_harness_revision: not_recorded
      paper_reported_temperature: '0'
      paper_reported_top_p: '0.95'
      paper_reported_max_tokens: '2048'
      prompt_and_target_grade: recorded in response.test_condition
grading:
  rule: Import the original binary is_correct flag and require exact agreement between the released predicted_option
    and gold_option. Check each released gold option against the original NAEP scoring guide. The predicted option
    is the result of the study's follow-up LLM extraction prompt; the full solution and extractor execution are
    unavailable.
  verifiers:
    choice:
      kind: published_choice_equality
      source: https://arxiv.org/html/2507.08232v1#S5.SS3
      recorded_grade: is_correct
      prediction: predicted_option
      reference: gold_option
      extraction: follow-up model prompt, appendix B figure 13
      extractor_revision: not_recorded
      reference_check: byte-pinned original NAEP scoring guide
      execution: not_performed
