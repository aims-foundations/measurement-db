benchmark:
  description: Readability of educational answers from base, grade-prompted and grade-finetuned GPT models. Preserve
    the released DGPT answers and integrate their recorded readability estimates with the authors' classifier.
  testing_condition: All 14 released result files contain 740 question occurrences, representing 734 distinct questions.
    The GPT-4o file restarts its printed numbering after 140 records; use source position and question text for
    alignment. Retain repeated questions as separate trials, with the complete answer and all eight recorded readability
    measurements in each trace. The response is the integrated six-category reading level, not correctness or target-alignment
    success. The classifier combines seven metrics; ARI is an independent held-out metric. Preserve the released
    classifier's label handling, including its college fallback for Gunning Fog grade 6. Exact historical model
    endpoints, fine-tuning IDs and run-time configurations are unavailable. Captured inference settings describe
    reference code, not verified historical requests. The separately linked training corpus and paper-wide aggregates
    are not evaluation attempts. No model inference, readability recomputation or new judging is performed.
  paper_url: https://arxiv.org/abs/2601.06225
  data_source_url: https://github.com/harryoh99/ClassroomAI
  subject_type: model
  item_type: question
  license: No explicit license accompanies the released code or result files.
  citation: "@article{oh2026classroom,\n  title={Classroom AI: Large Language Models as Grade-Specific Teachers},\n\
    \  author={Oh, Jio and Whang, Steven Euijong and Evans, James and Wang, Jindong},\n  journal={npj Artificial\
    \ Intelligence},\n  year={2026}\n}"
  tags:
  - education
  - readability
  - grade-level
  - age-appropriate
  - content-generation
  - finetuning
  - llm-teacher
  modality:
  - text
  domain:
  - education
  response_type: ordinal
  response_scale:
    kind: discrete
    values: [1, 2, 3, 4, 5, 6]
    meanings:
      '1': Lower elementary (grades 1–2).
      '2': Middle elementary (grades 3–4).
      '3': Upper elementary (grades 5–6).
      '4': Middle school (grades 7–9).
      '5': High school (grades 10–12).
      '6': College or adult (grade 13 and above).
    direction: unordered
  categorical: true
  release_date: 2026-01
  name: Classroom AI
  multi_single_turn: single_turn
