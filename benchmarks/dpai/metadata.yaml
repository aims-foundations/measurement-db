grading:
  rule: Preserve score.normalized_score from the released evaluation record. The author scores targeted tests and
    regression checks with a weighted sum, normalized to 100 for blind and 50 for informed evaluation. These are
    pipeline outcomes, including upstream setup, patch and checker failures, not binary correctness. Keep the exact
    source score rather than recalculating or imputing it. The attached reference patch and test definitions describe
    the matching released task.
  verifiers:
    blind:
      tests_visible: false
      response_scale:
        kind: interval
        min: 0
        max: 100
        direction: higher_is_better
      implementation:
        kind: published_result_field
        field: score.normalized_score
        source: https://dpaia.dev/
        protocol_source: https://github.com/dpaia/ee-bench-specs/blob/c083596f54955d04fa00e56697f8c829fc475e21/jvm/dpaia-jvm-evaluation.yaml
        historical_run_verifier_revision: null
        scope: Import published native grading results. Do not execute tests or judge patches again.
        phase: blind
    informed:
      tests_visible: true
      response_scale:
        kind: interval
        min: 0
        max: 50
        direction: higher_is_better
      implementation:
        kind: published_result_field
        field: score.normalized_score
        source: https://dpaia.dev/
        protocol_source: https://github.com/dpaia/ee-bench-specs/blob/c083596f54955d04fa00e56697f8c829fc475e21/jvm/dpaia-jvm-evaluation.yaml
        historical_run_verifier_revision: null
        scope: Import published native grading results. Do not execute tests or judge patches again.
        phase: informed
