benchmark:
  name: DPAI Arena
  description: Published blind and test-informed software-agent evaluations on enterprise Java/Spring tasks.
  testing_condition: 'Import the fifteen public leaderboard reports captured in September 2026. Each contains 153
    tasks evaluated in blind and test-informed conditions. Preserve the published normalized score on its original
    phase-specific scale, including partial credit, timeout results, empty-patch attempts and pipeline failures.
    A skipped patch collector does not imply an unattempted task: the native records include completed agent executions.
    Retain the zero score for the one failed-patch record that reached no scoring evaluator. The reconstructed item
    includes the released issue, repository, base commit and condition-specific test information; it is not a historical
    API transcript. Exact historical execution and grading-code revisions are not identified in these reports. Use
    per-attempt model and CLI version fields; use the native prediction source filename when the CLI name is omitted,
    and leave unknown CLI versions null.'
  paper_url: https://dpaia.dev/
  data_source_url: https://dpaia.dev/
  subject_type: agent
  item_type: task
  license: The grading specifications are Apache-2.0. A data-specific redistribution license for the TeamCity reports
    and task dataset is not stated in the inspected releases.
  citation: DPAI Arena. Developer Productivity AIrena. https://dpaia.dev/.
  tags:
  - software_engineering
  - agent
  - enterprise
  modality:
  - text
  domain:
  - coding
  - agents_and_tool_use
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: null
  multi_single_turn: multi_turn
build:
  contract_version: 2
  parameters:
    reports:
      prefix: reports/
    tasks:
      file: ee-dataset/datasets/java-spring-ee-dataset.json
      scope: Released issue and repository state with test information in the informed condition. Not a reconstruction
        of the full historical API envelope.
    subject:
      source_pattern: /([^/]+)-(?:blind|informed)-predictions\.json$
      scope: Configured model label and per-attempt CLI identity. Omitted versions remain unknown. The source filename
        supplies an omitted CLI name.
