benchmark:
  description: Published workflow question answers, demonstration judgments, SOP rankings, SOP generation and per-screenshot
    segmentation outcomes. Original SOPs, action traces and screenshots supply the actual task context.
  testing_condition: Import original graded AI outputs only. QA rubric scores retain their 1-best to 3-worst direction.
    Ranking correlations describe an entire ranked SOP set and appear once per set and metric. Preserve native screenshot-level
    segmentation grades only where the released task explicitly defines workflow labels. Ungraded segmentation conditions
    and SOP-improvement outputs remain in raw, as do human QA reference baselines. Model labels and ablations are
    recorded literally; backend routes and image limits are documented by the pinned harness, not claimed as separately
    logged per-call telemetry. No model or judge is executed.
  paper_url: https://arxiv.org/abs/2406.13264
  data_source_url: https://github.com/HazyResearch/wonderbread
  subject_type: model
  item_type: task
  license: CC-BY-4.0 for the versioned Zenodo dataset. The captured upstream code has no separate license file at
    the pinned commit.
  citation: "@article{hazyresearch2024wonderbread,\n  title={WONDERBREAD: A Benchmark for Evaluating Multimodal\
    \ Foundation Models on Business Process Management Tasks}, \n  author={Michael Wornow and Avanika Narayan and\
    \ Ben Viggiano and Ishan S. Khare and Tathagat Verma and Tibor Thompson and Miguel Angel Fuentes Hernandez and\
    \ Sudharsan Sundar and Chloe Trujillo and Krrish Chawla and Rongfei Lu and Justin Shen and Divya Nagaraj and\
    \ Joshua Martinez and Vardhan Agrawal and Althea Hudson and Nigam H. Shah and Christopher Re},\n  journal={Advances\
    \ in Neural Information Processing Systems},\n  volume={37},\n  pages={115963--116021},\n  url={https://hazyresearch.stanford.edu/wonderbread-website},\n\
    \  year={2024}\n}"
  tags:
  - bpm
  - agents
  - workflow
  - multimodal
  modality:
  - image
  - text
  domain:
  - agents
  - general
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2024-06
  release: public
  name: WONDERBREAD
  granularity: item
  multi_single_turn: multi_turn, single_turn
build:
  contract_version: 2
  parameters:
    layout:
      gold_archive: zenodo/gold_demos_sop_and_trace_and_screenshots_only.zip
      additional_demos: additional/demos
      helpers: source/wonderbread/helpers.py
      webarena_tasks: source/wonderbread/benchmark/webarena
    interfaces:
      gitlab: Gitlab
      shopping: Generic e-commerce site
      shopping_admin: Generic e-commerce admin based on Adobe Magneto
      reddit: Generic open source Reddit clone
    instructions:
      question_answering: Answer the question using the supplied workflow evidence.
      task_completion: Determine whether the demonstrated workflow completed the described task.
      task_trajectory: Determine whether the demonstration accurately follows the supplied workflow guide.
      sop_ranking: Rank these complete workflow guides by quality for the stated task. Return their rankings in
        the supplied SOP order.
      sop_generation: Write a step-by-step standard operating procedure for the stated task using the supplied workflow
        evidence.
      demo_segmentation: Identify the workflow shown at the target screenshot UUID within this concatenated screenshot
        sequence. Workflow labels follow the supplied definition order.
    models:
      GPT4/text: gpt-4-0125-preview
      GPT4/image: gpt-4-vision-preview
      GeminiPro/text: gemini-1.0-pro
      GeminiPro/image: gemini-pro-vision
      Claude3/text: claude-3-sonnet-20240229
      Claude3/image: claude-3-sonnet-20240229
    runtime_notes:
      GPT4: The pinned router uses temperature 0 and at most 4096 output tokens.
      GeminiPro: The pinned vision wrapper retains at most the first 16 screenshots per call.
      Claude3: The pinned wrapper retains at most the first 20 screenshots per call and at most 4096 output tokens.
        SOP generation splits long screenshot sequences into chunks of at most 10 images, then makes a follow-up
        model call to merge the generated text.
      segmentation: The original harness groups input demonstrations by embedded workflow task ID before shuffling.
        Preserve this grouping, including the released cases where multiple demonstrations share an ID.
      representations: Item contents preserve task text, SOPs and ordered workflow evidence. Exact prompt templates
        and provider-specific formatting remain in the pinned original source. Grading references are separate from
        task content.
    results:
      question_answering: source/data/experimental_results/question_answering_all_results.csv
      demo_validation: source/data/experimental_results/demo_validation_all_results.csv
      sop_ranking: source/data/experimental_results/sop_ranking_all_results.csv
      demo_segmentation: source/data/experimental_results/demo_segmentation_all_results.csv
      sop_generation: source/data/experimental_results/sop_generation/sop_generation_eval.csv
    labels:
      harness_revision: ed052c67aeada04167cdfe92ff8de454aa94627a
      action_formatter: convert_trace_action_to_dsl
      gold_prefix: gold_demos_sop_and_trace_and_screenshots_only/
      transition: 'Action: PRESS(Cmd+Tab)'
      condition: Original published WONDERBREAD output and grade
grading:
  rule: Keep the source metric and observation unit.
  verifiers:
    question_answering/completeness_score:
      kind: judge
      rule: Use the released completeness judgment under the original question-answering rubric. 1 is best and 3
        is worst; do not reverse or normalize the grade.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        direction: lower_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/eval.py:get_completeness_score
        rubric: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/prompts.py:prompt__completeness_score
        declared_judge: gpt-4-0125-preview
        execution: Import the released grade. Do not call the judge.
    question_answering/soundness_score:
      kind: judge
      rule: Use the released soundness judgment under the original question-answering rubric. 1 is best and 3 is
        worst; do not reverse or normalize the grade.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        direction: lower_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/eval.py:get_soundness_score
        rubric: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/prompts.py:prompt__soundness_score
        declared_judge: gpt-4-0125-preview
        execution: Import the released grade. Do not call the judge.
    question_answering/clarity_score:
      kind: judge
      rule: Use the released clarity judgment under the original question-answering rubric. 1 is best and 3 is worst;
        do not reverse or normalize the grade.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        direction: lower_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/eval.py:get_clarity_score
        rubric: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/prompts.py:prompt__clarity_score
        declared_judge: gpt-4-0125-preview
        execution: Import the released grade. Do not call the judge.
    question_answering/compactness_score:
      kind: judge
      rule: Use the released compactness judgment under the original question-answering rubric. 1 is best and 3
        is worst; do not reverse or normalize the grade.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        direction: lower_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/eval.py:get_compactness_score
        rubric: wonderbread/benchmark/tasks/knowledge_transfer/question_answering/prompts.py:prompt__compactness_score
        declared_judge: gpt-4-0125-preview
        execution: Import the released grade. Do not call the judge.
    demo_validation/is_correct:
      kind: exact_matcher
      rule: Match the parsed completion/trajectory judgment to the recorded true/false target. Preserve source parse
        failures as failures.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        meanings:
          '0': incorrect or missing parsed prediction
          '1': correct
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/knowledge_transfer/demo_validation/main.py
        execution: Import the native is_correct value.
    demo_segmentation/is_correct:
      kind: exact_matcher
      rule: Match the source parsed task ID at this UUID to the original workflow task ID. Score only native conditions
        with explicitly named workflow classes.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        meanings:
          '0': incorrect or missing parsed prediction
          '1': correct
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/documentation/demo_segmentation/main.py
        execution: Import the native is_correct value.
    sop_ranking/spearman_corr:
      kind: exact_matcher
      rule: Compute spearman_corr between the complete predicted and human reference rank vectors in the supplied
        SOP order. The published correlation repeats across member rows; import it once per ranking task.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/improvement/sop_ranking/main.py:evaluate_ranking
        execution: Import the original whole-ranking correlation; p-values are not grades.
    sop_ranking/kendall_corr:
      kind: exact_matcher
      rule: Compute kendall_corr between the complete predicted and human reference rank vectors in the supplied
        SOP order. The published correlation repeats across member rows; import it once per ranking task.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/improvement/sop_ranking/main.py:evaluate_ranking
        execution: Import the original whole-ranking correlation; p-values are not grades.
    sop_generation/precision:
      kind: judge
      rule: Fraction of generated SOP steps that the original LLM grader aligns to any reference step.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/documentation/sop_generation/metrics.py:PairwiseComparison.precision
        preprocessing: wonderbread/benchmark/tasks/documentation/sop_generation/eval.py:preprocess_sop
        declared_judge: gpt-4-1106-preview
        execution: Import the published SOP-generation evaluator table. Do not call the alignment judge.
    sop_generation/recall:
      kind: judge
      rule: Fraction of reference SOP steps that the original LLM grader aligns to any generated step.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/documentation/sop_generation/metrics.py:PairwiseComparison.recall
        preprocessing: wonderbread/benchmark/tasks/documentation/sop_generation/eval.py:preprocess_sop
        declared_judge: gpt-4-1106-preview
        execution: Import the published SOP-generation evaluator table. Do not call the alignment judge.
    sop_generation/ordering:
      kind: judge
      rule: Fraction of generated steps with a matching reference index at least as large as the previous retained
        index, using the original PairwiseComparison.ordering implementation.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      implementation:
        source: https://github.com/HazyResearch/wonderbread
        revision: ed052c67aeada04167cdfe92ff8de454aa94627a
        entry_point: wonderbread/benchmark/tasks/documentation/sop_generation/metrics.py:PairwiseComparison.ordering
        preprocessing: wonderbread/benchmark/tasks/documentation/sop_generation/eval.py:preprocess_sop
        declared_judge: gpt-4-1106-preview
        execution: Import the published SOP-generation evaluator table. Do not call the alignment judge.
