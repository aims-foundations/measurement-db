benchmark:
  description: 'AppWorld: interactive coding agent benchmark. Per-(agent, task) pass/fail decrypted from
    the public leaderboard''s experiment bundles; real per-task natural-language instructions from the
    released task data.'
  testing_condition: Per-task success booleans from the captured leaderboard experiment bundles. Subjects
    distinguish the model and agent scaffold; each item contains its full instruction and task-specific
    grading checks. Test split and database version are item attributes. No original per-run definition
    commit is inferred.
  paper_url: https://arxiv.org/abs/2407.18901
  data_source_url: https://github.com/StonyBrookNLP/appworld-leaderboard
  subject_type: agent
  item_type: task
  license: Apache-2.0
  citation: "@misc{trivedi2024appworldcontrollableworldapps,\n      title={AppWorld: A Controllable World\
    \ of Apps and People for Benchmarking Interactive Coding Agents},\n      author={Harsh Trivedi and\
    \ Tushar Khot and Mareike Hartmann and Ruskin Manku and Vinty Dong and Edward Li and Shashank Gupta\
    \ and Ashish Sabharwal and Niranjan Balasubramanian},\n      year={2024},\n      eprint={2407.18901},\n\
    \      archivePrefix={arXiv},\n      primaryClass={cs.SE},\n      url={https://arxiv.org/abs/2407.18901},\n\
    }"
  tags:
  - agent
  modality:
  - text
  - gui_screenshot
  domain:
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': failure
      '1': success
  categorical: true
  release_date: 2024-07
  release: private
  name: AppWorld
  one_line_description: Evaluates interactive coding agents on tasks spanning a simulated collection of
    applications.
  multi_single_turn: multi_turn
build:
  contract_version: 2
