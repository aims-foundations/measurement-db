grading:
  rule: Preserve the released scalar evaluator rating unchanged. Human annotations are reference assessments for
    later meta-evaluation; do not reinterpret the scalar as accuracy, snap off-rubric values, average raters, or
    normalize LiveQA reference scores.
  verifiers:
    published:
      kind: released_scalar_evaluator_rating
      source: https://github.com/wyim/morqa-eval/blob/e42dbc20600fc40b1957f075ef8cc9686530bb50/evaluate_rankings2.py
      implementation: METRIC2EXTRACTFUNC retains each LLM rating via the identity function; cache_system_results
        associates it with post_id and author_id_candidate.
      prompt_source: https://arxiv.org/html/2509.12405v1#A1.T10
      rubric_source: https://arxiv.org/html/2509.12405v1#A1.T11
      limitations: These are evaluator outputs, not correctness grades. Original completions and parsing requests
        are not released. Human annotations retain every metric and rater.
