benchmark:
  description: Released LLM evaluator ratings of medical candidate answers in English and Chinese, with original
    questions, reference answers and expert annotations.
  testing_condition: Subjects are four LLM evaluators; response is their released scalar assessment of candidate
    quality, not their correctness or agreement with a human. Keep every released rating, including 45 values outside
    the requested {0,0.5,1} rubric and four ratings on empty candidates. The interval storage domain preserves those
    outputs without rounding; higher ratings do not mean a more accurate evaluator. Items reconstruct the question,
    candidate and reference-answer inputs from author-linked releases, with the language-specific rubric described
    in the paper. Human annotations remain separate, complete reference records without averaging or rescaling;
    source LiveQA ratings include -2 unassessed markers. The release includes reference-answer candidates as well
    as generated candidates; it is broader than the paper system-only analyses. Full released baseline records are
    retained, but per-call judge completions, request envelopes and exact historical inference settings are not
    supplied. The multireference text condition is curated; reference-free/image ablations and separate MEDIQA challenges
    are outside scope. No evaluator or model is executed.
  paper_url: https://arxiv.org/abs/2509.12405
  data_source_url: https://github.com/wyim/morqa-eval
  subject_type: model
  item_type: task
  license: CDLA-Permissive-2.0 (OSF annotations); CC-BY-4.0 (underlying questions); GitHub baseline-result license
    unspecified
  citation: 'Yim et al., MORQA: Benchmarking Evaluation Metrics for Medical Open-Ended Question Answering, LREC
    2026.'
  tags:
  - medical
  - nlg-evaluation
  - llm-as-judge
  - multilingual
  modality:
  - text
  domain:
  - medicine
  - nlp_task
  response_type: continuous_bounded
  response_scale:
    kind: interval
    min: 0
    max: 1
  categorical: false
  release_date: 2025-09
  release: public
  name: MORQA evaluator ratings
  version: e42dbc20600fc40b1957f075ef8cc9686530bb50
  multi_single_turn: single_turn
  granularity: item
