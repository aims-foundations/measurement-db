benchmark:
  name: JETTS generator response pool
  description: Original scored generator responses released by JETTS across eight math, code and instruction-following
    component datasets.
  testing_condition: 'Import all 328685 outputs in the 44 reranking/refinement pool exports, including 31981 fractional
    AlpacaEval judgments. These are generator measurements on existing component benchmarks, not the JETTS judge
    leaderboard or a new independent task set. Each record retains its original component and query. The paper specifies
    one greedy seed followed by up to nine temperature-1.0, top-p-0.95 samples; the released reader uses the first
    response as the refinement seed. Separate these decoding configurations and preserve the actual list lengths:
    855 nominal response slots are absent and are not failures or extra attempts. Original request logs, model checkpoint
    revisions and system messages are unavailable. All recorded per-response scores are imported unchanged. Beam-search
    trees and newly generated judge/refinement outputs are distinct source products outside this released response-pool
    import. No new evaluation is performed.'
  paper_url: https://arxiv.org/abs/2504.15253
  data_source_url: https://github.com/SalesforceAIResearch/jetts-benchmark
  subject_type: model
  item_type: task
  license: Apache-2.0 for the JETTS code. Original component datasets retain their own terms.
  citation: 'Zhou et al. Evaluating Judges as Evaluators: The JETTS Benchmark of LLM-as-Judges as Test-Time Scaling
    Evaluators. ICML 2025.'
  tags:
  - test_time_scaling
  - generator_responses
  - math
  - code
  - instruction_following
  modality:
  - text
  domain:
  - mathematics
  - software_engineering
  - instruction_following
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: null
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      pool: reranking_and_refinement.tar.gz
      prefix: reranking_and_refinement/
    subject_features:
      harness: JETTS released generator response pool
      configuration_scope: Source model aliases and published sampling protocol. Immutable checkpoints and original
        per-call request logs are unavailable.
    temperatures:
      greedy: '0'
      sampled: '1.0'
    top_p:
      greedy: not specified for greedy decoding
      sampled: '0.95'
    observation:
      input_scope: Exact released query content. Unknown system messages and request wrappers are not reconstructed.
sources:
  upstream:
  - name: response_pool
    url: https://storage.googleapis.com/download/storage/v1/b/sfr-jetts-benchmark-data/o/reranking_and_refinement.tar.gz?generation=1750124990468031&alt=media
    file: reranking_and_refinement.tar.gz
    size: 159271046
    sha256: 249bf9eb17ae71e62c0a6555e0a1eda836e4b0859e3a2b46f62e99158e3afe60
    revision: '1750124990468031'
  - name: harness
    url: https://codeload.github.com/SalesforceAIResearch/jetts-benchmark/tar.gz/18c3e9e26deed2bd2d644164b2e1823389d8d1e7
    revision: 18c3e9e26deed2bd2d644164b2e1823389d8d1e7
