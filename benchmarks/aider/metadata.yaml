grading:
  rule: 'The recorded C++ build and unit tests must succeed within the Aider run''s maximum of two test-feedback
    cycles. Preserve the provider''s pass2 verdict: the final tests_outcomes boolean is the response. Compilation
    errors, failed tests and timeouts remain the recorded failures; MISRA violation counts are not the response.'
  verifiers:
    functional_tests:
      kind: code_execution
      source: https://github.com/paraemsi/Reducing-violations-paper-data/tree/c1c4381d91106cf6bcc811c323a00104712a6ad0
