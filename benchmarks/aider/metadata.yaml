      method: 'benchmark.run_unit_tests with benchmark/cpp-test.sh: configure CMake with EXERCISM_RUN_ALL_TESTS=1
        and run make; a zero exit status passes.'
      max_test_cycles: 2
      result_field: tests_outcomes[-1] (agrees with the published pass2 column)
