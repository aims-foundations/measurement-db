benchmark:
  name: Aider C++ prompting study
  description: 'Native Aider polyglot results from Parasoft''s MISRA prompting study: 5,356 attempts on 26 C++ tasks
    using seven model labels and sixteen named experimental arms. One GPT-5 arm changes its instruction text between
    runs, yielding seventeen recorded agent configurations.'
  testing_condition: Each observation is one complete Aider run on an exercise, including up to two test-feedback
    cycles. Preserve initial task files, full instructions, reference implementations, unit tests, complete chat
    histories and final generated files. Model labels, weak models, edit formats, harness version and prompting
    variants distinguish subjects. The official multi-language leaderboard contains aggregates and is not converted
    into synthetic item outcomes. No evaluations are rerun; exact API checkpoint revisions and unspecified sampling
    settings remain unknown.
  paper_url: null
  data_source_url: https://github.com/paraemsi/Reducing-violations-paper-data
  subject_type: agent
  item_type: task
  license: 'Study data and transcripts: CC-BY-NC-4.0, copyright 2025 Parasoft Corporation; Aider harness: Apache-2.0;
    Exercism task files retain their upstream licenses.'
  citation: 'Parasoft Corporation (2025). Reducing MISRA violations in LLM-generated code by 83%: an empirical study
    with static analysis verification. Supplementary data. https://doi.org/10.5281/zenodo.17617799'
  tags:
  - coding
  - cpp
  - code_editing
  - prompting
  - agent
  modality:
  - text
  domain:
  - software_engineering
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Recorded build or unit tests failed within the run budget
      '1': Recorded build and unit tests passed within the run budget
  categorical: true
  release_date: null
  multi_single_turn: multi_turn
