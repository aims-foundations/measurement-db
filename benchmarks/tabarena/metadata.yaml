benchmark:
  description: Individual test-row predictions from eight published TabArena methods, with derived classification
    correctness or regression squared error.
  testing_condition: 'Preserve the original c1 default bagged configuration, outer fold 0 and repeat 0. Each subject
    identifies a method fitted for a specific OpenML task, including released hyperparameters. These per-row grades
    are derived curation metrics, not TabArena leaderboard errors: classification uses argmax (binary probability
    ties select class 0); regression uses squared error against the released test target. Retain full original predictions,
    labels, row associations and published dataset-level metrics. Unobserved method/dataset combinations are absent;
    no training or model inference is run. The released float32 predictions need not exactly reproduce metrics computed
    before serialization. Recorded configuration dictionaries are preserved without inventing unrecorded historical
    library versions or seeds.'
  paper_url: https://openreview.net/forum?id=jZqCqpCLdU
  data_source_url: https://data.tabarena.ai/
  subject_type: model
  item_type: tabular_row
  license: The framework is Apache-2.0. Each OpenML dataset has its own license and attribution in its captured
    data description and item features. These include CC BY, CC BY-SA, CC BY-NC-SA, public-domain, MIT and DbCL
    notices; some source descriptions state only Public. No blanket framework license applies to the data.
  citation: "@inproceedings{erickson2025tabarena,\n  title={TabArena: A Living Benchmark for Machine Learning on\
    \ Tabular Data},\n  author={Erickson, Nick and Purucker, Lennart and Tschalzev, Andrej and Holzm{\\\"u}ller,\
    \ David and Mutalik Desai, Prateek and Salinas, David and Hutter, Frank},\n  booktitle={NeurIPS 2025 Datasets\
    \ and Benchmarks Track},\n  year={2025},\n}"
  tags:
  - tabular
  - living_benchmark
  - automl
  - leaderboard
  - per_row
  modality:
  - tabular
  domain:
  - general
  - ml_engineering
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2025-06
  release: public
  name: TabArena
  multi_single_turn: single_turn
  granularity: item
  version: tabarena-2025-06-12
build:
  contract_version: 2
  parameters:
    methods:
      CatBoost: CatBoost
      LightGBM: LightGBM
      XGBoost: XGBoost
      RandomForest: RandomForest
      KNeighbors: KNeighbors
      TabM_GPU: TabM_GPU
      RealMLP_GPU: RealMLP_GPU
      TabPFNv2_GPU: TabPFNv2_GPU
    paths:
      methods: methods
      inputs: openml
      fold: '0'
      repeat: '0'
      config_suffix: _c1_BAG_L1
    labels:
      subject_prefix: 'TabArena / '
      configuration_scope: One released default configuration fitted for one OpenML task and outer test split.
      binary: binary
      multiclass: multiclass
      regression: regression
