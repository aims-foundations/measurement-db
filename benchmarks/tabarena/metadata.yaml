grading:
  verifiers:
    classification:
      kind: derived_classification_correctness
      logic: For multiclass, select the smallest index attaining the maximum probability. For binary, select class
        1 only when its probability exceeds 0.5. Match the released encoded test label.
      source: Released pred-test.dat and label-test.csv.zip; this is a per-row curation metric, not official ROC-AUC
        or log loss.
      rule: Derived per-row correctness using the released class encoding and probability vector.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        meanings:
          '0': Incorrect predicted class.
          '1': Correct predicted class.
        direction: higher_is_better
    regression:
      kind: derived_squared_error
      logic: Square the difference between the released float32 prediction (promoted to float64) and the original
        released test target.
      source: Released pred-test.dat and label-test.csv.zip; individual squared errors correspond to the mean squared
        error underlying dataset RMSE.
      rule: Derived squared prediction error in the dataset target units squared; lower is better.
      response_scale:
        kind: interval
        min: 0
        max: null
        direction: lower_is_better
