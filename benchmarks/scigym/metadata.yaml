benchmark:
  description: Iterative scientific-discovery trajectories on 137 systems-biology tasks. Agents receive
    a partial SBML model, design simulated experiments, and submit a reconstructed model. The curated
    release includes six reaction-recovery metrics derived from final models and explicitly unavailable
    trajectory-error grades.
  testing_condition: 'The export has 2,466 rows but only 822 distinct complete records: six models on
    137 tasks, each copied three times without separate trial IDs. Preserve one observation per distinct
    trajectory and metric and retain every source-row position. The seven metric observations for a trajectory
    are dependent measurements, not seven agent runs. Initial user prompts and the recorded 20-action
    allowance come from the transcripts. System prompts, complete structured API requests and original
    numeric grading records are not exported; current harness defaults do not establish historical settings.
    Reaction scores describe the released final model under the native structural rule, without replaying
    simulations or their validity gates. Keep simulation trajectory error null; no failures or aggregate
    paper values are imputed.'
  paper_url: https://arxiv.org/abs/2507.02083
  data_source_url: https://huggingface.co/datasets/h4duan/scigym-eval
  subject_type: model
  item_type: task
  license: Not specified in captured upstream releases
  citation: "@inproceedings{duan2025scigym,\n  title={Measuring Scientific Capabilities of Language Models\
    \ with a Systems Biology Dry Lab},\n  author={Duan, Haonan and Lu, Stephen Zhewen and Harrigan, Caitlin\
    \ Fiona and Desai, Nishkrit and Lu, Jiarui and Koziarski, Micha{\\l} and Cotta, Leonardo and Maddison,\
    \ Chris J.},\n  booktitle={NeurIPS 2025 Datasets and Benchmarks Track},\n  year={2025},\n}"
  tags:
  - systems_biology
  - scientific_discovery
  - agent
  - sbml
  - dry_lab
  modality:
  - text
  domain:
  - science
  - reasoning
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: '2025-05-19'
  name: SciGym
  multi_single_turn: multi_turn
build:
  contract_version: 2
  parameters:
    layout:
      results: results.parquet
      tasks: tasks.parquet
    transcript:
      initial_prompt_end: Format your response according to the instructions in the system message.
      iteration_pattern: '## Max iterations\s+(\d+)'
    xml:
      reactions: ./{*}model/{*}listOfReactions/{*}reaction
      reactants: ./{*}listOfReactants/{*}speciesReference
      products: ./{*}listOfProducts/{*}speciesReference
      modifiers: ./{*}listOfModifiers/{*}modifierSpeciesReference
    metrics:
      rpm_precision: rms_with_modifiers_precision
      rpm_recall: rms_with_modifiers_recall
      rpm_f1: rms_with_modifiers_f1
      rp_precision: rms_without_modifiers_precision
      rp_recall: rms_without_modifiers_recall
      rp_f1: rms_without_modifiers_f1
      ste: simulation_trajectory_error
    conditions:
      with_modifiers: rpm
      without_modifiers: rp
