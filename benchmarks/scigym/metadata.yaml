grading:
  rule: Reaction scores are derived from the released final SBML and task references. Treat each reaction
    as sets of reactant and product species IDs, and optionally modifier IDs; duplicate reactions, stoichiometric
    multiplicity, reaction names, kinetic laws and reversibility are ignored by this structural metric.
    Exclude reactions already present in the partial model. Precision is correctly recovered missing reactions
    divided by added reactions; recall divides by missing reference reactions; F1 is their harmonic mean.
    Empty denominators yield zero as in the author checker. These metrics do not certify valid simulation
    behavior. Simulation trajectory error is unavailable because no original numeric result or complete
    reference/predicted simulation arrays are released.
  verifiers:
    reaction_recovery:
      kind: derived_deterministic_reaction_recovery
      source: https://github.com/h4duan/SciGym/blob/88a7b93609e35b6ecb4eb343d816d6ff09256c6a/scigym/eval/evaluator.py
      function: Evaluator.evaluate_exact_reaction_recovery
      signature_source: https://github.com/h4duan/SciGym/blob/88a7b93609e35b6ecb4eb343d816d6ff09256c6a/scigym/eval/utils.py
      signature_functions:
      - get_reaction_hash
      - extract_reaction_hashes
      definition_revision: 88a7b93609e35b6ecb4eb343d816d6ff09256c6a
      grade_origin: recomputed_from_released_final_model
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
    trajectory_error:
      kind: unavailable_simulation_result
      source: https://github.com/h4duan/SciGym/blob/88a7b93609e35b6ecb4eb343d816d6ff09256c6a/scigym/eval/evaluator.py
      function: Evaluator.evaluate_smape
      definition_revision: 88a7b93609e35b6ecb4eb343d816d6ff09256c6a
      grade_origin: not_released_not_rerun
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: lower_is_better
