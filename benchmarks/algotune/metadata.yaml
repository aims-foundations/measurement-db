benchmark:
  description: 'AlgoTune evaluates agents that optimize 154 numerical-programming tasks. This curation retains one
    published final speedup per task/model and the existing binary threshold: a finite final_speedup >= 1.0 is 1;
    a smaller finite speedup or the provider''s explicit N/A is 0.'
  testing_condition: The upstream harness checks individual outputs with task-specific is_solution implementations
    and reports mean_speedup from finite available speedups. The public summary does not include complete per-input
    validity counts. Retain the existing reported-speedup threshold without independently executing code or asserting
    that every test input passed. Preserve exact reported speedups, available conversations and final source files;
    do not infer the specific causes of N/A.
  paper_url: https://openreview.net/forum?id=dF1tD9hjvn
  data_source_url: https://github.com/oripress/AlgoTune
  subject_type: agent
  item_type: task
  license: MIT
  citation: "@inproceedings{press2025algotune,\n  title={AlgoTune: Can Language Models Speed Up General-Purpose\
    \ Numerical Programs?},\n  author={Press, Ori and Amos, Brandon and Zhao, Haoyu and Wu, Yikai and others},\n\
    \  booktitle={NeurIPS 2025 Datasets and Benchmarks Track},\n  year={2025},\n}"
  tags:
  - code
  - optimization
  - numerical
  - agent
  - runtime
  modality:
  - text
  domain:
  - software_engineering
  - reasoning
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': failure
      '1': success
  categorical: true
  release_date: 2025-07
  name: AlgoTune
  one_line_description: Evaluates coding agents on producing correct numerical programs that match or improve reference
    runtime.
  multi_single_turn: multi_turn
