grading:
  rule: Set response to 1 exactly when the provider reports a finite final_speedup >= 1.0; a smaller finite speedup
    or the explicit N/A result maps to 0. The upstream harness uses the task-specific is_solution check for measured
    outputs; complete per-input validity counts are not present in the public summary.
  verifiers:
    task:
      kind: published_correctness_and_runtime
      source: https://github.com/oripress/AlgoTune/tree/dff9914c10800c7a031c9e8c3d4d1c8cd1b38906
      method: AlgoTuneTasks/<task>/<task>.py:is_solution and AlgoTuner final held-out evaluation
      result_field: final_speedup
      unavailable_result: N/A
      logic: Finite reported speedup >= 1.0 is 1; a smaller finite speedup or N/A is 0. No code is executed during
        curation.
