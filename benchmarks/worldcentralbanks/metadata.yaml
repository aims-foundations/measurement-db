        {choices}

        2. Provide a concise explanation for your classification using the `justification` key. Limit it to one
        sentence.

        3. Your output must follow **exactly** this JSON:

        {{

        "label": "...",

        "justification": "..."

        }}


        ### Response:

        '
    banks:
      bank_negara_malaysia: Bank Negara Malaysia
