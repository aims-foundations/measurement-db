grading:
  rule: 'Per-row label correctness using the authors'' released clean.ipynb post-processing: for API outputs, remove
    fences, retain the first JSON block, normalize doubled and curly quotes, then use JSON, literal-dictionary or
    the original single-word label-regex fallback. FinMA uses the original JSON-or-plain-label parser and rejects
    categories absent from the run''s reference labels. Compare trimmed lowercase labels with the reference. Preserve
    the original fallback semantics, including its handling of multiword labels. Empty or explicitly errored requests
    remain ungraded (null); other unparseable completed answers are incorrect. Accuracy is derived per recorded
    attempt, not copied from a corpus-level classification report.'
  verifiers:
    native:
      kind: derived_released_label_correctness
      rule: 'Per-row label correctness using the authors'' released clean.ipynb post-processing: for API outputs,
        remove fences, retain the first JSON block, normalize doubled and curly quotes, then use JSON, literal-dictionary
        or the original single-word label-regex fallback. FinMA uses the original JSON-or-plain-label parser and
        rejects categories absent from the run''s reference labels. Compare trimmed lowercase labels with the reference.
        Preserve the original fallback semantics, including its handling of multiword labels. Empty or explicitly
        errored requests remain ungraded (null); other unparseable completed answers are incorrect. Accuracy is
        derived per recorded attempt, not copied from a corpus-level classification report.'
      source: https://github.com/gtfintechlab/WorldCentralBanks/blob/70a90d3c004a8fdb6d74df9e88455a42c0654022/src/llm_benchmarking/inference.py
      original_parser: clean.ipynb cell 0 parse_llm_responses and cell 3 safe_pred; only deterministic string parsing
        is reproduced.
      cleanup_source: https://github.com/gtfintechlab/WorldCentralBanks/blob/70a90d3c004a8fdb6d74df9e88455a42c0654022/llm_inference_outputs/llm_inference_output_no_guide/clean.ipynb
