benchmark:
  name: 'WorldCentralBanks: released LLM classifications'
  description: Released sentence-level predictions of central-bank monetary-policy stance, time orientation and
    certainty.
  testing_condition: Import the original 2,704 CSV exports (405,600 rows) from 25 central banks across three tasks,
    preserving the complete response text, export dates and split seeds. Reconstruct the original prompt strings
    and message roles from pinned author templates, annotation guides and few-shot examples; preserve their whitespace
    and Unicode. Gemini receives joined message content, as in the source client. Exact executed inference settings
    are not established by all saved configuration files; do not infer a missing configuration from a filename.
    No API, model inference, training or external grading runs during this build.
  paper_url: https://openreview.net/forum?id=cU5W9Z3r8p
  data_source_url: https://github.com/gtfintechlab/WorldCentralBanks
  subject_type: model
  item_type: sentence_classification
  license: CC-BY-NC-SA-4.0
  citation: 'Shah et al. (2025). Words That Unite The World: A Unified Framework for Deciphering Central Bank Communications.
    NeurIPS Datasets and Benchmarks.'
  tags:
  - central_banks
  - classification
  - finance
  modality:
  - text
  domain:
  - natural_language_processing
  - finance
  multi_single_turn: single_turn
  granularity: item
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': A completed prediction disagrees with the reference label.
      '1': The extracted prediction matches the reference label.
  categorical: true
  release_date: 2025-05
  release: public
build:
  contract_version: 2
  parameters:
    paths:
      outputs: llm_inference_outputs/**/*.csv
      output_pattern: llm_inference_outputs/llm_inference_output_(?P<regime>[^/]+)/(?P<bank>[^/]+)/(?P<task>stance|time|certain)_(?P<provider>[^/]+)/(?P<organization>[^/]+)/(?P<source_model>.+)_(?P<date>[0-9]{8})_(?P<seed>[0-9]+)\.csv
      guides: src/llm_benchmarking/annotation_guides/{bank}/{task}.tex
      examples: src/llm_benchmarking/few_shot_examples/{bank}/{task}/examples_{seed}.txt
    prompts:
