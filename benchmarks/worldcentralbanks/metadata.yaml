        \            \"label\": \"{label_format}\",\n            \"justification\": \"One-sentence explanation for\
        \ the assigned label\"\n            }}"
      guide_system: "You are given one sentence related to the {bank_name}'s monetary policy meeting. You are also\
        \ given an annotation guide for the feature: {feature}.\n            Strictly follow the guide; do not invent\
        \ new criteria or labels.\n\n            Your task is to classify whether it is {labels} and briefly justify\
