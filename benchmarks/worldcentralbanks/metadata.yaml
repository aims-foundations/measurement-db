        \ under the `label` key:\n        \"hawkish\", \"neutral\", \"dovish\", or \"irrelevant\".\n        \n \
        \       2. Provide a concise explanation for your classification using the `justification` key. Limit the\
        \ justification to one sentence.\n        \n        3. Your output must follow this structure:\n       \
        \ {{\n        \"label\": \"hawkish | dovish | neutral | irrelevant\",\n        \"justification\": \"One-sentence\
        \ explanation for the assigned label\"\n        }}"
      stance: "You are given a sentence related to the {bank_name}'s monetary policy meeting. Your task is to classify\
        \ its monetary policy stance and briefly justify your choice.\n    \n        Input:\n        - Sentence:\
        \ {sentence}\n        \n        Instructions:\n        1. Assign one of the following labels under the `label`\
