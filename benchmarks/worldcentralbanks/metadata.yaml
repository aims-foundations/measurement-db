      few_shot_user: "Input:\n\"\n                ### Few‑shot Examples\n{examples}\n\n\"\n                ### Sentence\n\
        {sentence}"
      finma: 'You are given a sentence related to the {bank}{apostrophe} monetary policy meeting. Your task is to
        classify its {task} and briefly justify your choice.


