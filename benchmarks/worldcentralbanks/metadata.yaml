      certain_prompt_with_guide_user: "Input:\n\n                ### Annotation Guide: {guide_text}\n\n\n      \
        \          ### Sentence: {sentence}\n                "
      few_shot_system: "You are given one sentence related to {bank_phrase}. You are also given a set of few-shot\
        \ examples for the feature: {feature}.\n            Follow these examples; do not invent new criteria or\
        \ labels.\n\n            Your task is to classify whether it is {labels} and briefly justify your choice.\n\
        \            \n            Instructions:\n            1. Assign one of the following labels under the `label`\
        \ key:\n            {labels}\n            \n            2. Provide a concise explanation for your classification\
