        \        \n        2. Provide a concise explanation for your classification using the `justification` key.\
        \ Limit the justification to one sentence.\n        \n        3. Your output must follow this structure:\n\
        \        {{\n        \"label\": \"forward looking | not forward looking\",\n        \"justification\": \"\
        One-sentence explanation for the assigned label\"\n        }}"
      time: "You are given a sentence related to the {bank_name}'s monetary policy meeting. Your task is to classify\
