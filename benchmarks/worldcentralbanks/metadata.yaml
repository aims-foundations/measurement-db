        \ one sentence.\n        \n        3. Your output must follow this structure:\n        {{\n        \"label\"\
        : \"hawkish | dovish | neutral | irrelevant\",\n        \"justification\": \"One-sentence explanation for\
        \ the assigned label\"\n        }}"
      time_philippines: "You are given a sentence related to the {bank_name}' monetary policy meeting. Your task\
