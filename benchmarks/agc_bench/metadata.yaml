benchmark:
  name: AGC-Bench
  description: Released model attempts and individual creativity judgments across the AGC-Bench component datasets.
  testing_condition: Import the pinned generation corpus, retaining native scores, missing grades, complete
    outputs and individual panel ratings. Join the fixed prompt banks; reconstruct IRFL's multimodal stimulus
    from its pinned task bank and scenario, verified against every recorded IRFL grade. Native canonical statistics
    and panel judgments define separate grading protocols. Aggregate dataset_z, calibrated JRT targets and
    distilled AGC-Judge predictions remain trace metadata. Known invalid ratings and non-grade statistics are
    flagged in traces and have null responses. Exact API configurations and native judge identities are not
    fully recorded; source run labels are preserved without inventing settings.
  paper_url: https://arxiv.org/abs/2607.01152
  data_source_url: https://huggingface.co/datasets/agcbench-2026/AGC-Bench
  subject_type: model
  item_type: task
  license: CC-BY-4.0 (AGC-Bench release); component input licenses remain applicable
  tags:
  - creativity
  - meta-benchmark
  - helm
  modality:
  - text
  - image
  domain:
  - reasoning
  - nlp_task
  multi_single_turn: single_turn
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2026-07
build:
  contract_version: 2
  parameters:
    layout:
      release: source_review/30918045d5c1cf318e698c73469400de2251b9e6
      analobench: references/analobench/58c09414e35f38dd010e7cc87d3e2a5d24f151cc
      fig_qa: references/fig_qa/b29ec2faf6ef73d634db9757f8741dee68f6c874
      humor_transfer: references/humor_transfer/643ceefc17441e56cff66f57c03b13615545d42b
      nyt_connections: references/nyt_connections/a10f47fd3ed3dd3db04f760373941d06fcd42ca0
      irfl: references/irfl/b94fb4fe1fb52e524dba595d00add901671a2251
      munch: references/munch/5b78a540705661f49fda693e504250d4a1fc4516
      pun_eval: references/pun_eval/932693e23269269f323f9d385596ae1e54f939bc
      chinese_homophonic_puns: references/chinese_homophonic_puns/432a8f0d141f02aa9182ef3aeea441fcd0305533
      lcc_metaphor: references/lcc_metaphor/48b0f7adb97dc6c9e4e8bcc02bd4b83d4b6b2219
      slang_generation: references/slang_generation/33ce86f469655dd48f781fc1bba2593033798583
      ttcw: references/ttcw/3d029879df6878f611363db88cc02d465699bc51
      arn: references/arn/dbc75b190f775e4819465582f755e0683051a0a19c13b2eee8b3e4e48ee7680e/dataset.xlsx
      moh_x: references/moh_x/b5aca53416deeeec5f137559cdb2ffa3d7d49da440b50edb3f87d10411047f4e/moh_x.zip
    templates:
      moh_x: 'Is the word "{verb}" used metaphorically in the following sentence?


        Sentence: {sentence}


        Answer (Yes or No):'
      munch: 'Which of the given options can replace the highlighted word in the given sentence without altering
        the sentence''s meaning?

        Sentence: {sentence}

        Option A: {a}

        Option B: {b}

        Option C: Both Option A and Option B

        Option D: Neither Option A nor Option B

        Correct answer: Option'
      nyt_connections: 'Find groups of four items that share something in common. Output them in the following
        format: four total lines. On each line, there should be four comma-separated items. No additional text
        (like group titles or descriptions) should be in the output. Also, there should not be anything in
        your output before or after the solution.


        Words: {words}


        Answer:'
      chinese_homophonic_puns: '你现在的任务是从下面的笑话中找出其中幽默来源的那一个词语。当你无法找到时请输出未知，否则只输出该词语，不要有其他内容。


        笑话：{text}

        答案：'
      lcc_metaphor: 'Is the word "{word}" used metaphorically in the following sentence?


        Sentence: {sentence}


        Answer (Yes or No):'
      analobench: "Which of the following is the most analogous story to the target story?\n\nNote: Only generate\
        \ the index without any additional text. \n\nTarget Story:\n{sentence}\n\nOptions:\n{options}\n\nAnswer:"
      fig_qa: '{startphrase}


        Which interpretation is correct?

        A. {ending1}

        B. {ending2}

        Answer:'
      irfl: 'Choose the image that best visualizes the meaning of the figurative expression: "{phrase}"


        Definition: {definition}


        Select exactly one option and answer with a single letter: A, B, C, or D.


        '
    prefixes:
      moh_x: 'Respond with only one word: Yes or No.

        '
      munch: 'Choose the single best answer. Respond with only one letter: A, B, C, or D.

        '
    panel_raters:
      gemini: google/gemini-3-flash-preview
      grok: x-ai/grok-4.1-fast
      gpt41mini: openai/gpt-4.1-mini
    subject_features:
      harness: AGC-Bench/HELM
grading:
  rule: Preserve the selected native measurement and its declared interpretation. A missing or invalid grade
    never becomes a failure or an aggregate score.
  verifiers:
    canonical_analobench:
      metric: accuracy
      rule: Parse the first A-D option with the upstream regex. Give 1 for the reference option, 0 for a different
        option, and 0.25 when no option is parsed.
      response_scale:
        kind: discrete
        values:
        - 0
        - 0.25
        - 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/analobench_run_specs.py
        metric_classes:
        - metrics.analobench_t1_metric.AnaloBenchT1Metric
        imported_field: canonical_score
        canonical_metric: accuracy
      grade_policy: validate
    canonical_arastories:
      metric: fluency
      rule: Judge smoothness and naturalness of the Arabic story, including grammar, vocabulary and sentence
        structure, on the declared 1-5 fluency scale.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/arastories_run_specs.py
        metric_classes:
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        imported_field: canonical_score
        canonical_metric: fluency
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_arena_hard_creative:
      metric: arena_hard_instance_score
      rule: Average the candidate's parsed pairwise battle scores against the released baseline and multiply
        by 100; wins, ties and losses contribute 1, 0.5 and 0 before averaging.
      response_scale:
        kind: interval
        min: 0
        max: 100
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/arena_hard_creative_run_specs.py
        metric_classes:
        - metrics.arena_hard_pairwise_metric.ArenaHardPairwiseMetric
        imported_field: canonical_score
        canonical_metric: arena_hard_instance_score
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_arn:
      metric: arn_accuracy
      rule: Extract the selected narrative option and compare it with the released correct_answer (1 or 2).
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/arn_run_specs.py
        metric_classes:
        - metrics.arn_metric.ARNMetric
        imported_field: canonical_score
        canonical_metric: arn_accuracy
      grade_policy: validate
    canonical_brainteaser:
      metric: brainteaser_all_overall_accuracy
      rule: The selected statistic is overall BrainTeaser accuracy. Its corpus-level value is not substituted
        for missing per-instance grades.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/brainteaser_run_specs.py
        metric_classes:
        - helm.benchmark.metrics.basic_metrics.BasicGenerationMetric
        - metrics.brainteaser_metric.BrainteaserMetric
        imported_field: canonical_score
        canonical_metric: brainteaser_all_overall_accuracy
      grade_policy: validate
    canonical_c3_crosstalk:
      metric: bleu_2
      rule: Use the selected BLEU-2 statistic against the released reference crosstalk. Missing per-instance
        scores remain null.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/c3_crosstalk_run_specs.py
        metric_classes:
        - metrics.c3_crosstalk_metric.C3CrosstalkMetric
        imported_field: canonical_score
        canonical_metric: bleu_2
      grade_policy: validate
    canonical_chinese_homophonic_puns:
      metric: exact_match_accuracy
      rule: Extract the word responsible for the Chinese homophonic joke and apply the released exact-match
        parser against punchline.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/chinese_homophonic_puns_run_specs.py
        metric_classes:
        - metrics.chinese_homophonic_puns_metric.ChineseHomophonicPunsMetric
        imported_field: canonical_score
        canonical_metric: exact_match_accuracy
      grade_policy: validate
    canonical_conceptual_design:
      metric: conceptual_design_novelty
      rule: Judge novelty of the generated design under the source's 0-2 rubric. The release's selected canonical
        statistic is absent at the item level; independent panel judgments are retained separately.
      response_scale:
        kind: interval
        min: 0
        max: 2
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/conceptual_design_run_specs.py
        metric_classes:
        - metrics.conceptual_design_metric.ConceptualDesignMetric
        imported_field: canonical_score
        canonical_metric: conceptual_design_novelty
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_cpers:
      metric: cpers_elaboration
      rule: Use the judge's average of the three 1-5 elaboration questions about vocabulary, imagery and emotion
        in the generated Persian sentence.
      response_scale:
        kind: interval
        min: 1
        max: 5
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/cpers_run_specs.py
        metric_classes:
        - metrics.cpers_metric.CPersMetric
        imported_field: canonical_score
        canonical_metric: cpers_elaboration
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_creatset:
      metric: creatset_pairwise_loss_rate
      rule: Record candidate_loss=1 when the pairwise judge's verdict is 2, otherwise 0. Zero also includes
        an unparsed verdict and must not be interpreted as an assured win.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: lower_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/creatset_run_specs.py
        metric_classes:
        - metrics.creatset_pairwise_metric.CreatSetPairwiseMetric
        imported_field: canonical_score
        canonical_metric: creatset_pairwise_loss_rate
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_crowd_vote:
      metric: marketing_creativity_judge_originality
      rule: Judge originality of the generated marketing response using the declared 1-5 rubric.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/crowd_vote_run_specs.py
        metric_classes:
        - metrics.crowd_vote_metric.CrowdVoteMetric
        imported_field: canonical_score
        canonical_metric: marketing_creativity_judge_originality
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_cue_word_story:
      metric: llm_judge_effectiveness
      rule: Judge effectiveness of the story generated from the supplied cue words using the declared 1-5 rubric.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/cue_word_story_run_specs.py
        metric_classes:
        - helm.benchmark.metrics.basic_metrics.BasicGenerationMetric
        - metrics.cue_word_story_metric.CueWordStoryMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        imported_field: canonical_score
        canonical_metric: llm_judge_effectiveness
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_data_narrative:
      metric: bert_score
      rule: Use the released BERTScore comparison between the generated narrative and its reference. Keep its
        native numeric scale without imposing a probability range.
      response_scale:
        kind: interval
        min: null
        max: null
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/data_narrative_run_specs.py
        metric_classes:
        - helm.benchmark.metrics.basic_metrics.BasicGenerationMetric
        - metrics.bert_score_metric.BertScoreMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        imported_field: canonical_score
        canonical_metric: bert_score
      grade_policy: validate
    canonical_eqbench_creative_writing_v3:
      metric: creative_score_0_20
      rule: Use the EQBench creative-writing annotator's creative_score_0_20, preserving its 0-20 scale and
        fractional rubric aggregation.
      response_scale:
        kind: interval
        min: 0
        max: 20
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/eqbench_creative_writing_v3_run_specs.py
        metric_classes:
        - metrics.eqbench_creative_writing_v3_metric.EQBenchCreativeWritingV3Metric
        imported_field: canonical_score
        canonical_metric: creative_score_0_20
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_fann_or_flop:
      metric: overall_score
      rule: Use the released annotator's overall story score on its 0-5 scale, including the upstream zero
        fallback.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/fann_or_flop_run_specs.py
        metric_classes:
        - helm.benchmark.metrics.basic_metrics.BasicGenerationMetric
        - metrics.fann_or_flop_metric.FannOrFlopMetric
        imported_field: canonical_score
        canonical_metric: overall_score
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_fig_qa:
      metric: exact_match
      rule: Compare the selected A/B interpretation with the reference label using HELM's exact_match statistic;
        retain the full few-shot prompt.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/fig_qa_run_specs.py
        metric_classes:
        - helm.benchmark.metrics.basic_metrics.BasicGenerationMetric
        imported_field: canonical_score
        canonical_metric: exact_match
      grade_policy: validate
    canonical_future_ideas:
      metric: llm_judge_novelty
      rule: Judge novelty of the generated future scientific or technological idea on the declared 1-5 rubric.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
      kind: judge
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/future_ideas_run_specs.py
        metric_classes:
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        - llm_judge.generic_llm_judge_metric.GenericLLMJudgeMetric
        imported_field: canonical_score
        canonical_metric: llm_judge_novelty
        judge_identity: Not recorded for this native statistic; run-spec defaults can be overridden.
      grade_policy: flag_invalid_rating
    canonical_futuregen:
      metric: rouge_l
      rule: Use reference-overlap ROUGE-L on the generated future-news text.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/futuregen_run_specs.py
        metric_classes:
        - helm.benchmark.metrics.basic_metrics.BasicGenerationMetric
        - metrics.bert_score_metric.BertScoreMetric
        - metrics.futuregen_similarity_metric.FutureGenSimilarityMetric
        imported_field: canonical_score
        canonical_metric: rouge_l
      grade_policy: validate
    canonical_grapheval_ai_researcher:
      metric: f1_macro
      rule: Use GraphEval macro F1 for research decisions. No corpus-level value is assigned to an individual
        ungraded attempt.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/grapheval_ai_researcher_run_specs.py
        metric_classes:
        - metrics.grapheval_decision_metric.GraphEvalDecisionMetric
        imported_field: canonical_score
        canonical_metric: f1_macro
      grade_policy: validate
    canonical_grapheval_iclr:
      metric: recall_macro
      rule: Use GraphEval macro recall for ICLR decisions. No corpus-level value is assigned to an individual
        ungraded attempt.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/grapheval_iclr_run_specs.py
        metric_classes:
        - metrics.grapheval_decision_metric.GraphEvalDecisionMetric
        imported_field: canonical_score
        canonical_metric: recall_macro
      grade_policy: validate
    canonical_grapheval_review_advisor:
      metric: recall_macro
      rule: Use GraphEval macro recall for review-advisor decisions. No corpus-level value is assigned to an
        individual ungraded attempt.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/grapheval_review_advisor_run_specs.py
        metric_classes:
        - metrics.grapheval_decision_metric.GraphEvalDecisionMetric
        imported_field: canonical_score
        canonical_metric: recall_macro
      grade_policy: validate
    canonical_historical_analogy:
      metric: historical_analogy_pass_at_1
      rule: Use the historical-analogy pass-at-one implementation; missing per-instance values remain null.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/historical_analogy_run_specs.py
        metric_classes:
        - metrics.historical_analogy_metric.HistoricalAnalogyMetric
        imported_field: canonical_score
        canonical_metric: historical_analogy_pass_at_1
      grade_policy: validate
    canonical_humor_transfer:
      metric: accuracy
      rule: Parse the model's funny/not-funny judgment and compare it with the released sarcasm label; preserve
        the source's humor-proxy interpretation.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/humor_transfer_run_specs.py
        metric_classes:
        - metrics.humor_transfer_metric.HumorTransferMetric
        imported_field: canonical_score
        canonical_metric: accuracy
      grade_policy: validate
    canonical_hypobench:
      metric: hypobench_ind_parsed_label_rate
      rule: Use the fraction of in-distribution inference labels successfully parsed for the generated hypotheses.
        This statistic measures parse coverage, not classification accuracy.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      kind: exact_matcher
      implementation:
        source: https://huggingface.co/datasets/agcbench-2026/AGC-Bench/blob/30918045d5c1cf318e698c73469400de2251b9e6/run_specs/hypobench_run_specs.py
        metric_classes:
        - metrics.hypobench_inference_metric.HypoBenchInferenceMetric
        imported_field: canonical_score
        canonical_metric: hypobench_ind_parsed_label_rate
      grade_policy: validate
    canonical_hypogen:
      metric: hypogen_proxy_novelty
      rule: Judge the generated hypothesis using the 1-5 proxy-novelty rubric.
      response_scale:
        kind: discrete
        values:
        - 1
        - 2
        - 3
        - 4
        - 5
        direction: higher_is_better
