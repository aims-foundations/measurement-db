grading:
  rule: Compare the released parsed prediction with the A–E reference by exact string equality, without reparsing
    the response text. A match is 1; a blank or other nonmatching prediction is 0. FAILED is excluded by the released
    scorer and remains ungraded (null).
  verifiers:
    recorded_option_match:
      kind: reconstructed_released_exact_match
      source: https://github.com/daekeun-ml/evaluate-llm-on-korean-dataset/blob/b64e4fd6dda9785049fd3968c1d3b35321d38743/util/evaluate_helper.py
      function: evaluate
      prediction_field: pred
      reference_field: answer
      excluded_marker: FAILED
      assignment: Explicit source subset/index ID, verified against the unchanged original test-bank reference.
      execution: No model inference or new parsing. Use the original saved prediction and preserve the full CSV
        record.
