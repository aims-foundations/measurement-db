benchmark:
  name: KorMedMCQA
  description: Published Korean healthcare licensing-exam predictions from the independently maintained Korean LLM
    Benchmark Suite.
  testing_condition: Join the source subset/index identifier to the unchanged original test bank and verify every
    reference answer. Retain every exported record, including repeated IDs, short debug exports and incomplete model
    files. The source writer emits trial=0 for every record and appends batches. Our positive trial numbers distinguish
    source-record occurrences within a model, canonical question and condition; they do not establish independent
    experimental runs. Exact repeated records are retained because the export does not distinguish a repeated generation
    from duplicated logging. Original IDs, source trial values, positions and full recorded text are preserved in
    traces. Only source export labels identify models/configurations; exact API identifiers, inference settings
    and surrounding prompts were not recorded. Item content contains the question and all five choices. Reference
    answers and source rationale fields are excluded from predictive inputs. Grades are reconstructed using the
    captured original exact matcher, not a new model or parser.
  paper_url: https://arxiv.org/abs/2403.01469
  data_source_url: https://github.com/daekeun-ml/evaluate-llm-on-korean-dataset
  subject_type: model
  item_type: task
  license: 'KorMedMCQA task bank: CC-BY-NC-2.0. Independent result repository: MIT.'
  citation: 'Kweon et al. KorMedMCQA: Multi-Choice Question Answering Benchmark for Korean Healthcare Professional
    Licensing Examinations (2024). Evaluation records: daekeun-ml, Korean LLM Benchmark Suite.'
  tags:
  - multilingual
  - multiple_choice
  - korean
  modality:
  - text
  domain:
  - medicine
  response_type: binary
  categorical: true
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Recorded parsed prediction does not match the reference
      '1': Recorded parsed prediction matches the reference
  release_date: 2024-03
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      tasks: tasks/*/test-*.parquet
      results: results/*.csv
    answer_labels:
      '1': A
      '2': B
      '3': C
      '4': D
      '5': E
    labels:
      ungraded_marker: FAILED
      subject_prefix: 'KorMedMCQA / '
      input_scope: Original question and choices. Historical surrounding prompt and demonstrations were not recorded.
    subject_features:
      harness: Korean LLM Benchmark Suite
      historical_configuration: not_recorded
      model_identifier_status: source_export_label
