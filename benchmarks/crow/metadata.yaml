      source: https://github.com/NayMyatMin/BackdoorLLM/blob/71edc6ac79df4d02aab9073f824372ba5aa481cf/attack/DPA/eval_script_llama2-7b/backdoor_evaluate_codeinjection_vpi-ci.py
