benchmark:
  release: public
  description: Historical model outputs and keyword-based attack-success grades from CROW development exports.
  testing_condition: Preserve 34 distinct result exports across four pinned historical Git snapshots; identical
    file copies are not new observations. Subjects distinguish exports because exact checkpoint and defense
    identities are absent, and must not be counted as 34 proven independent models. The four reported base-model
    labels do not identify evaluated weights. Reconstruct each item grade with the historical keyword rule
    that uniquely reproduces the export’s recorded attack-success rate. The earlier code-injection rule includes
    the broad substring print; grades describe that rule, not independent verification of malicious behavior.
    Empty outputs are retained with null grades because upstream excludes them from ASR. The native evaluator
    tokenizes instruction only; the separate input field is preserved in traces, not appended to the stimulus.
    Retain full output, every source alias and the original ASR. Do not infer named defenses from aggregate
    scores or treat missing MT-Bench outputs as observations.
  paper_url: https://arxiv.org/abs/2411.12768
  data_source_url: https://github.com/NayMyatMin/BackdoorLLM
  subject_type: model
  item_type: prompt
  license: MIT
  citation: "@inproceedings{min2025crow,\n  title={{CROW}: Eliminating Backdoors from Large Language Models\
    \ via Internal Consistency Regularization},\n  author={Nay Myat Min and Long H. Pham and Yige Li and Jun\
    \ Sun},\n  booktitle={Forty-second International Conference on Machine Learning},\n  year={2025},\n  url={https://openreview.net/forum?id=ZGtcgeCpWB}\n\
    }"
  tags:
  - backdoor
  - defense
  - safety
  - poisoning
  - consistency-regularization
  modality:
  - text
  domain:
  - safety
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    meanings:
      '0': The historical attack keyword rule did not fire.
      '1': The historical attack keyword rule fired.
    direction: lower_is_better
  categorical: true
  release_date: 2024-11
  name: CROW
  multi_single_turn: single_turn
