grading:
  verifiers:
    cfg:
      kind: reported_category
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/data/Task1_CFG_Construction/count_numbers.py
      rule: Preserve the source category. Overall Completed requires node- and edge-count differences below 2. Otherwise
        node difference below 2 permits Loop Completed if loop-edge counts match, then Branch Completed if branch-edge
        counts match; otherwise Wrong. These categories do not assert graph isomorphism. Codes are unordered identifiers.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        - 2
        - 3
        direction: unordered
        meanings:
          '0': Wrong
          '1': Branch Completed
          '2': Loop Completed
          '3': Overall Completed
    decompile:
      kind: reported_category
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/data/Task2_IR_Decompilation/decompilationResult_O3.csv
      rule: Preserve the published decompilation, compilation, execution or pass status. The captured testAndRun.py
        compiles and executes generated C++ with ten-second limits; historical compiler and environment versions
        are not recorded. Do not execute or regrade the generated code.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        - 2
        - 3
        direction: higher_is_better
        meanings:
          '0': Decompilation Failed
          '1': Compilation Failed
          '2': Execution Failed
          '3': Passed
    execution:
      kind: reported_category
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/results/Task4_Execution_reasoning/GPT4/analyzeAssertionResults.py
      rule: 'Preserve the published program summary: all extracted final_result values pass gives pass, all fail
        gives fail, and every other combination gives partial pass. This summarizes parsed model answers, not a
        separately executed correctness check. Empty assertion-result tables are excluded rather than inheriting
        Python all([])''s vacuous pass. The number of processed assertions varies.'
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        - 2
        direction: higher_is_better
        meanings:
          '0': fail
          '1': partial pass
          '2': pass
    BLEU_Score:
      kind: reported_metric
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/data/Task3_IR_Summarization/Codesummary_scores.csv
      rule: Preserve the published BLEU_Score for the released model summary against Golden. Exact scorer/tokenizer/embedding-model
        versions are not established; do not recompute or threshold this metric.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
    ROUGE-L_Score:
      kind: reported_metric
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/data/Task3_IR_Summarization/Codesummary_scores.csv
      rule: Preserve the published ROUGE-L_Score for the released model summary against Golden. Exact scorer/tokenizer/embedding-model
        versions are not established; do not recompute or threshold this metric.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
    METEOR_Score:
      kind: reported_metric
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/data/Task3_IR_Summarization/Codesummary_scores.csv
      rule: Preserve the published METEOR_Score for the released model summary against Golden. Exact scorer/tokenizer/embedding-model
        versions are not established; do not recompute or threshold this metric.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
    Similarity:
      kind: reported_metric
      source: https://github.com/hjiang13/LLM4IR/blob/af9d4e2a781b3910637903862f5d8ee343995b86/data/Task3_IR_Summarization/CodeSummary_embeddings_and_similarity.csv
      rule: Preserve the published Similarity for the released model summary against Golden. Exact scorer/tokenizer/embedding-model
        versions are not established; do not recompute or threshold this metric.
      response_scale:
        kind: interval
        min: -1
        max: 1
        direction: higher_is_better
