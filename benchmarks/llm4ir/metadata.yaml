benchmark:
  description: Published program-level assessments of LLVM control-flow reconstruction, decompilation, summarization
    and execution reasoning.
  testing_condition: Preserve primary author assessment tables for all four tasks, including GPT4o decompilation
    at O0–O3, four summary metrics and three DeepSeek execution runs in both IR and source-code conditions. A response
    is a published program/metric assessment, not necessarily one model call; metrics and conditions must not be
    pooled as independent generations. Literal labels remain task-specific because exact historical endpoints and
    settings are not established. SC means source-code input, not self-consistency. Inputs contain the actual released
    LLVM text or source code and assertion definitions, without invented historical prompt wrappers. Execution summaries
    aggregate the assertions the source processed, which may be fewer than the released assertions. Twelve summaries
    whose native output tables are empty are excluded, despite upstream's vacuous pass label. Other published labels
    and numeric metrics remain unchanged; the migration does not execute model code or regrade outputs. Auxiliary
    graph-comparison experiments, unassociated outputs and aggregate plots remain in raw.
  paper_url: https://arxiv.org/abs/2502.06854
  data_source_url: https://github.com/hjiang13/LLM4IR
  subject_type: model
  item_type: question
  license: The upstream README states MIT, but the captured tree contains no LICENSE file. This statement does not
    establish the license of every incorporated HumanEval-X artifact.
  citation: "@inproceedings{jiang2025llm4ir,\n  title={Can Large Language Models Understand Intermediate Representations\
    \ in Compilers?},\n  author={Jiang, Hailong and Zhu, Jianfeng and Wan, Yao and Fang, Bo and Zhang, Hongyu and\
    \ Jin, Ruoming and Guan, Qiang},\n  booktitle={International Conference on Machine Learning (ICML)},\n  year={2025}\n\
    }"
  tags:
  - compilers
  - intermediate-representation
  - llvm
  - code-reasoning
  - llm-eval
  modality:
  - text
  domain:
  - software_engineering
  - reasoning
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2025-02
  release: public
  name: LLM4IR (LaMIR)
  granularity: item
  multi_single_turn: single_turn
