benchmark:
  name: SWE-Together
  description: Released per-replicate judge scores on 109 interactive repository-level coding tasks.
  testing_condition: Current original website snapshot, captured 2026-09-30. Each non-null models[model].trials
    entry is one published assessment; response is 1 when its judge score is at least 0.85. The 17 null replicate
    slots and the one absent model/task cell do not establish recorded attempts and are not fabricated as failures.
    The snapshot includes source-reported sandbox reruns and rejudging; it supersedes the historical cache rather
    than adding independent trials to it. Exact historical model snapshots, inference settings, judge identities
    and trial execution IDs are unavailable. The task bank specifies the initial instruction and subsequent user
    intents, grading goals and repository context. Complete agent conversations are not released with an authoritative
    link to these scalar scores.
  paper_url: https://arxiv.org/abs/2606.29957
  data_source_url: https://togetherbench.com/metrics.js
  subject_type: model
  item_type: task
  license: Apache-2.0; original repository license and dataset card retained.
  citation: 'Wu et al. SWE-Together: Interactive Coding-Agent Evaluation. arXiv:2606.29957, 2026.'
  tags:
  - coding-agent
  - multi-turn
  - swe
  - interactive
  modality:
  - text
  domain:
  - software_engineering
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': published judge score below 0.85
      '1': published judge score at least 0.85
  categorical: true
  release_date: 2026-06
  release: withheld
  release_reason: >-
    Source reproducibility hold, reviewed 2026-10-04: https://togetherbench.com/metrics.js
    now serves changed scores rather than the pinned 2026-09-30 snapshot with SHA-256
    47c1db5553bd85b2404c3d1ba0b95ecb85a87f1d02feffe39661701095b67fb5. No immutable
    author-hosted or author-endorsed copy of that snapshot has been verified. Restore public
    release after recovering the pinned author snapshot and passing strict table reproduction,
    or after a separately reviewed version update backed by immutable author inputs.
  granularity: item
  multi_single_turn: multi_turn
  version: metrics-sha256:47c1db5553bd85b2404c3d1ba0b95ecb85a87f1d02feffe39661701095b67fb5
build:
  contract_version: 2
  parameters:
    paths:
      metrics: website/metrics.js
      tasks: task_bank/swe_together.jsonl
      website_tasks: website/tasks.js
    task_aliases:
      pi-mono-extensions-event-refacto: pi-mono-extensions-event-refactor
      pi-mono-tool-execution-write-err: pi-mono-tool-execution-write-error
      sd-scripts-multiresolution-compa: sd-scripts-multiresolution-compat
    labels:
      snapshot: metrics-sha256:47c1db5553bd85b2404c3d1ba0b95ecb85a87f1d02feffe39661701095b67fb5
      subject_prefix: 'SWE-Together / '
      condition: opencode;published_replicate_slot;historical_request_settings_unavailable
grading:
  rule: 'Apply the published success threshold to each released replicate score: judge score >= 0.85. Preserve the
    exact original fractional score in the assessment trace. The agentic judge assesses completeness against task
    goals; this builder imports its scores and does not execute or reconstruct a judge.'
  verifiers:
    published_judge:
      kind: published_agentic_judge_score
      source: https://github.com/Togetherbench/SWE-Together/blob/891d19eb4b3a64a47c3d49bbd066a311e0133254/eval/correctness/run_batch.py
      outcome_source: https://togetherbench.com/metrics.js
      field: models[model].trials[replicate_index]
      historical_judge_identity: not_recorded
      pass_threshold: 0.85
      executed_by_builder: false
