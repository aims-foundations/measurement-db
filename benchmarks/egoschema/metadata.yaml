grading:
  rule: "Compare the released final integer pred with truth (both zero-indexed A\u2013E); an unparsed -1 is incorrect.\
    \ Preserve the original binary scorer used by the archived results, including any already-applied fallback."
  verifiers:
    choice:
      kind: released_choice_equality
      source: https://github.com/CeeZh/LLoVi/blob/32ea8a5ee2f1519de123a393f0b0186ce0368d17/eval.py
      function: eval_qa_egoschema
      later_change: The current scorer adds 0.2 for unparsed predictions; the archived summaries and original scorer
        do not.
