    files:
    - match: (?!(?!(?:benchmarks|mlip_arena/tasks)/combustion/H256O128\.extxyz$|benchmarks/stability/stability-and-speed-n[vp]t-loglog\.pdf$)(?:benchmarks|mlip_arena/tasks)/.+\.(?:db|pkl|parquet|json|extxyz|pdf)$)(?!\.devcontainer/devcontainer\.json$|docs/mint\.json$).+
      path: github/{path}
  - name: github_data
    git_lfs: true
    url: https://github.com/atomind-ai/mlip-arena
    revision: 6239aea513c494aeab237fc96ef133b9b1cc204f
    files:
    - match: (?!(?:benchmarks|mlip_arena/tasks)/combustion/H256O128\.extxyz$|benchmarks/stability/stability-and-speed-n[vp]t-loglog\.pdf$)(?:benchmarks|mlip_arena/tasks)/.+\.(?:db|pkl|parquet|json|extxyz|pdf)
