grading:
  rule: 'Use the explicit passed field in the published result: true is success, false is failure, and
    Evaluation failed is an unavailable grade. The released task-specific evaluate.py defines the simulation
    checks; no simulation or new model call is performed by this import.'
  verifiers:
    native_pass:
      kind: released_simulation_result
      field: passed
      source_template: https://github.com/AGI4Engineering/EngDesign/blob/c8ec338cc5f846d792d93728b00c9448111139e5/tasks/{task}/evaluate.py
      definition_revision: c8ec338cc5f846d792d93728b00c9448111139e5
      historical_run_revision: null
      historical_run_revision_note: The archived task definition accompanies the released results; a per-run
        code revision was not recorded.
