benchmark:
  name: BIRD (text-to-SQL)
  description: Published Petavue evaluations of text-to-SQL models on a 360-question BIRD development subset.
  testing_condition: Import all 43,200 released inference rows. Keep the 24 native model/provider combinations and
    five instruction-count conditions distinct as 120 subject configurations; all use zero-shot prompts. Items retain
    the full question, database schema and hint from the released input bank, with reference SQL separate from model
    input. A single documented Mac-Roman/UTF-8 question alias links 120 workbook rows to their input-bank record;
    original workbook strings remain in traces. Three workbook difficulty labels disagree with the input bank and
    are retained in traces without changing grades. The pinned harness documents prompt construction and grading,
    but exact historical requests, resolved model versions, sampling settings and database snapshots are unavailable.
    Generation fields may include prompt echoes or provider-object representations; preserve them in full. This
    is a third-party BIRD subset and grader, not the official full-benchmark leaderboard. No inference, SQL execution
    or new judging.
  paper_url: https://arxiv.org/abs/2305.03111
  data_source_url: https://github.com/petavue/NL2SQL-Benchmark/tree/0637e2593739f82961d38a14d0d80df2b20e3060
  subject_type: model
  item_type: text_question
  license: MIT for the Petavue repository; its task inputs derive from BIRD.
  citation: 'Li et al. (2023). Can LLM Already Serve as A Database Interface? A BIg Bench for Large-Scale Database
    Grounded Text-to-SQLs. NeurIPS Datasets and Benchmarks. Results: Petavue NL2SQL-Benchmark (2024).'
  tags:
  - text-to-sql
  - databases
  - third_party_results
  modality:
  - text
  domain:
  - software_engineering
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    meanings:
      '0': The published Petavue execution verdict is no match.
      '1': The published Petavue execution verdict is a match.
    direction: higher_is_better
  release_date: 2023-05
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      results: inference_level_dataset.xlsx
      tasks: task_inputs.csv
    workbook:
      sheet_id: '1'
      sheet_name: Each_inference_data(43201)
    columns:
      'Unnamed: 0': source_index
      Given Question: recorded_question
      Given Query: reference_answer
      Question Hardness: recorded_difficulty
      Quest DbID: database_id
      Environement: environment
      Model: model
      Shot Size: shot_size
      Instruction Size: instruction_size
      Is match: grade
    question_aliases:
      ? Which of the three segments‚ÄîSME, LAM and KAM‚Äîhas the biggest and lowest percentage increases in consumption
        paid in EUR between 2012 and 2013?
      : Which of the three segments—SME, LAM and KAM—has the biggest and lowest percentage increases in consumption
        paid in EUR between 2012 and 2013?
