      reference: https://github.com/petavue/NL2SQL-Benchmark/tree/0637e2593739f82961d38a14d0d80df2b20e3060/benchmark_scripts
      settings_scope: Provider/model labels, instruction count and shot count are recorded. Exact historical requests,
