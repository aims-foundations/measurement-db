grading:
  rule: Import the published Is match field, 1 for the recorded SQL execution match and 0 otherwise. The Petavue
    evaluator executes predicted/reference SQL against the same database, sorts values within each result column
    where possible, and matches those column lists without column-name or column-order requirements. This differs
    from an exact comparison of result rows. Its exception and timeout paths return 0. Preserve published verdicts;
    do not execute SQL or regrade.
  verifiers:
    recorded_execution:
      kind: recorded_sql_execution_verdict
      field: Is match
      reference_implementation: https://github.com/petavue/NL2SQL-Benchmark/tree/0637e2593739f82961d38a14d0d80df2b20e3060/helper_scripts/evaluation.py
      functions:
      - execute_sql
      - getall_ColumnList
      - compare_dfs
      - execute_model
      limitation: Column-wise sorted matching can disregard row associations. Import the original verdict; do not
        reinterpret it as strict row-wise SQL equivalence.
