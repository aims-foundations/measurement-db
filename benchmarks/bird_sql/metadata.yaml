      anthropic.claude-3-haiku-20240307-v1:0: claude-3-haiku-20240307
      claude-3-haiku-20240307: claude-3-haiku-20240307
      claude-3-opus-20240229: claude-3-opus-20240229
      mistral.mixtral-8x7b-instruct-v0:1: mistralai/Mixtral-8x7B-Instruct-v0.1
      mistralai/Mixtral-8x7B-Instruct-v0.1: mistralai/Mixtral-8x7B-Instruct-v0.1
      mistral.mistral-7b-instruct-v0:2: mistralai/Mistral-7B-Instruct-v0.2
      mistralai/Mistral-7B-Instruct-v0.2: mistralai/Mistral-7B-Instruct-v0.2
      mistralai/Mistral-7B-Instruct-v0.1: mistralai/Mistral-7B-Instruct-v0.1
