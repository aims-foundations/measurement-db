benchmark:
  name: REAL
  description: REAL tests whether web agents can complete user tasks on deterministic clones of real websites,
    counting an attempt as successful only when every one of the task's automatic checks passes.
  testing_condition: 'response = per-attempt binary task success in {0, 1}: 1 iff all of the task''s deterministic
    evals pass, else 0. The website each task runs on is an item feature ; test_condition is null.'
  paper_url: https://openreview.net/forum?id=Un1sWxmZuI
  data_source_url: &leaderboard_api https://realevals.xyz/api/getVerifiedModelData
  subject_type: agent
  item_type: task
  license: unknown
  citation: "@misc{garg2025realbenchmarkingautonomousagents,\n  title={REAL: Benchmarking Autonomous Agents\
    \ on Deterministic Simulations of Real Websites},\n  author={Divyansh Garg and Shaun VanWeelden and\
    \ Diego Caples and Andis Draguns and Nikil Ravi and Pranav Putta and Naman Garg and Tomas Abraham\
    \ and Michael Lara and Federico Lopez and James Liu and Atharva Gundawar and Prannay Hebbar and Youngchul\
    \ Joo and Jindong Gu and Charles London and Christian Schroeder de Witt and Sumeet Motwani},\n  year={2025},\n\
    \  eprint={2504.11543},\n  archivePrefix={arXiv},\n  primaryClass={cs.AI},\n  url={https://arxiv.org/abs/2504.11543},\n\
    }"
  tags:
  - web_agent
  - gui_agent
  - browser
  - agent
  modality:
  - text
  - gui_screenshot
  domain:
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': failure
      '1': success
  categorical: true
  multi_single_turn: multi_turn
  release_date: 2025-04
  release: public
build:
  contract_version: 2
grading:
  verifiers:
    task_checks:
      kind: external_judge
      source: https://raw.githubusercontent.com/agi-inc/REAL/main/src/agisdk/REAL/browsergym/webclones/evaluate.py
      class: WebCloneEvaluator.evaluate
      logic: >-
        ANDs every entry of the task's evals[]. type="jmespath": runs
        `query` against the recorded environment-state diff and exact-matches
        `expected_value`. type="llm_boolean": sends (model_response, `rubric`)
        to an LLM judge and passes if the returned similarity score > 0.8.
    provider_result:
      kind: provider_result_mapping
      source: *leaderboard_api
      logic: "1 iff evalsFailed is empty; if absent, 1 iff accuracy >= 100; otherwise 0"
      upstream_task_verifier: not released in the captured v2 task snapshot
  fallback_rule: >-
    Success requires all provider task checks to pass; task-specific checks are unavailable in the captured release.
sources:
  upstream:
  - url: https://realevals.xyz/api/getVerifiedModelData
    revision: null
    name: results
    file: model_data.json
    size: 3421090
    sha256: 904366e9daf872b8ca250fac5e413248e80d61209aa7db055c213efb695b0683
  - url: https://github.com/agi-inc/REAL
    revision: 56d8f1643bdaa5e662086b1a357a9693c9ededf6
    name: tasks
    files:
    - match: src/agisdk/REAL/browsergym/webclones/tasks/(?P<name>[^/]+\.json)
      path: tasks/{name}
