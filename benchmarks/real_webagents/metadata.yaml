benchmark:
  name: REAL
  description: REAL tests whether web agents can complete user tasks on deterministic clones of real
    websites, counting an attempt as successful only when every one of the task's automatic checks
    passes.
  testing_condition: 'response = per-attempt binary task success in {0, 1}: 1 iff all of the task''s
    deterministic evals pass, else 0. The website each task runs on is an item feature ; test_condition
    is null.'
  paper_url: https://openreview.net/forum?id=Un1sWxmZuI
  data_source_url: https://realevals.xyz/api/getVerifiedModelData
  subject_type: agent
  item_type: task
  license: unknown
  citation: "@misc{garg2025realbenchmarkingautonomousagents,\n  title={REAL: Benchmarking Autonomous\
    \ Agents on Deterministic Simulations of Real Websites},\n  author={Divyansh Garg and Shaun VanWeelden\
    \ and Diego Caples and Andis Draguns and Nikil Ravi and Pranav Putta and Naman Garg and Tomas\
    \ Abraham and Michael Lara and Federico Lopez and James Liu and Atharva Gundawar and Prannay Hebbar\
    \ and Youngchul Joo and Jindong Gu and Charles London and Christian Schroeder de Witt and Sumeet\
    \ Motwani},\n  year={2025},\n  eprint={2504.11543},\n  archivePrefix={arXiv},\n  primaryClass={cs.AI},\n\
    \  url={https://arxiv.org/abs/2504.11543},\n}"
  tags:
  - web_agent
  - gui_agent
  - browser
  - agent
  modality:
  - text
  - gui_screenshot
  domain:
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': failure
      '1': success
  categorical: true
  multi_single_turn: multi_turn
  release_date: 2025-04
  release: public
build:
  contract_version: 1
