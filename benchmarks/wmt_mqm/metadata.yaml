  license: Apache-2.0
  citation: "@misc{freitag2021expertserrorscontextlargescale,\n      title={Experts, Errors, and Context: A Large-Scale\
    \ Study of Human Evaluation for Machine Translation},\n      author={Markus Freitag and George Foster and David\
    \ Grangier and Viresh Ratnakar and Qijun Tan and Wolfgang Macherey},\n      year={2021},\n      eprint={2104.14478},\n\
    \      archivePrefix={arXiv},\n      primaryClass={cs.CL},\n      doi={https://doi.org/10.1162/tacl_a_00437},\n\
    \      url={https://arxiv.org/abs/2104.14478},\n}"
  tags:
  - reasoning
  - multilingual
  modality:
  - text
  domain:
  - translation
  - multilingual
  release_date: 2021-04
  name: 'WMT MQM: per-rater error indicators'
  description: Published expert translation-error annotations represented by the existing six-category, three-severity
    binary readout.
  testing_condition: Retain the eight originally curated 2020–2022 campaign/language tables. One observation records
    whether a human rater annotated at least one error in a declared category/severity bucket for a translated segment.
    This curator-defined error-indicator grid is not the upstream scalar MQM score. Preserve original annotation
    rows, comments, raters and all target-text variants; attach author-corrected 2020 translation text without changing
    the annotations. Exclude nominal source segments whose recorded source-text variants disagree after removing
    annotation span markers and trimming boundary whitespace; originals remain in raw. Do not treat annotator quality-control
    checks as model errors. No model or external judge runs.
  subject_type: translation_system_or_human_reference
  item_type: source_segment_and_grading_dimension
  multi_single_turn: single_turn
  granularity: item
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: lower_is_better
    meanings:
      '0': The rater recorded no error in this declared category/severity bucket.
      '1': The rater recorded at least one error in this declared category/severity bucket.
  categorical: true
  release: public
