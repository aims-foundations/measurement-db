grading:
  rule: The response is 1 if at least one released human annotation maps to the selected category and severity,
    otherwise 0 for that reviewed rating unit. Use the explicitly listed category and severity mappings; the legacy
    major bucket includes critical annotations. A No-error annotation establishes a reviewed unit with zero errors.
    Units containing only ignored categories or annotator checks do not establish a graded observation. This derived
    binary indicator is not an upstream MQM penalty or a model-success grade. Preserve every original annotation
    in the trace.
  verifiers:
    human:
      kind: released_human_error_annotations
      source: https://github.com/google/wmt-mqm-human-evaluation/tree/29acd6999aaea3586378c9dcb58d8cc4820cede3
      scope: published category and severity annotations; do not re-grade or run a model
