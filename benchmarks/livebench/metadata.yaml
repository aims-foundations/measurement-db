benchmark:
  description: Published per-question grading events from the LiveBench release history across six task categories.
  testing_condition: One response represents a distinct published grading event, identified by literal model label,
    question ID, turn and grading timestamp. Repeated exports and task renamings are aliases, not extra responses.
    Different grading timestamps remain separate assessments; they do not establish independent model generations.
    Trial is 1 within each timestamped assessment condition. Include only events whose question definitions occur
    in captured author releases. Use the newest released question definition (test before train within a snapshot),
    including ten prompt typo corrections and fifty repaired reference fields; the precise historical prompt and
    grader version remain unknown. Preserve published scores unchanged, without regrading. Model-answer exports
    lack an authoritative link to these grade events and remain in raw, without assigning their generations as verified
    response traces. Traces instead preserve complete native grade records and their export locations. Exact model
    endpoints and inference settings are unrecorded.
  paper_url: https://arxiv.org/abs/2406.19314
  data_source_url: https://huggingface.co/datasets/livebench/model_judgment
  subject_type: model
  item_type: task
  license: Upstream LiveBench code is Apache-2.0. Dataset cards and the captured datasheet retain the source-specific
    terms for constituent questions; do not assume one license covers all original task content.
  citation: "@misc{white2025livebenchchallengingcontaminationlimitedllm,\n      title={LiveBench: A Challenging,\
    \ Contamination-Limited LLM Benchmark},\n      author={Colin White and Samuel Dooley and Manley Roberts and\
    \ Arka Pal and Ben Feuer and Siddhartha Jain and Ravid Shwartz-Ziv and Neel Jain and Khalid Saifullah and Sreemanti\
    \ Dey and Shubh-Agrawal and Sandeep Singh Sandha and Siddartha Naidu and Chinmay Hegde and Yann LeCun and Tom\
    \ Goldstein and Willie Neiswanger and Micah Goldblum},\n      year={2025},\n      eprint={2406.19314},\n   \
    \   archivePrefix={arXiv},\n      primaryClass={cs.CL},\n      url={https://arxiv.org/abs/2406.19314},\n}"
  tags:
  - reasoning
  modality:
  - text
  domain:
  - general
  response_type: continuous
  response_scale:
    kind: interval
    min: 0
    max: 1
    direction: higher_is_better
  categorical: false
  release_date: 2024-06
  release: public
  name: LiveBench
  granularity: item
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      judgments: judgments/*/data/*.parquet
      questions: questions/*/*/data/*.parquet
    labels:
      subject_prefix: 'LiveBench / '
    subject_features:
      harness: LiveBench released judgments
      model_identifier_status: literal_published_label
      historical_configuration: not_recorded
    trace:
      answer_association: not_established; original model-answer exports are retained separately in raw
