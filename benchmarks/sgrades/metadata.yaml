benchmark:
  description: Released model predictions for student-response assessment across the S-GRADES dataset families.
  testing_condition: Original CSV and JSON prediction records, including ungraded attempts. Associate JSON results
    with unambiguous captured target-input definitions; unresolved associations remain in raw. Repeated progress
    snapshots of the same recorded run are not independent observations. Reconstruct categorical correctness only
    from exact original SemEval annotations; absent numeric references and unparsed explanations remain ungraded.
    CSV prediction positions compact valid outputs and do not establish original call order. All source records
    and full available generated text are preserved. Original historical API requests and chosen few-shot examples
    are unavailable. Captured data remain local pending clarification of upstream redistribution terms.
  paper_url: https://arxiv.org/abs/2603.10233
  data_source_url: https://github.com/nlpatunt/sgrades-experiments
  subject_type: model
  item_type: task
  license: The original experiment repository has no declared license. The original SemEval reference release declares
    CC-BY-SA.
  citation: "@article{seuti2026sgrades,\n  title={S-GRADES: Studying Generalization of Student Response Assessments\
    \ in Diverse Evaluative Settings},\n  author={Seuti, Tasfia and Ray Choudhury, Sagnik},\n  journal={arXiv preprint\
    \ arXiv:2603.10233},\n  year={2026}\n}"
  tags:
  - education
  - grading
  - automatic-short-answer-grading
  - asag
  - assessment
  - llm-as-grader
  - science
  - reasoning-strategies
  modality:
  - text
  domain:
  - education
  - science
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Recorded predicted category differs from original reference
      '1': Recorded predicted category matches original reference
  categorical: true
  release_date: 2026-03
  release: public
  release_reason: "Public under the repository policy; this supersedes the earlier hold based only on unclear licensing. Source terms remain unresolved; no new license grant is implied."
  name: S-GRADES
  multi_single_turn: single_turn
