grading:
  rule: Use the dataset-specific original reference when verified; unavailable grades remain null.
  verifiers:
    2way:
      kind: reconstructed_category_match
      source: https://github.com/nlpatunt/sgrades-experiments/blob/e342b9e450253fedac756dfec5557fb63825c27e/utils/evaluation_engine.py
      rule: Exact match to the original SemEval 2way human category, joined by question and answer text and original
        answer ID where retained. No grade when the association is unavailable.
    3way:
      kind: reconstructed_category_match
      source: https://github.com/nlpatunt/sgrades-experiments/blob/e342b9e450253fedac756dfec5557fb63825c27e/utils/evaluation_engine.py
      rule: Exact match to the original SemEval 3way human category, joined by question and answer text and original
        answer ID where retained. No grade when the association is unavailable.
    numeric:
      kind: unavailable_original_reference
      source: https://github.com/nlpatunt/sgrades-experiments/blob/e342b9e450253fedac756dfec5557fb63825c27e/utils/evaluation_engine.py
      rule: The original evaluator compares the predicted numeric grade with a human reference. A verified reference
        is unavailable for this candidate, so retain response=null.
