grading:
  rule: Strip surrounding whitespace from the released final_answer and reference option; grade 1 exactly
    when the strings match, otherwise 0.
  verifiers:
    exact_answer:
      spec: Compare stripped final_answer and reference_answer strings with exact case-sensitive equality.
