benchmark:
  description: Released TRIDENT instruction-rejection observations on the SafeAgentBench task bank. Six
    system configurations report whether an instruction is blocked or refused; this subset measures system
    behavior, not embodied task-completion success.
  testing_condition: 'Import all six 750-row native exports with the original boolean decision: did_blocked,
    rejected or aug_blocked as appropriate. The scale is unordered: 1 is blocked/refused and 0 is allowed.
    Official task instructions and reference steps match every source task ID. Protocol-1 full/refined
    files are related threshold configurations; Check4 is a post-hoc augmentation and Protocol-2 reuses
    the GPT-4o baseline. They are not independent reruns. Author is_unsafe labels remain in traces, including
    all 50 long-horizon tasks marked unsafe; no new correctness judgment is inferred. Full GPT-4o outputs
    and all other returned fields are preserved. Exact API model snapshots, per-call prompts and complete
    simulator executions are unavailable. Third-party result redistribution terms are not declared in
    the reviewed repository.'
  paper_url: https://arxiv.org/abs/2412.13178
  data_source_url: https://github.com/AnanthapadmanabhanM/TRIDENT-AI-SAFETY
  subject_type: model
  item_type: instruction
  license: 'Official task bank: MIT; third-party result export: not declared'
  citation: "@misc{yin2025safeagentbenchbenchmarksafetask,\n      title={SafeAgentBench: A Benchmark for\
    \ Safe Task Planning of Embodied LLM Agents}, \n      author={Sheng Yin and Xianghe Pang and Yuanzhuo\
    \ Ding and Menglan Chen and Yutong Bi and Yichen Xiong and Wenhao Huang and Zhen Xiang and Jing Shao\
    \ and Siheng Chen},\n      year={2025},\n      eprint={2412.13178},\n      archivePrefix={arXiv},\n\
    \      primaryClass={cs.CR},\n      url={https://arxiv.org/abs/2412.13178}, \n}"
  tags:
  - safety
  - instruction_rejection
  - third_party_results
  name: SafeAgentBench (TRIDENT instruction decisions)
  modality:
  - text
  domain:
  - safety
  - agents_and_tool_use
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: unordered
    meanings:
      '0': The released configuration allowed the instruction.
      '1': The released configuration reported a block or refusal.
  categorical: true
  release_date: 2024-12
  multi_single_turn: single_turn
