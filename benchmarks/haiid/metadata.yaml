grading:
  rule: 'Use the released sign convention and upstream haiid.py::_accuracy: a finite signed response strictly greater
    than zero is correct. Negative values and a neutral zero score zero. The sign in the released CSV is relative
    to the correct label, not a fixed left/right screen position. Preserve the original continuous value in the
    trace.'
  verifiers:
    signed_slider:
      kind: deterministic_recorded_response_scoring
      source: https://github.com/kailas-v/human-ai-interactions/blob/24881cc7586180a9c9742a7dd838aea97d008235/haiid.py
      function: _accuracy
      predicate: response > 0
      neutral_score: 0
      sign_orientation: relative to correct label
