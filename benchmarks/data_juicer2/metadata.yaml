grading:
  rule: Retain the published processing time, converting minutes and hours to seconds. Keep approximate point
    values explicitly qualified. A strict lower bound has no exact point response; store null and preserve
    the bound. No success/failure threshold or new measurement is applied.
  verifiers:
    runtime:
      kind: published_runtime
      source: https://arxiv.org/html/2501.14755v3
      measurement: elapsed_processing_time_seconds
      historical_timer_implementation: null
      extraction: Original timing cells and explicitly stated prose measurements; no plotted-point estimates.
