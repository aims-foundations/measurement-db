benchmark:
  description: 'MedHELM head_qa: per-(model, item) exact_match in {0,1} (1=correct) on 1000 Spanish healthcare
    specialization (MIR/medicine/pharmacy/nursing) exam questions. 13 models from the MedHELM v4.0.0 release.'
  testing_condition: Published zero-shot MedHELM run; model deployment and generation settings are subject
    features. Grades are imported unchanged.
  paper_url: https://arxiv.org/abs/2505.23802
  data_source_url: https://crfm.stanford.edu/helm/medhelm/
  subject_type: model
  item_type: task
  license: unknown
  citation: "@article{bedi2025medhelm,\n  title={MedHELM: Holistic Evaluation of Large Language Models\
    \ for Medical Tasks},\n  author={Bedi, Suhana and Cui, Hejie and Fuentes, Miguel and Unell, Alyssa\
    \ and others and Shah, Nigam H.},\n  journal={arXiv preprint arXiv:2505.23802},\n  year={2025},\n}"
  tags:
  - medical
  - clinical
  - medhelm
  - helm
  modality:
  - text
  domain:
  - medicine
  - multilingual
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': incorrect
      '1': correct
  categorical: true
  release_date: 2019-06
  release: public
  name: MedHELM HEAD-QA
  version: MedHELM v4.0.0
  multi_single_turn: single_turn
  granularity: item
build:
  contract_version: 2
  parameters:
    helm:
      scenario: head_qa
      release: v4.0.0
      metric: exact_match
grading:
  rule: Use the published exact_match value after HELM response adaptation, compared with the correct-tagged
    reference.
  verifiers:
    published:
      kind: published_helm_metric
      metric: exact_match
      implementation_reference: https://github.com/stanford-crfm/helm/blob/63754d05db6f874e41a395880fb573890a13e791/src/helm/benchmark/metrics/basic_metrics.py
      release_code_revision: not recorded in the published run spec; the linked source is an inspected
        reference implementation
sources:
  upstream:
  - name: runs
    url: https://storage.googleapis.com/crfm-helm-public
    revision: v4.0.0
    prefix: 'medhelm/benchmark_output/runs/v4.0.0/head_qa:'
    tree_sha256: 9bde07c711178d3a11373ad7d5ba0ee1794ff27b5e17d9e4fb20543a149edfd0
    files:
    - match: (?P<run>[^/]+)/(?P<kind>run_spec|instances|per_instance_stats|display_predictions|display_requests)\.json
      path: runs/{run}/{kind}.json
  - name: grader
    url: https://github.com/stanford-crfm/helm
    revision: 63754d05db6f874e41a395880fb573890a13e791
    files:
    - match: src/helm/benchmark/metrics/(?:basic_metrics\.py)
      path: harness/{path}
