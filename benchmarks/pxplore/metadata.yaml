      harness: Pxplore learner-state alignment
sources:
  upstream:
  - name: release
    url: https://github.com/Pxplore/pxplore-algo
    revision: 42ea4af81d815d4c779fc29ab15a5b1fd5690e0d
    files:
    - match: (?:README[.]md|model/(?:data/(?:testset[.]json|(?:test|eval)/[^/]+[.]json)|(?:evaluation|calculate_reward|prepare_data|data_preprocessing|reward_plugin)[.]py|prompts/[^/]+[.]txt|test/[^/]+[.]py)|service/(?:scripts/prompts/snippet_selection[.]txt|llm/(?:llama|qwen)[.]py))
      path: release/{path}
grading:
  rule: Preserve the original next_state component is_aligned boolean. An absent grade or omitted initial criterion
    remains null. The original GPT-4o evaluator updates learner-state criteria after the selected lesson; when a
    recommendation is missing or an error string, it copies the initial state. Criterion identity is the exact description
    prefix before the evidence suffix, within its dimension. No regrading or inferred semantic matching is performed.
  verifiers:
    published:
      kind: published_alignment_with_initial_state_fallback
      source: https://github.com/Pxplore/pxplore-algo/blob/42ea4af81d815d4c779fc29ab15a5b1fd5690e0d/model/evaluation.py
      field: next_state[dimension][component].is_aligned
      model: gpt-4o (source alias; immutable version unavailable)
      fallback: If recommend_content is null or a string, next_state is copied from initial_state.
      aggregation_source: https://github.com/Pxplore/pxplore-algo/blob/42ea4af81d815d4c779fc29ab15a5b1fd5690e0d/model/calculate_reward.py
