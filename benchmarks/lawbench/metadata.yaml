grading:
  rule: Preserve source inputs and references; reconstruct only mathematically per-item metrics with unchanged source
    code. Null denotes an unavailable individual grade.
  verifiers:
    1-1:
      kind: reconstructed_native_deterministic_metric
      metric: ROUGE-L
      source: https://github.com/open-compass/LawBench/blob/e30981bb3ff54c41571f222e0b23e92d27375388/evaluation/evaluation_functions/ftcs.py
      function: ftcs.compute_ftcs
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      rule: Use the unchanged published {task} evaluator on the single released record, including its original prediction
        and reference. The item contains the complete recorded prompt for the released {setting} setting, including
        demonstrations and any saved template text. The reference_answer field is a JSON-encoded string, preserving
        empty references and all whitespace. Source-excluded references remain ungraded; abstentions use the native
        score. These are reconstructed deterministic grades with declared library versions, not newly generated
        model responses. Preserve the native per-item value without thresholding or rounding.
    1-2:
      kind: reconstructed_native_deterministic_metric
      metric: accuracy
      source: https://github.com/open-compass/LawBench/blob/e30981bb3ff54c41571f222e0b23e92d27375388/evaluation/evaluation_functions/jec_kd.py
