      math_reference: references/math500/6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be/test.jsonl
      gsm_reference: references/gsm8k/740312add88f781978c0658806c59bc2815b9866/main/test-00000-of-00001.parquet
    datasets:
      Llama31_GSM8k_testset_bo256.jsonl: gsm8k
      Llama31_MATH500_testset_bo256.jsonl: math500
      Mistral_GSM8k_testset_bo256.jsonl: gsm8k
      Mistral_MATH500_testset_bo256.jsonl: math500
      result_lcb_bo64_eval.jsonl: livecodebench
      result_lct_bo64_eval.jsonl: leetcode
    models:
      Llama31_GSM8k_testset_bo256.jsonl: MetaMath-Llama
      Llama31_MATH500_testset_bo256.jsonl: MetaMath-Llama
      Mistral_GSM8k_testset_bo256.jsonl: MetaMath-Mistral
      Mistral_MATH500_testset_bo256.jsonl: MetaMath-Mistral
      result_lcb_bo64_eval.jsonl: LCD-DS
      result_lct_bo64_eval.jsonl: LCD-DS
