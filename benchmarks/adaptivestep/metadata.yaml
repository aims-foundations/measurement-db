benchmark:
  name: AdaptiveStep candidate pools
  description: Released math and code candidate solutions used for AdaptiveStep Best-of-N evaluation. The tables
    measure individual policy-generator attempts, not reward-model selection or token-guided decoding.
  testing_condition: Preserve 256 math candidates per generator/problem and the 64 final code candidates per problem.
    Math grades are derived with the authors' answer parser and question-matched reference banks; four swapped Llama
    MATH500 references are corrected. Original references and original derived grades remain in traces. Code pools
    have no released execution verdicts, so their responses are null. PRM and ORM files annotate the same code candidates
    and are not independent runs. Pre-filter code arrays and alternate math step formatting are retained or referenced
    as source material, not counted as additional evaluated pools. Use the recorded input/prompt when available;
    otherwise retain the released question without inventing a generation wrapper. Exact generator checkpoint revisions
    and sampling settings are not recorded.
  paper_url: https://proceedings.mlr.press/v267/liu25aq.html
  data_source_url: https://github.com/Lux0926/ASPRM
  subject_type: model
  item_type: task
  license: 'Math candidate release and ASPRM code: unspecified; code candidate release: MIT; reference datasets
    retain their upstream terms.'
  citation: 'Liu et al. (2025). AdaptiveStep: Automatically Dividing Reasoning Step through Model Confidence. ICML,
    PMLR 267:39016–39031.'
  tags:
  - math
  - code
  - reasoning
  - best-of-n
  - process-reward-model
  modality:
  - text
  domain:
  - mathematics
  - coding
  - reasoning
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Answer fails the specified checker
      '1': Answer passes the specified checker
  categorical: true
  release_date: 2025-02
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    layout:
      math: math/3e8428e783605f7ebf95b3390acb77b1f0632d29
