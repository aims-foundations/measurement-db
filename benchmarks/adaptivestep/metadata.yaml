grading:
  verifiers:
    gsm8k:
      kind: derived_answer_match
      source: https://github.com/Lux0926/ASPRM/blob/6682033ba686b7d7fddd13df4cac09347148f42e/evaluation/math/BON/eval.py
      grade_origin: recomputed_from_released_model_output
      rule: 'Extract the first numeric match after ''The answer is:'' and compare its captured string exactly with
        the number after #### in the question-matched GSM8k reference. Preserve the native regex, including its
        comma handling; no match fails. This is answer parsing, not numeric tolerance or symbolic equivalence.'
    math500:
      kind: derived_answer_match
      source: https://github.com/Lux0926/ASPRM/blob/6682033ba686b7d7fddd13df4cac09347148f42e/evaluation/math/BON/eval.py
      normalizer: https://github.com/Lux0926/ASPRM/blob/6682033ba686b7d7fddd13df4cac09347148f42e/evaluation/math/BON/util.py
      grade_origin: recomputed_from_released_model_output
      rule: 'Use the last ''The answer is: '' segment, cut at the first period-newline, trim whitespace and one
        final period. Compare with the last boxed answer in the question-matched MATH500 reference solution using
        the unchanged upstream util.is_equiv normalizer. Missing markers fail. Four swapped source gt_answer values
        are corrected by exact question matching; original fields and their derived verdicts are retained.'
    livecodebench:
      kind: code_execution
      source: https://github.com/Lux0926/ASPRM/blob/6682033ba686b7d7fddd13df4cac09347148f42e/readme.md
      grade_origin: not_released
      evaluation: LiveCodeBench release_v4 custom evaluator
      rule: The generated program must pass all benchmark test cases. The captured AdaptiveStep candidate files
        contain no execution verdicts; retain these attempts with response=null rather than inferring success.
    leetcode:
      kind: code_execution
      source: https://github.com/Lux0926/ASPRM/blob/6682033ba686b7d7fddd13df4cac09347148f42e/readme.md
      grade_origin: not_released
      evaluation: ASPRM_LCT_Eval LeetCodeTest
      rule: The generated program must pass the task's LeetCodeDataset tests. The released reference implementation
        is not an execution verdict; candidate grades remain null because no per-candidate test outcomes are published.
