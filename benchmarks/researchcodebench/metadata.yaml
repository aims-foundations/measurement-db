benchmark:
  name: ResearchCodeBench
  description: >-
    ResearchCodeBench tests whether models can implement a missing piece of a
    recent machine learning paper's code, given the paper itself and the
    surrounding file, with curated tests deciding whether the filled in code
    works.
  paper_url: https://openreview.net/forum?id=3k70Vt0YFS
  data_source_url: https://researchcodebench.github.io/
  license: unknown
  modality:
    - text
  domain:
    - software_engineering
    - ml_engineering
  response_type: binary
  response_scale: {kind: discrete, values: [0, 1]}
  categorical: true
  release_date: "2025-06"
  multi_single_turn: single_turn
  testing_condition: >-
    The provider's headline greedy run requested one completion at temperature
    zero, used one user message with no system message, included each paper by
    default, parsed the last Python Markdown block, inserted it into the masked
    source file, and ran the paper-specific Python test program with a 60-second
    timeout. Per-model client overrides in the released configuration still
    apply. Each item stores the legacy reconstructed prompt and reference code;
    paper is an item feature, while test_condition and interactors are null.
    Response is the released per-(model configuration, snippet) passed flag.
    The two Gemini 2.5 Pro preview labels resolve to one canonical subject, so
    their historical rows remain trials 1 and 2 rather than distinct subjects.
    No completion text or raw API trace was released in the pinned run artifact.
  subject_type: model
  item_type: task
  citation: |-
    @inproceedings{hua2025researchcodebench,
      title={ResearchCodeBench: Benchmarking LLMs on Implementing Novel Machine Learning Research Code},
      author={Hua, Tianyu and Hua, Harper and Xiang, Violet and Klieger, Benjamin and Truong, Sang T. and Liang, Weixin and Sun, Fan-Yun and Haber, Nick},
      booktitle={NeurIPS 2025 Datasets and Benchmarks Track},
      year={2025},
    }
  tags:
    - code_generation
    - machine_learning
    - research
    - novelty
  release: public

