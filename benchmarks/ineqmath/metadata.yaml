grading:
  rule: The published final-answer judge extracts a final answer and compares it with the reference, using an LLM
    for bound extraction or mathematical equivalence and as a fallback for relation extraction. Individual judgments
    are not saved in the release. Preserve a null grade for each recorded attempt; neither API success nor agreement
    with aggregate totals establishes correctness. Stepwise proof correctness is a separate unreleased evaluation.
  verifiers:
    final_answer:
      kind: upstream_llm_assisted_final_answer_judge
      source: https://github.com/lupantech/ineqmath/blob/2bd4413a3efd8ce3bdccc81eb2ec0afab2b25557/models/utils/compute_score.py
      function: ScoreComputer.evaluate_single_result
      default_judge: gpt-4o-mini
      judgment_availability: individual judgments not released
      execution: not rerun during curation
      output: aggregate scores.json only
      stepwise_evaluation: Separate private upstream evaluation platform
