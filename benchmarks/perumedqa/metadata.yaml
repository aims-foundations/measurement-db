grading:
  rule: Extract the first case-sensitive Respuesta final answer matching the released regular expression. A valid
    letter receives 1 if equal to correct_answer and 0 otherwise. An unparseable output is an ungraded attempt (null),
    excluded from the published accuracy denominator.
  verifiers:
    answer:
      kind: regex_then_exact_match
      pattern: Respuesta final:\s?\(?([ABCDE])\)?
      source: https://github.com/rodrigo-carrillo/PeruMedQA/tree/709158accc32fed76e32b0c9b6c3b0ef759766ab/02.LLMs%20Results
      implementation: 'Analysis*.ipynb: str.extract, dropna(subset=letra_respuesta), then comparison with correct_answer'
      flags: case_sensitive
      match: first
      missing: 'null'
