benchmark:
  description: Spanish medical multiple-choice questions from Peruvian residency examinations, with released outputs
    from eleven medical model configurations.
  testing_condition: 'Preserve all 92,180 published attempts on 8,380 question-bank rows. The authors exclude unparseable
    answers from accuracy: 85,107 attempts receive binary grades and 7,073 retain null grades, including 1,904 empty
    decoded strings. Repeated question text and grading share an item; original bank positions remain in traces.
    For the fine-tuned medgemma4B_TF configuration, pre-2025 rows belong to the training/validation pool and 2025
    rows to the held-out-year pool; individual training/validation membership and cross-year content leakage are
    not inferred. Released generation scripts declare model identifiers and settings but do not establish exact
    historical checkpoint revisions or complete run-level API requests. The separately published shuffled-options
    stress analysis supplies aggregate results only and is outside this item-level result scope.'
  paper_url: https://arxiv.org/abs/2509.11517
  data_source_url: https://github.com/rodrigo-carrillo/PeruMedQA
  subject_type: model
  item_type: question
  license: Apache-2.0
  citation: "@article{carrillolarco2025perumedqa,\n  title={PeruMedQA: Benchmarking Large Language Models (LLMs)\
    \ on Peruvian Medical Exams -- Dataset Construction and Evaluation},\n  author={Carrillo-Larco, Rodrigo M. and\
    \ Lov\\'on Melgarejo, Jesus and Castillo-Cara, Manuel and Bravo-Rocca, Gusseppe},\n  journal={arXiv preprint\
    \ arXiv:2509.11517},\n  year={2025},\n}"
  tags:
  - medical
  - clinical
  - multilingual
  - spanish
  - peru
  - mcqa
  modality:
  - text
  domain:
  - medicine
  - knowledge
  - multilingual
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': A parsed answer differs from the reference letter
      '1': A parsed answer matches the reference letter
  categorical: true
  release_date: 2025-09
  release: public
  name: PeruMedQA
  version: 709158accc32fed76e32b0c9b6c3b0ef759766ab
  multi_single_turn: single_turn
  granularity: item
