benchmark:
  name: JailbreakBench
  description: Released final target-model outputs under five jailbreak methods, with primary and available historical
    judge decisions kept as separate grading protocols.
  testing_condition: 'The 18 non-fixture artifact exports contain 1800 behavior slots and 1637 actual final target
    outputs. The upstream evaluator does not query the 163 absent submitted prompts: it pads those slots with null
    prompt/response and False. Preserve those slots in raw inputs but do not count them as failed target responses.
    Import 1637 primary judgments and 1437 available historical LlamaGuard1 judgments, producing 3074 graded observations
    of 1637 target outputs. Each judge defines its own item grading protocol. Preserve exact attack prompts, complete
    outputs, declared evaluation providers, attack settings and DSN''s original evaluation logs. The four model
    identifiers occur under different recorded backends. Historical harness revisions, system messages and per-call
    sampling settings are not recorded. Aggregate attack success rates include unsubmitted slots and therefore use
    a different denominator; 13 stored total-count fields are stale or describe a different evaluation stage. No
    attacks, model inference or grading are rerun.'
  paper_url: https://arxiv.org/abs/2404.01318
  data_source_url: https://github.com/JailbreakBench/artifacts
  subject_type: model
  item_type: task
  license: MIT; artifact copyright belongs to the corresponding artifact authors.
  citation: 'Chao et al. JailbreakBench: An Open Robustness Benchmark for Jailbreaking Large Language Models. NeurIPS
    2024 Datasets and Benchmarks.'
  tags:
  - safety
  - jailbreak
  - red_teaming
  modality:
  - text
  domain:
  - safety
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: lower_is_better
    meanings:
      '0': Not classified as jailbroken by the specified judge
      '1': Classified as jailbroken by the specified judge
  categorical: true
  release_date: null
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      archive: artifacts.tar.gz
      root: artifacts-909e68c01d94222b8ad2e397a017e2e12e2adb73
      artifact_pattern: attack-artifacts/[^/]+/[^/]+/[^/]+\.json
      excluded_fixture: test-artifact
      dsn_submission: attack-artifacts/DSN/submission.json
      dsn_evaluation: attack-artifacts/DSN/evaluation.json
      dsn_method: DSN
    subject_features:
      harness: JailbreakBench
      configuration_scope: Released model identifier and evaluation provider. Historical harness revision, system
        messages and per-call sampling settings are not recorded.
    observation:
      input_scope: Exact released final attack prompt. Unrecorded system messages are not reconstructed.
