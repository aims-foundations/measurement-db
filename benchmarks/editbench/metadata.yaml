grading:
  rule: passed / (total + skipped) == 1.0 in the official EDIT-Bench test runner
  verifiers:
    test_suite:
      kind: editbench_executable_test_suite
      source_item: https://huggingface.co/datasets/copilot-arena/editbench/blob/230cd16584238c917c3c45a77c72d6a2607ed623/data/editbench/complete.jsonl
      grader_source: https://github.com/waynchi/editbench/blob/b406cc5143feb91e9bda1edd01cbe37d84d185fd/edit_bench/evaluation.py
      timeout_seconds_per_command: 180
      max_parallel_items: 4
      raw_score: passed / (total + skipped)
      success: raw_score == 1.0
      missing_or_malformed_test_result_score: 0.0
    execution:
      javascript:
        commands:
        - - npm
          - install
        - - sleep
          - '1'
        - - npm
          - test
        files:
          implementation: implementation1.js
          original: original_code.js
          test: tests/test_code.test.js
        extraction: generated_code.split('```javascript')[-1].split('```')[0].strip()
      javascript/react:
        commands:
        - - npm
          - install
        - - sleep
          - '1'
        - - npm
          - test
        files:
          implementation: implementation1.jsx
          original: original_code.jsx
          test: tests/test_code.test.js
        extraction: generated_code.split('```javascript')[-1].split('```')[0].strip()
      python:
        commands:
        - - uv
          - venv
          - --python
          - '{python_version}'
        - - uv
          - pip
          - install
          - --python
          - <sandbox>/.venv/bin/python
          - -r
          - <sandbox>/requirements.txt
        - - <sandbox>/.venv/bin/python
          - -m
          - pytest
          - <sandbox>/test_code.py
          - -v
          - -s
        - - rm
          - -rf
          - .venv
        files:
          implementation: implementation1.py
          original: original_code.py
          requirements: requirements.txt
          test: test_code.py
        extraction: generated_code.split('```python')[-1].split('```')[0].strip()
    special_files:
      b8451da4-d914-442a-9eb5-6982148c1cab:
        app.py: fastapp = {}
