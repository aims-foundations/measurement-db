benchmark:
  description: Released model responses and original fractional grades on university STEM assessment questions with
    archived input images.
  testing_condition: Import the 17 individual model/prompt-strategy channels across all 255 released question records,
    preserving original grade_score values in [0,1], including partial credit. The paper describes a 201-question
    analyzed subset; this data release is larger. The two vote aggregations and image-description intermediate step
    remain in the raw file, not as additional independent model attempts. Original requests and historical model
    snapshots are not released; source aliases and strategy names are retained. No models or graders run.
  paper_url: https://arxiv.org/abs/2507.03013
  data_source_url: https://github.com/AnnaSou/multimodal-stem-ai
  subject_type: model
  item_type: question
  license: unknown
  citation: "@inproceedings{dechillaz2025multimodal,\n  title={Challenges for {AI} in Multimodal {STEM} Assessments:\
    \ a Human-{AI} Comparison},\n  author={de Chillaz, Aymeric and Sotnikova, Anna and Jermann, Patrick and Bosselut,\
    \ Antoine},\n  booktitle={Proceedings of the 20th Workshop on Innovative Use of NLP for Building Educational\
    \ Applications (BEA 2025)},\n  year={2025},\n  url={https://aclanthology.org/2025.bea-1.22/}\n}"
  tags:
  - stem
  - multimodal
  - exam
  - education
  - human-ai-comparison
  modality:
  - text
  - image
  domain:
  - education
  - science
  - reasoning
  response_type: continuous_bounded
  response_scale:
    kind: interval
    min: 0
    max: 1
    direction: higher_is_better
  categorical: false
  release_date: 2025-07
  release: public
  name: Multimodal STEM Assessments (Human-AI)
  granularity: item
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    layout:
      records: runs/all_models_all_mooc_courseware_samples.json
      input_images: data/curated_dataset/question_images
