grading:
  verifiers:
    hybrid:
      judge: Released hybrid grading pipeline
      spec:
        source: https://github.com/AnnaSou/multimodal-stem-ai/blob/c876949dce78c987d88d66ad92af98e9a238d233/code/llm_grading.py
        class_name: grade_answer and function_grade_samples
        logic: 'Preserve the published grade_score. Reference code dispatches by question type: answer parsing/matching,
          numerical tolerance, LLM-assisted option/formula checks, and averaged compound-question sub-scores. Historical
          manual overrides and exact invocation settings are not recorded per judgment. The numeric domain is [0,1];
          do not binarize, round or regrade.'
      rule: The original released grade_score measures correctness, including partial credit for compound questions.
sources:
  upstream:
  - name: release
    url: https://github.com/AnnaSou/multimodal-stem-ai
    revision: c876949dce78c987d88d66ad92af98e9a238d233
    files:
    - match: runs/all_models_all_mooc_courseware_samples\.json|README\.md|code/(llm_grading|llm_prompting|llm_prompts|images_utils)\.py|data/curated_dataset/question_images/.+
      path: '{path}'
