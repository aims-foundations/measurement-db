      basic_prompt: gpt-4o
      traditional_cot: gpt-4o
      image_first: gpt-4o
      gpt_4o_only_image_description: gpt-4o
      o1_mini_prompt: o1-mini
      qwen2.5_72b_basic_prompt: qwen/qwen2.5-vl-72b-instruct
      qwen2.5_72b_traditional_cot: qwen/qwen2.5-vl-72b-instruct
      qwen2.5_72b_image_first: qwen/qwen2.5-vl-72b-instruct
      qwen2.5_72b_only_image_description: qwen/qwen2.5-vl-72b-instruct
      r1_basic_prompt: deepseek/deepseek-r1
      r1_traditional_cot: deepseek/deepseek-r1
      r1_image_first: deepseek/deepseek-r1
      r1_only_image_description: deepseek/deepseek-r1
      claude_3_7_basic_prompt: anthropic/claude-3.7-sonnet:thinking
      claude_3_7_traditional_cot: anthropic/claude-3.7-sonnet:thinking
      claude_3_7_image_first: anthropic/claude-3.7-sonnet:thinking
      claude_3_7_only_image_description: anthropic/claude-3.7-sonnet:thinking
    prompt_strategies:
      basic_prompt: basic_prompt
      traditional_cot: traditional_cot
      image_first: image_first
      gpt_4o_only_image_description: only_image_description
      o1_mini_prompt: basic_prompt
      qwen2.5_72b_basic_prompt: basic_prompt
      qwen2.5_72b_traditional_cot: traditional_cot
      qwen2.5_72b_image_first: image_first
      qwen2.5_72b_only_image_description: only_image_description
      r1_basic_prompt: basic_prompt
      r1_traditional_cot: traditional_cot
      r1_image_first: image_first
      r1_only_image_description: only_image_description
      claude_3_7_basic_prompt: basic_prompt
      claude_3_7_traditional_cot: traditional_cot
      claude_3_7_image_first: image_first
      claude_3_7_only_image_description: only_image_description
    labels:
