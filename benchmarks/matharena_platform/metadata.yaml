benchmark:
  name: MathArena Platform
  description: Published model attempts on ArXivMath, ArXivLean, BrokenArXiv and USAMO 2026, with original requests,
    full conversations and native grading scales.
  testing_condition: One observation per released model configuration, problem and attempt. Use the recorded user_message
    when present; for 97 records lacking it, preserve the released natural-language problem and formal statement
    and explicitly mark the input as a task definition rather than a reconstructed historical request. Keep literal
    model_name and model_config identifiers; unrecorded endpoint versions, inference settings and exact historical
    judge versions remain unknown. Preserve every native output field in a linked JSON trace, including empty responses,
    costs, parsed answers and grading details. ArXivMath and ArXivLean have binary grades, BrokenArXiv retains half
    credit, and USAMO retains its source-normalized fractional proof scores. Three ArXivMath releases also appear
    in the MathArena collection; these are overlapping observations and must not be counted twice when pooling collections.
    This pinned release updates older snapshots; comparison and original files are retained in the migration evidence.
  paper_url: https://arxiv.org/abs/2605.00674
  data_source_url: https://huggingface.co/MathArena
  subject_type: model
  item_type: task
  license: Per-release CC-BY-SA-4.0 or CC-BY-NC-SA-4.0, as recorded in each captured Hugging Face dataset card;
    harness code is MIT.
  citation: 'Dekoninck et al. Beyond Benchmarks: MathArena as an Evaluation Platform for Mathematics with LLMs.
    arXiv:2605.00674, 2026.'
  tags:
  - mathematics
  - reasoning
  - formal_proofs
  modality:
  - text
  domain:
  - mathematics
  - reasoning
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2026-05
  release: public
  granularity: item
  multi_single_turn: multi_turn, single_turn
build:
  contract_version: 2
  parameters:
    layout:
      outputs: outputs/*/data/*.parquet
      tasks: tasks/*/data/*.parquet
    versions:
      arxivlean_0326: arxivlean
      arxivlean_0626: arxivlean
      arxivmath_0126: arxivmath
      arxivmath_0226: arxivmath
      arxivmath_0326: arxivmath
      arxivmath_0426: arxivmath
      arxivmath_0526: arxivmath
      arxivmath_0626: arxivmath
      arxivmath_0826: arxivmath_answer_judge
      arxivmath_1225: arxivmath
      brokenarxiv_0226: brokenarxiv
      brokenarxiv_0326: brokenarxiv
      brokenarxiv_0426: brokenarxiv
      brokenarxiv_0526: brokenarxiv
      brokenarxiv_0626: brokenarxiv
      brokenarxiv_0826: brokenarxiv
      usamo_2026: usamo
    labels:
      subject_prefix: 'MathArena Platform / '
      recorded_input: released_user_message
      fallback_input: released_problem_and_formal_statement
    subject_features:
      harness: MathArena
      configuration_scope: released_model_name_and_config_identifier
      historical_endpoint_settings: not_fully_recorded
    rubric_fields:
      title: Released criterion title
      max_points: Released maximum points
      grading_scheme_desc: Released grading rule
    overlap:
      arxivmath_1225: matharena
      arxivmath_0126: matharena
      arxivmath_0226: matharena
grading:
  verifiers:
    arxivmath:
      kind: published_final_answer_correctness
      source: https://github.com/eth-sri/matharena/blob/b89f2f0ad64ced464d2944f08c3c0aaeaa0df64b/src/matharena/grader.py
      method: Recorded parser and reference-answer comparison; the exact historical scorer commit is not exported
        with each attempt.
      verifier_class: exact_matcher
      response_scale: &id001
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '0': The published evaluation marks this attempt incorrect.
          '1': The published evaluation marks this attempt correct.
      rule: Import the released correct field without regrading. It reports whether the extracted final answer satisfies
        the published reference-answer checker. The full native prediction, parsed answer, reference and messages
        remain in the trace.
    arxivmath_answer_judge:
      kind: published_final_answer_judgment
      source: https://github.com/eth-sri/matharena/blob/b89f2f0ad64ced464d2944f08c3c0aaeaa0df64b/configs/competitions/arxiv/august.yaml
      method: The August configuration declares answer_judge; individual historical judge identities are not included
        in the output export.
      verifier_class: judge
      response_scale: *id001
      rule: Import the released correct field for the native final-answer judgment without rerunning the judge.
        The August release uses answer_judge; preserve original answer and reference rather than substituting a
        new exact matcher.
    arxivlean:
      kind: published_lean_verification
      source: https://github.com/eth-sri/matharena/blob/b89f2f0ad64ced464d2944f08c3c0aaeaa0df64b/src/matharena/grader.py
      method: Recorded Lean compilation and target-statement verification; the historical environment is not reconstructed.
      verifier_class: exact_matcher
      response_scale: *id001
      rule: Import the released correct field for the formal-proof attempt. The target formal statement is a grading
        condition, not a model-generated reference solution. Keep unsuccessful or empty recorded attempts, including
        source-reported false grades.
    brokenarxiv:
      kind: published_false_statement_judgment
      source: https://github.com/eth-sri/matharena/blob/b89f2f0ad64ced464d2944f08c3c0aaeaa0df64b/scripts/judge/judge.py
      method: Released judge points divided by released maximum points, including partial credit; judge output and
        grading details are preserved.
      verifier_class: judge
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      rule: Import the released correct grade for an intentionally false mathematical claim. Where judge details
        exist it equals judge points divided by maximum points; preserve all native fractional categories, including
        halves or thirds depending on the released rubric. Three empty attempts have published zero grades without
        judge details; retain those source-reported zeros explicitly. This is the published evaluation, not a new
        proof check.
    usamo:
      kind: published_proof_judgment
      source: https://github.com/eth-sri/matharena/blob/b89f2f0ad64ced464d2944f08c3c0aaeaa0df64b/scripts/judge/judge.py
      method: Released proof-rubric points divided by seven; all original points and the full rubric remain available.
      verifier_class: judge
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
      rule: 'Import the source-provided correct value: the released proof assessment in points divided by the maximum
        of seven. Keep every fractional value; do not threshold it into pass/fail. Preserve the complete released
        grading scheme.'
