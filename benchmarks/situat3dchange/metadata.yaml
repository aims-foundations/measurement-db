  - name: inputs
    url: https://huggingface.co/datasets/lrp123/Situat3DChange
    revision: 08661fe30c37d47e1b717fdf343e219f1355fe28
    files:
    - match: (?:annotation\.zip|ego_view\.zip|README\.md)
      path: inputs/{path}
  - name: leo_data
    url: https://huggingface.co/datasets/huangjy-pku/LEO_data
    revision: 368e162ff3c2ea0b06bf230ad43fb27605f01f14
    files:
    - match: (?:3RScan-ours-align\.zip|README\.md)
      path: leo_data/{path}
  - name: leo_code
    url: https://github.com/embodied-generalist/embodied-generalist
    revision: 567f2d809cf8b21289d7fb9d3b616ae9c405cba3
    files:
    - match: (?:README\.md|LICENSE)
