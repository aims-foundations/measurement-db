grading:
  rule: Import the explicit reward_info.reward without regrading. One denotes native success and zero denotes native
    failure. An absent reward is null, not zero. The native evaluator combines the components named in the embedded
    evaluation_criteria.reward_basis; retain the complete criteria and reward evidence. Do not substitute current
    documentation defaults for the actual recorded task.
  verifiers:
    native:
      kind: published_tau2_reward
      source: https://github.com/sierra-research/tau2-bench/blob/363133ada1936491fb5bcec33cd62c3518a99f65/src/tau2/evaluator/evaluator.py
      version_scope: The linked captured evaluator documents the framework. The recorded run commit is retained
        separately; private or unspecified historical evaluator versions and unreported LLM judges are unknown.
      components:
        DB: Compares the resulting environment state with the state obtained by replaying the reference actions.
        COMMUNICATE: Checks that required information was communicated in the conversation.
        ENV_ASSERTION: Checks the task assertions against the final environment.
        ACTION: Checks for the required tool calls when selected in reward_basis.
        NL_ASSERTION: An LLM judges natural-language assertions. The original judge model is not recorded in these
          run files.
