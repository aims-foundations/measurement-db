benchmark:
  name: tau2-bench
  description: Recorded customer-service agent trials in the airline, retail and telecom domains, including the
    original telecom ablations.
  testing_condition: Preserve each published simulation, its embedded task, policy, tools, run configuration and
    native reward. Missing rewards remain ungraded, including logged API-error attempts with no conversation. Agent
    configurations and harness revisions identify subjects. Task and grading revisions remain distinct items. Full
    run and submission records retain disagreements between embedded settings and later leaderboard descriptions;
    no historical model alias or judge is inferred. These are captured task and harness definitions, not a reconstruction
    of every historical database or the exact prompt seen by the agent.
  paper_url: https://arxiv.org/abs/2506.07982
  data_source_url: https://github.com/sierra-research/tau2-bench
  subject_type: agent
  item_type: task
  license: MIT
  citation: "@misc{barres2025tau2benchevaluatingconversational,\n      title={$\\tau^2$-Bench: Evaluating Conversational\
    \ Agents in a Dual-Control Environment},\n      author={Victor Barres and Honghua Dong and Soham Ray and Xujie\
    \ Si and Karthik Narasimhan},\n      year={2025},\n      eprint={2506.07982},\n      archivePrefix={arXiv},\n\
    \      primaryClass={cs.AI},\n      url={https://arxiv.org/abs/2506.07982},\n}"
  tags:
  - agent
  - tool_use
  - customer_service
  - user_simulation
  modality:
  - text
  domain:
  - agents_and_tool_use
  multi_single_turn: multi_turn
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': failure
      '1': success
  categorical: true
  release_date: 2025-06
  release: public
  granularity: item
  version: 363133ada1936491fb5bcec33cd62c3518a99f65
  one_line_description: Measures tool-using customer-service agents in dual-control conversations.
build:
  contract_version: 2
  parameters:
    layout:
      repository_runs: repo_results/*.json
      submitted_runs: s3_trajectories/*/*.json
    labels:
      harness: tau2-bench
      configuration_scope: Literal recorded agent configuration and source submission. Embedded settings may disagree
        with the submission description.
      input_scope: Complete task and embedded domain policy, tool definitions and simulator guidelines. These are
        harness inputs, not a claim that every field was shown to the agent. Historical database snapshots and custom
        prompts are not fully recorded.
      submission_scope: The complete captured submission description may refer to later domains or grading revisions.
        It is retained as provenance without overriding an individual simulation.
    domains:
      airline: airline
      retail: retail
      telecom: telecom
      telecom-workflow: telecom workflow ablation
