grading:
  rule: Derive the native per-scene F1 from the published output. Extract candidate indices in message
    order and greedily match each selection to the first unplaced reference block allowed by the condition.
    Pose-constrained grading matches type, color and Euler orientation and requires dependencies already
    placed. Topology-only grading matches type and color without dependency or orientation constraints.
    TP is matched placements, FP unmatched selections, FN unmatched reference blocks; compute precision/recall
    and their harmonic mean, rounded to three decimals as in the native CSV writer. These are not micro-averaged
    paper scores.
  verifiers:
    pose_constrained:
      kind: derived_deterministic_f1
      source: https://github.com/PhyBlock/PhyBlock/blob/da81ed9cad8184509aadb6f01af83d53e5c9d6fa/evaluate_block_construction.py
      definition_revision: da81ed9cad8184509aadb6f01af83d53e5c9d6fa
      index_pattern: block with index (\d+)
      decimal_places: 3
      grade_origin: recomputed_from_released_model_output
      extraction: Native message extraction precedence; all case-sensitive block-index matches are parsed,
        out-of-range indices are discarded. No new inference or simulation.
      function: validate_block_placement
      matching_fields:
      - type
      - color
      - euler
      check_dependencies: true
    topology_only:
      kind: derived_deterministic_f1
      source: https://github.com/PhyBlock/PhyBlock/blob/da81ed9cad8184509aadb6f01af83d53e5c9d6fa/evaluate_block_construction.py
      definition_revision: da81ed9cad8184509aadb6f01af83d53e5c9d6fa
      index_pattern: block with index (\d+)
      decimal_places: 3
      grade_origin: recomputed_from_released_model_output
      extraction: Native message extraction precedence; all case-sensitive block-index matches are parsed,
        out-of-range indices are discarded. No new inference or simulation.
      function: validate_block_placement_level1
      matching_fields:
      - type
      - color
      check_dependencies: false
      source_level: 2
      max_blocks_exclusive: 7
