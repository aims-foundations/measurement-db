# Structure: ../../benchmark_metadata_schema.yaml
# Replace every example value with evidence from the provider's own release.
# The benchmark slug is the containing folder name; do not repeat it here.
benchmark:
  name: Example Benchmark
  # Optional provider release identifier; quote numeric versions. Omit if unknown.
  # version: "2.0"
  one_line_description: >-
    Evaluates whether subjects can solve the released item bank, with each
    response recording the benchmark's scoring outcome.
  description: >-
    Example description of the evaluated subjects, item bank, and meaning of
    one response value.
  paper_url: https://arxiv.org/abs/YYMM.NNNNN
  data_source_url: https://example.invalid/provider/example-benchmark
  license: unknown
  modality:
    - text
  domain:
    - reasoning
  response_type: binary
  response_scale:
    kind: discrete
    values: [0, 1]
    meanings: {"0": failure, "1": success}  # Optional; use provider-defined meanings.
    direction: higher_is_better  # Use null or omit when unknown.
  # categorical is derived for binary/ordinal/Likert and continuous types.
  # For fraction, win_rate, or mixed types, explicitly set categorical: true/false.
  release_date: null  # Unknown; use a quoted "YYYY-MM" or "YYYY-MM-DD" when known.
  multi_single_turn: single_turn
  testing_condition: >-
    Describe fixed prompting, sampling, harness, environment, grader, and
    metric details. Put each released variation in the appropriate add_* call.
  subject_type: model
  item_type: question
  citation: |-
    @article{replace_me,
      title = {Replace with the provider's citation}
    }
  tags:
    - example
  release: private

build:
  contract_version: 2

sources:
  upstream:
    - name: results
      url: https://example.invalid/provider/per_item_results.json
      revision: null
      file: per_item_results.json
      # Replace with the upstream file's actual size and SHA-256.
      size: 0
      sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
