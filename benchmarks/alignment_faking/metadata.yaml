benchmark:
  name: Alignment Faking (RL)
  description: Published judgments of alignment-faking reasoning across model organisms,
    interventions and reinforcement-learning checkpoints in Anthropic's training-time
    mitigation study.
  testing_condition: Import every released evaluation record from 155 training runs.
    A subject is one named run at one training checkpoint; an item combines the original
    user question, free/paid tier and available system-prompt variant. Preserve published
    alignment-faking labels; missing judgments remain ungraded. The two named variants
    map to the complete prompt columns in Appendix A, including their examples. These are
    published prompt texts with normalized HTML paragraph boundaries, not exact historical
    API messages. Thirteen files omit their prompt variant; retain that unknown context
    without inferring a variant from run names. Exact user-message serialization, model
    checkpoint weights, decoding settings and the classifier's complete configuration are
    unavailable in the reviewed release. Repeated questions remain separate attempts.
    Traces preserve every native field, including auxiliary compliance/reward values and
    the original encoded transcript with its canary; no plaintext transcripts are republished.
  paper_url: https://alignment.anthropic.com/2025/alignment-faking-mitigations/
  data_source_url: https://huggingface.co/datasets/Anthropic/alignment-faking-rl
  subject_type: model
  item_type: text_question
  license: CC-BY-4.0; retain the released transcript obfuscation and canary as requested by the authors.
  citation: 'Gasteiger, J., Mikulik, V., Cunningham, H., Wagner, M., Wright, B., Uesato, J.,
    Benton, J., MacDiarmid, M., Roger, F., and Hubinger, E. (2025). Towards training-time
    mitigations for alignment faking in RL. Anthropic Alignment Science Blog, December 16.'
  tags: [alignment_faking, safety, reinforcement_learning]
  modality: [text]
  domain: [safety]
  response_type: binary
  response_scale:
    kind: discrete
    values: [0, 1]
    direction: unordered
    meanings:
      '0': The released classifier did not report alignment-faking reasoning.
      '1': The released classifier reported alignment-faking reasoning.
  categorical: true
  release_date: '2025-12-16'
  multi_single_turn: single_turn
