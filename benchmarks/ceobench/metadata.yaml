grading:
  rule: Import the published terminal run outcomes without rerunning the simulation. Each metric is a distinct grading
    protocol; histories are shared evidence, not additional trials.
  verifiers:
    protocol:
      kind: recorded_simulator_outcome
      source: https://ceobench.com/trajectory-viewer/
      scoring_reference: https://github.com/zlab-princeton/ceobench-src/blob/d2b7b32e5301a571b77f5f68bd1032adbcd5b464/docs/analyze_trajectory.md
      scope: Cash uses the published manifest statistic; native ledger values and release-display normalization
        are preserved separately.
    measures:
      reported_final_cash:
        rule: The manifest final_cash value in dollars, as published in the official viewer. Bankrupt runs are displayed
          as zero. Preserve separate raw/ledger cash values in the trace; do not substitute them for this published
          statistic.
        scale:
          kind: interval
          min: 0
          max: null
          direction: higher_is_better
      survived:
        rule: 'Use the released bankrupt Boolean: true gives 0 and false gives 1. Require a terminal complete or
          bankrupt run; do not infer survival from a partial cash history.'
        scale: &id001
          kind: discrete
          values:
          - 0
          - 1
          meanings:
            '0': The specified outcome was not achieved.
            '1': The specified outcome was achieved.
          direction: higher_is_better
      above_starting_cash:
        rule: 'Use the source-defined $1,000,000 starting balance: 1 if published final_cash is strictly greater,
          otherwise 0.'
        scale: *id001
