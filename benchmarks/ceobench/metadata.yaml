benchmark:
  name: CEO-Bench
  description: Language-model agents manage a simulated startup; retain published outcomes and complete released
    trajectories.
  testing_condition: The captured public viewer has 54 terminal runs for 18 model labels. Retain reported final
    cash and the two prior binary outcomes as distinct item grading protocols. The published task asks for 500 simulated
    days from $1M; the viewer normalizes some 497/504-day weekly endpoints to 500. Preserve both manifest and native
    fields without treating output-derived endpoints as task inputs. Four native ledger balances differ from displayed
    cash, including two zeroed bankrupt balances; both remain in traces. Items contain the published agent instructions,
    byte-identical to the earlier captured release. Exact historical system prompts, harness revisions, and most
    provider/inference settings are unavailable. Record only explicitly supplied settings. The website describes
    the updated quota mechanics. No simulator execution, new inference or regrading.
  paper_url: https://arxiv.org/abs/2606.18543
  data_source_url: https://ceobench.com/trajectory-viewer/
  subject_type: agent
  item_type: task
  license: No explicit data license found in the reviewed viewer or source repository.
  citation: 'Chen, Narasimhan and Liu (2026). CEO-Bench: Can Agents Play the Long Game? arXiv:2606.18543.'
  tags:
  - agent
  - simulation
  - long_horizon
  modality:
  - text
  domain:
  - agents_and_tool_use
  - finance
  - reasoning
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2026-06
  multi_single_turn: multi_turn
build:
  contract_version: 2
  parameters:
    paths:
      manifest: website/manifest.json
      trajectories: website/runs
      instructions: github/d2b7b32e5301a571b77f5f68bd1032adbcd5b464/public_sources/README.md
    scenario:
      raw_item_id: novamind_ceo_nominal_500_days
      nominal_horizon: '500'
      starting_cash: '1000000'
    settings:
      api_model: model_id
      source_provider: provider
      reasoning_effort: reasoning_effort
      simulator_provider: simulator_llm
