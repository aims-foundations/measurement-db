benchmark:
  name: BABILong
  description: Released language-model answers to bAbI reasoning questions embedded in long distractor passages.
  testing_condition: Curate all individual CSV predictions in the pinned HF release and the later GitHub release.
    Preserve each recorded prompt and generation configuration, including fine-tuned model labels. Overlapping identical
    release files and the Gemini export with refusals removed are copies, not independent attempts; retain the complete
    original attempts and source-copy associations. A complete run must match the ordered question, target and index
    in exactly one released input bank. Full matched passages are attached as UTF-8 context.txt assets. The content
    field retains the question and source prompt configuration. Seven Gemini 1.5 Pro 002 exports (700 attempts at
    1M/2M) have unresolved context correspondence; preserve their outputs and label input_context_status=released_context_unresolved,
    with no invented passage or input link. Published configuration and matched benchmark stimuli do not establish
    historical tokenizer serialization or endpoint revisions. Grades use the captured deterministic substring-label
    metric, including its normalization quirks. No model inference or new judge calls.
  paper_url: https://arxiv.org/abs/2406.10149
  data_source_url: https://huggingface.co/datasets/RMT-team/babilong_evals
  subject_type: model
  item_type: question
  license: 'Upstream code and PG-19: Apache-2.0. Underlying bAbI tasks: BSD; see the captured upstream license statements.'
  citation: 'Kuratov et al. (2024). BABILong: Testing the Limits of LLMs with Long Context Reasoning-in-a-Haystack.
    NeurIPS.'
  tags:
  - long_context
  - reasoning
  - retrieval
  - haystack
  modality:
  - text
  domain:
  - reasoning
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    meanings:
      '0': Answer fails the upstream substring-label comparison.
      '1': Answer passes the upstream substring-label comparison.
    direction: higher_is_better
  categorical: true
  release_date: 2024-06
  multi_single_turn: single_turn
