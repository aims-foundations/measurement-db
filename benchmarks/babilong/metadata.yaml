grading:
  rule: Lowercase the output, then keep its prefix before '.', '<context>', '<example>' and literal 'Question',
    in that order. Find task labels by substring and remove labels mentioned in the question. For a comma-containing
    target longer than three characters, require every comma-separated target and exactly that many detected labels.
    Otherwise require the whole target as the sole detected label. Empty outputs and refusals fail. Preserve the
    upstream uppercase-'Question' split after lowercasing and other substring-matching behavior.
  verifiers:
    answer:
      kind: upstream_label_match
      source: https://github.com/booydar/babilong/blob/7a6efee29f5cac03c3c410e6799c80fd2ffe3610/babilong/metrics.py
