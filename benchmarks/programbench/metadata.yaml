benchmark:
  release: public
  release_reason: "Public under the repository policy; this supersedes the earlier hold based only on unclear licensing. Source terms remain unresolved; no new license grant is implied."
  name: ProgramBench
  description: Published ProgramBench attempts to reconstruct executable behavior from a compiled program and its
    documentation, with native fractional behavioral-test scores and complete recorded agent trajectories.
  testing_condition: 'The versioned official registry identifies 25 submission runs. Keep every published trajectory,
    including the one attempt with no released evaluation. Preserve the two recorded initial messages and the exact
    named container environment; original historical container bytes are not included and no modern image or prompt
    is substituted. Model aliases, decoding and scaffold configurations come from the saved trajectory, not a current
    template. There are 28 distinct recorded configurations. Keep the original test verdicts and the registry ignore
    policy; test identifiers and grader versions are part of item grading identity. Source evaluation files can
    repeat test identifiers; the published map uses the last result for each identifier, as in the upstream packaging
    function. Original repeated test records remain in the trace. No model, compilation, container or grader is
    run. This is a newer source snapshot than the legacy 15-run website scrape: sixteen legacy cells lack corresponding
    records in these published forks and are retained in the archived old collection. Scores must be compared with
    their source snapshot and grading scope.'
  paper_url: https://arxiv.org/abs/2605.03546
  data_source_url: https://github.com/facebookresearch/ProgramBench
  subject_type: model configuration
  item_type: task
  license: The official registry declares MIT. The pinned result repositories do not declare redistribution terms;
    their captured inputs and derived tables remain local pending clarification. Referenced task programs and
    container contents retain their own upstream licenses.
  citation: "@misc{yang2026programbench,\n  title={ProgramBench: Can Language Models Rebuild Programs From Scratch?},\n\
    \  author={Yang, John and Lieret, Kilian and Ma, Jeffrey and Thakkar, Parth and Pedchenko, Dmitrii and Sootla,\
    \ Sten and McMilin, Emily and Yin, Pengcheng and Hou, Rui and Synnaeve, Gabriel and Yang, Diyi and Press, Ofir},\n\
    \  year={2026},\n  eprint={2605.03546},\n  archivePrefix={arXiv},\n}"
