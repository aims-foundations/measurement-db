benchmark:
  name: JudgeTuning LMSys human agreement
  description: Released evaluations of seven named LLM judges on 3000 LMSys paired-answer comparisons.
  testing_condition: Each observation evaluates one judge system on an existing LMSys battle using the published
    mean-over-games protocol. Six judges have two recorded answer orderings and Ours-medium has one. All 39000 recorded
    games contribute to 21000 observations. Preserve the instruction, both candidate answers, original human preference,
    saved prompts and completions. Empty completions retain their upstream parser-fallback preference. The official
    top_judge.csv identifies three tuned presets; Ours-tiny's base model and exact configuration are not released.
    Other runtime settings and immutable model checkpoints are not inferred from class defaults. PandaLM saves the
    instruction as its prompt field rather than its complete tokenized request, and applies upstream prompt truncation.
    The human-grade comparison uses all recorded outputs without new inference. This is a measurement collection
    on LMSys, not a new independent task set. Separate scaling experiments, validation matrices and Arena-Hard/AlpacaEval
    reference annotations are outside this seven-judge release. Length and random are non-LLM controls and are not
    subjects.
  paper_url: https://arxiv.org/abs/2501.17178
  data_source_url: https://huggingface.co/datasets/judge-arena/judge-arena-dataset
  subject_type: model
  item_type: paired_answer_comparison
  license: Apache-2.0 for JudgeTuning code. Original LMSys data retain their upstream terms.
  citation: Salinas, Swelam and Hutter. Tuning LLM Judge Design Decisions for 1/1000 of the Cost. ICML 2025.
  tags:
  - llm_as_judge
  - human_agreement
  - lmsys
  modality:
  - text
  domain:
  - preference_evaluation
  response_type: binary
  categorical: true
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': Judge preference disagrees with the human preference
      '1': Judge preference agrees with the human preference
  release_date: null
  multi_single_turn: single_turn
