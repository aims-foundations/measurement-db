grading:
  rule: Average the recorded judge preferences within each named judge and LMSys battle, then compare whether that
    mean and the human preference are below 0.5, equal to 0.5, or above 0.5. Return 1 for agreement and 0 otherwise.
    Preferences are already oriented to original output1/output2; do not invert swapped games again. The recorded
    parser fallback of 0.5 is retained, including empty completions. This measures agreement with the human preference,
    not correctness of either candidate answer.
  verifiers:
    human_agreement:
      kind: preference_side_agreement
      source: https://github.com/geoalgo/judgetuning/blob/f6b9cc5304837214dd927f4bdd52761f633b1548/judgetuning/script/evaluate_human_agreement.py
      function: error_judgement
      aggregation: Arithmetic mean of saved games within one named judge and instruction_index
      reference: Original LMSys human preference. 0 prefers output1, 0.5 is a tie, 1 prefers output2.
      csv_serialization: https://github.com/geoalgo/judgetuning/blob/f6b9cc5304837214dd927f4bdd52761f633b1548/judgetuning/experiment_tracker.py
      execution: Reconstruct the published deterministic agreement rule. Do not regenerate answers or judge completions.
