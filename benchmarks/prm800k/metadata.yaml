grading:
  rule: Retain the original human step rating on the native ordered scale -1, 0, +1. Use the phase-specific annotation
    instructions, any released MATH reference, problem and prior steps. An absent rating remains null, including
    pre-generated steps beyond the annotated prefix. Human-written replacement steps are not generated outcomes.
    Do not use the separate final-answer grader to replace process ratings or infer grades for unannotated steps.
  verifiers:
    phase1:
      kind: released_human_process_rating
      source: https://raw.githubusercontent.com/openai/prm800k/7ecc794703b2877f63226f2477a49b34f9b25163/prm800k/instructions/instructions_phase_1.pdf
      instructions_sha256: cbb66c8870c4833b9a391ba55933c21d9b35c88fc1928bb2bdae47f69745902c
      phase: phase1
      field: label.steps[step].completions[candidate].rating
    phase2:
      kind: released_human_process_rating
      source: https://raw.githubusercontent.com/openai/prm800k/7ecc794703b2877f63226f2477a49b34f9b25163/prm800k/instructions/instructions_phase_2.pdf
