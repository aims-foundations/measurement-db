benchmark:
  description: Released human process ratings of a fixed GPT-4-derived research generator on MATH problems.
  testing_condition: One fixed research generator is described by the paper; generation is an annotation-selection
    round, not a model identifier. Preserve every released model candidate, its native -1/0/+1 or unavailable rating,
    and original pre-generated steps lacking a candidate rating as null. Phase 1 prefixes follow the selected candidate
    or human replacement; replacements are context, never model responses. Phase 2 prefixes follow the recorded
    pre-generated solution, including where annotations omit a selection. Candidate and pre-generated text differences
    remain explicit; do not transfer grades between different strings. Quality-control and screening judgments remain
    present and can repeat a generated solution; response rows count released judgments/steps, not independent inference
    calls. Annotation timestamps and rounds are provenance, not model release dates or inference settings. Exact
    wire prompts, decoding settings and checkpoint identifiers are not released. Keep only the reference fields
    supplied upstream; some records have neither an answer nor a solution. Items preserve the known problem and
    prior solution steps without including the current answer. No model, human reannotation or final-answer grader
    is executed.
  paper_url: https://arxiv.org/abs/2305.20050
  data_source_url: https://github.com/openai/prm800k/tree/7ecc794703b2877f63226f2477a49b34f9b25163
  subject_type: model configuration
  item_type: math problem and prior solution prefix
  license: MIT; retain the original upstream LICENSE with the released data.
  citation: "@misc{lightman2023letsverifystepstep,\n      title={Let's Verify Step by Step},\n      author={Hunter\
    \ Lightman and Vineet Kosaraju and Yura Burda and Harri Edwards and Bowen Baker and Teddy Lee and Jan Leike\
    \ and John Schulman and Ilya Sutskever and Karl Cobbe},\n      year={2023},\n      eprint={2305.20050},\n  \
    \    archivePrefix={arXiv},\n      primaryClass={cs.LG},\n      url={https://arxiv.org/abs/2305.20050},\n}"
  tags:
  - reasoning
  modality:
  - text
  domain:
  - mathematics
  - reward_modeling
  response_type: ordinal
  response_scale:
    kind: discrete
    values:
    - -1
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '-1': 'Bad: incorrect, unreasonable, inappropriate, or insufficiently explained.'
      '0': 'Okay: a reasonable step that does not substantially advance the solution; retain the native neutral
        rating.'
      '1': 'Great: a correct, reasonable and useful solution step under the phase-specific human instructions.'
  categorical: true
  release_date: 2023-05
  name: PRM800K
  version: 7ecc794703b2877f63226f2477a49b34f9b25163
  multi_single_turn: multi_turn
  granularity: item
