benchmark:
  name: MMDocRAG
  description: MMDocRAG tests whether models can answer questions about documents by weaving retrieved
    text and images into a cited answer, which a judge model rates for fluency, citation quality, coherence,
    reasoning and factuality.
  testing_condition: 'test_condition is the run config "{mode}/quotes{N}": mode is "pure-text" (quotes
    as text input) or "multimodal" (quotes as interleaved text+image for VLMs), and N (15 or 20) is the
    number of retrieved quotes given as context. Items are individual questions (q_id); response is the
    per-item LLM-as-judge answer-quality score (mean of Fluency, Citation Quality, Text-Image Coherence,
    Reasoning Logic, Factuality) normalized to [0, 1] (divided by 5). The judge is gpt-4o-2024-08-06 for
    pure-text answers and the same model given the cited images for multimodal answers, prompted with
    prompt_bank/evaluation_answer.txt; each dimension is graded 0-5, where 0 is "completely fails to meet
    the requirement" and is the grade an empty or failed answer receives. Responses are left unobserved
    (None) for the 0.04% of rows whose judge output did not yield all five dimensions.'
  paper_url: https://openreview.net/forum?id=W4b3v9jx1p
  data_source_url: https://github.com/MMDocRAG/MMDocRAG
  subject_type: model
  item_type: task
  license: CC-BY-NC-4.0
