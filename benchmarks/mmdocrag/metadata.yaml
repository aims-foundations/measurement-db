benchmark:
  name: MMDocRAG
  description: MMDocRAG tests whether models can answer questions about documents by weaving retrieved text and
    images into a cited answer, which a judge model rates for fluency, citation quality, coherence, reasoning and
    factuality.
  testing_condition: Each released quality dimension is an item within its source-question testlet. Import the native
    0–5 dimension value, without averaging or thresholding. Invalid or missing dimensions have no inferred grade.
    Preserve the original normalized aggregate, complete judge record and available answer in a shared attempt.
    Test conditions retain modality and number of retrieved quotes.
  paper_url: https://openreview.net/forum?id=W4b3v9jx1p
  data_source_url: https://github.com/MMDocRAG/MMDocRAG
  subject_type: model
  item_type: quality_dimension_within_question_testlet
  license: CC-BY-NC-4.0
  citation: "@inproceedings{dong2025mmdocrag,\n  title={Benchmarking Retrieval-Augmented Multimodal Generation for\
    \ Document Question Answering},\n  author={Dong, Kuicai and Chang, Yujing and Huang, Shijie and Wang, Yasheng\
    \ and Tang, Ruiming and Liu, Yong},\n  booktitle={NeurIPS 2025 Datasets and Benchmarks Track},\n  year={2025},\n\
    }"
  tags:
  - multimodal_rag
  - document_qa
  - vlm
  - retrieval
  - evidence_selection
  modality:
  - image
  - text
  domain:
  - general
  - reasoning
  multi_single_turn: single_turn
  response_type: continuous_bounded
  response_scale:
    kind: interval
    min: 0
    max: 5
    direction: higher_is_better
  categorical: false
  release_date: 2025-12
  release: public
build:
  contract_version: 2
  parameters:
    layout:
      preferred_gold: evaluation_20.jsonl
      fallback_gold: evaluation_15.jsonl
      evaluation_directory: eval
      trace_directory: resp
    subject_aliases:
      Internvl3-38B: internvl3-38b
      Internvl3-78B: internvl3-78b
    released_variants:
      qvq-max-no-think: no-think
      qwen3-14b-no-think: no-think
      qwen3-30b-a3b-no-think: no-think
      qwen3-4b-no-think: no-think
      qwen3-8b-no-think: no-think
    patterns:
      evaluation: ^(?P<model>.+?)_(?P<mode>pure-text|multimodal)(?:_response)?_quotes(?P<quotes>\d+)(?:_llm-judge\.jsonl|\.jsonl(?:_evaluation\.jsonl)?)$
      dimension_noise: '[^a-z0-9]'
sources:
  upstream:
  - url: https://github.com/MMDocRAG/MMDocRAG
    revision: 2fd7505c6a576376b4a92aafaff6d87494765bb7
    name: release
    files:
    - match: dataset/(?P<name>evaluation_(?:15|20)\.jsonl)
      path: '{name}'
    - match: response/evaluation/(?P<name>[^/]+\.jsonl)
      path: eval/{name}
    - match: response/(?P<name>[^/]+\.jsonl)
      path: resp/{name}
grading:
  rule: Mean of the five 0-5 scores for Fluency, Citation Quality, Text-Image Coherence, Reasoning Logic, and
    Factuality, divided by 5. A missing or invalid dimension leaves the grade unavailable.
  verifiers:
    release:
      judged_by: llm
      spec: Provider MMDocRAG evaluation using prompt_bank/evaluation_answer.txt; exact judge configuration
        is not attributed per released cell. Preserve the released dimension grades without rejudging.
      dimensions:
      - Fluency
      - Citation Quality
      - Text-Image Coherence
      - Reasoning Logic
      - Factuality
      maximum: 5
