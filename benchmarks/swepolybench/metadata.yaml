benchmark:
  description: Recorded coding-agent attempts on multilingual repository issues, including full and Verified task
    definitions.
  testing_condition: Each named post-patch test becomes an item within the original repository-issue testlet. Repeated
    identical names collapse; names recorded as both passed and failed remain ungraded because occurrence identity
    is unavailable. Tests missing from a report are not fabricated as failures. Attempts without named tests retain
    the released overall verdict. Full predictions, test lists, task checks and trajectories are preserved on shared
    attempts; the original resolved flag remains separate from the average test grade.
  paper_url: https://arxiv.org/abs/2504.08703
  data_source_url: https://github.com/amazon-science/SWE-PolyBench
  subject_type: agent
  item_type: test_within_repository_issue_testlet
  license: CC-BY-NC-4.0 for the captured submission branch; MIT for the official task banks and evaluation harness.
  citation: "@misc{rashid2025swepolybenchmultilanguagebenchmarkrepository,\n      title={SWE-PolyBench: A multi-language\
    \ benchmark for repository level evaluation of coding agents},\n      author={Muhammad Shihab Rashid and Christian\
    \ Bock and Yuan Zhuang and Alexander Buchholz and Tim Esler and Simon Valentin and Luca Franceschi and Martin\
    \ Wistuba and Prabhu Teja Sivaprasad and Woo Jung Kim and Anoop Deoras and Giovanni Zappella and Laurent Callot},\n\
    \      year={2025},\n      eprint={2504.08703},\n      archivePrefix={arXiv},\n      primaryClass={cs.SE},\n\
    \      url={https://arxiv.org/abs/2504.08703},\n}"
  tags:
  - coding
  modality:
  - text
  domain:
  - software_engineering
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: higher_is_better
    meanings:
      '0': failure
      '1': success
  categorical: true
  release_date: 2025-04
  release: public
  name: SWE-PolyBench
  version: submission:e7062f4a848ca7775bc1c1313f7aa419bd6a3ec1
  one_line_description: Evaluates coding-agent issue resolution using repository tests.
  multi_single_turn: multi_turn
build:
  contract_version: 2
  parameters:
    subject_labels:
      Prometheus-v1.2 + GPT-5: gpt-5
      Atlassian Rovo Dev (2025-12-08): Atlassian Rovo Dev
      Kodah: gpt-5-mini
      HMigBot: claude-opus-4-8
    subject_harnesses:
      iSWE-Agent: iSWE-Agent
      Prometheus-v1.2 + GPT-5: Prometheus
      Atlassian Rovo Dev (2025-12-08): Atlassian Rovo Dev
      Kodah: Kodah
      HMigBot: HMigBot
    subject_label_evidence:
      source: 'amazon-science/SWE-PolyBench@e7062f4a848ca7775bc1c1313f7aa419bd6a3ec1: submission metadata names
        and README files for 20260430_kodah_gpt-5-mini and 20260623_migbot_claude-opus-4-8.'
      scope: Separate the declared underlying model from its agent harness. Keep iSWE-Agent and Rovo Dev as agent
        identities because their captured READMEs do not identify one underlying model. Preserve original submissions
        and labels.
    layout:
      release: release
    labels:
      harness: SWE-PolyBench published agent submissions
      configuration_scope: Literal source submission. Historical settings not recorded in the original metadata
        or trajectories are unknown.
      task_version_scope: Pinned full or Verified task definition. Exact evaluator and task-bank revisions for each
        historical run are not fully recorded.
    task_banks:
      PB: bank/test.csv
      PBVerified: bank_verified/test.csv
    patterns:
      instance_id: ([^/]+?__[^/]+?-\d+)(?=/|\.|$)
sources:
  upstream:
  - name: release
