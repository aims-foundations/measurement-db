grading:
  rule: 'Import the explicit native resolved boolean for an observed attempt: success is 1 and failure is 0. The
    original evaluator requires every fail-to-pass test to pass and no pass-to-pass test to fail. A missing result
    remains ungraded. Keep predictions and trajectories that ended without a patch as attempted failures when the
    source supplies that verdict. Default result files without independent attempt evidence do not establish a model
    attempt.'
  verifiers:
    published_report:
      kind: original_repository_tests
      source: https://github.com/amazon-science/SWE-PolyBench/blob/9c836c5d7f3cb991934132b77d29e6941d912a07/src/poly_bench_evaluation/scoring.py
      function: instance_level_scoring
      rule: 'Import the explicit native resolved boolean for an observed attempt: success is 1 and failure is 0.
        The original evaluator requires every fail-to-pass test to pass and no pass-to-pass test to fail. A missing
        result remains ungraded. Keep predictions and trajectories that ended without a patch as attempted failures
        when the source supplies that verdict. Default result files without independent attempt evidence do not
        establish a model attempt.'
      task_fields:
      - repo
      - base_commit
      - test_patch
      - Dockerfile
      - F2P
      - P2P
      - F2F
      - test_command
