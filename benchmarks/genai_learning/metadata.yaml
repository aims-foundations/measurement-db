benchmark:
  name: GenAI Learning
  description: Original student practice and exam grades from a mathematics tutoring study, with separately annotated
    standalone GPT-4 answers.
  testing_condition: A four-session study in grades 9–11 of a Turkish high school during fall 2023–2024. Preserve
    all released participants, including honors students, rather than reproducing the paper's restricted regression
    sample. The 15,423 practice grades are binary; 13,020 exam grades include partial credit. Assigned GPT Base
    and GPT Tutor access applies to practice only; exams are closed-book and closed-laptop for every arm. GPT-4
    contributes 570 separately annotated standalone answers. Published Appendix D worksheets supply complete practice
    and exam stimuli as PDF attachments, with explicit part and question locators. These English materials differ
    in places from the question CSV used by the published GPT script, so human and GPT input variants remain distinct.
    Historical classroom handouts, handwritten student answers and full per-item grading rubrics are unavailable.
    Original transcript characters, system messages, timestamps and conversation boundaries are preserved without
    heuristic repairs. Chats are interaction evidence, not the graded handwritten response. Unmatched chats remain
    raw-only. No fresh model calls or regrading.
  paper_url: https://www.pnas.org/doi/10.1073/pnas.2422633122
  data_source_url: https://github.com/obastani/GenAICanHarmLearning
  subject_type: human_and_model
  item_type: math_problem
  license: No explicit license in the captured repository. Authors publicly share anonymized data and code for research;
    see the original source.
  citation: 'Bastani, H., Bastani, O., Sungu, A., Ge, H., Kabakci, O., and Mariman, R. (2025). Generative AI without
    guardrails can harm learning: Evidence from high school mathematics. PNAS 122, e2422633122.'
  tags:
  - education
  - human_subjects
  - mathematics
  - tutoring
  modality:
  - text
  - document
  domain:
  - education
  - mathematics
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: '2025-06-25'
  multi_single_turn: multi_turn
