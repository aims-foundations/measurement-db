      subject_kind: human student
      harness: School study
      configuration_scope: Assigned study arm is participant history. Assistance applies to practice only. Exam
        responses are unassisted. Assignment does not establish compliance.
    model_features:
      subject_kind: language model
      harness: GenAICanHarmLearning/check_gpt_accuracy.py
      model_identifier: gpt-4
      input_scope: Published generation script using Latin-1 question CSV decoding. Historical request logs and
        exact model snapshot are unavailable.
    prompt:
      system_template: 'You are ChatGPT, a large language model trained by OpenAI.                         Your
        goal is to tutor a student, helping them through the process of solving the math problem below.                             Please
        follow the student''s instructions carefully. Write your answers in Github supported Markdown.                                Wrap
        inline math expressions with ''$'' and blcok math expressions with ''n$$n''.                                    When
        write numbered list, use ''First,'' instead of use ''1.''. Now you can help with this problem:                                         {question}.'
      user: What is the answer
    gpt_grades:
      correct: '1'
      logical: '0'
      arithmetic: '0'
    stimulus:
      instruction: Answer the question at position {position} in Part {part} of the attached grade {grade}, session
        {session} worksheet (printed question number {number}).
      scope: Published English session material. The original classroom handouts are not independently captured.
        Select the indicated part and printed question number. The attachment includes the other questions in that
        session.
