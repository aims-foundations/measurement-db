grading:
  rule: Preserve the source human grade without regrading. Practice and standalone GPT correctness are binary; exam
    scores retain fractional credit. Per-item response scales distinguish these protocols. Do not treat tutor system
    prompts as student responses or extract their solutions heuristically.
  verifiers:
    practice:
      kind: blinded_human_grading
      source: https://hamsabastani.github.io/education_llm.pdf
      field: main_regressions/problem_part2.csv:Score
      protocol: Appendix A.5. Preserve the released binary practice grade. Grader codes are retained per response;
        handwritten work and the complete rubric are not released.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '0': No practice credit
          '1': Full practice credit
    exam:
      kind: blinded_human_grading
      source: https://hamsabastani.github.io/education_llm.pdf
      field: main_regressions/problem_part3.csv:Score
      protocol: Appendix A.5 and B.2. Preserve the normalized exam grade, including fractional credit. All study
        arms take this exam without assistance. Item-specific scoring rubrics and handwritten work are not released.
      response_scale:
        kind: interval
        min: 0
        max: 1
        direction: higher_is_better
    gpt:
      kind: human_error_annotation
      source: https://hamsabastani.github.io/education_llm.pdf
      field: main_regressions/gpt_answers_full.csv:g0 through g9
      protocol: Appendix C.1. Map correct to 1, logical and arithmetic errors to 0. Retain the original category
        and answer without repairing its characters.
      response_scale:
        kind: discrete
        values:
        - 0
        - 1
        direction: higher_is_better
        meanings:
          '0': Logical or arithmetic error
          '1': Correct answer
