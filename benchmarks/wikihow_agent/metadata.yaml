benchmark:
  description: Released completion outcomes for multi-model teacher–learner conversations grounded in WikiHow tutorials.
  testing_condition: Import the twelve released corrected conversation files, preserving all 171,412 conversations
    and their completion flags. The eight released rubric scores are separate items within each tutorial testlet; zero defaults and scores outside the declared 1-to-5 range remain ungraded. Complete native values and judge texts are preserved on the execution. A subject is the recorded teacher, learner and evaluator configuration; the learner
    model is its display label. The released configuration files document model aliases and reference settings,
    but the exact historical checkpoint and command-line overrides are not recorded. Completion denotes an emitted
    marker, not independently verified teaching quality. No new conversations or grades are generated.
  paper_url: https://arxiv.org/abs/2507.05528
  data_source_url: https://huggingface.co/datasets/Jiahuan/WikihowAgentDataset
  subject_type: model
  item_type: task
  license: unknown
  citation: "@article{pei2025wikihowagent,\n  title={Conversational Education at Scale: A Multi-LLM Agent Workflow\
    \ for Procedural Learning and Pedagogic Quality Assessment},\n  author={Pei, Jiahuan and Ye, Fanghua and Sun,\
    \ Xin and Deng, Wentao and Hindriks, Koen and Wang, Junxiao},\n  journal={arXiv preprint arXiv:2507.05528},\n\
    \  year={2025},\n  url={https://arxiv.org/abs/2507.05528},\n}"
  tags:
  - education
  - tutoring
  - multi_agent
  - procedural_learning
  - wikihow
  modality:
  - text
  domain:
  - education
  response_type: mixed
  response_scale:
    kind: mixed
  categorical: false
  release_date: 2025-07
  release: public
  name: WikiHowAgent
  multi_single_turn: multi_turn
build:
  contract_version: 2
  parameters:
    subject_labels:
      deepseek-llm: deepseek-llm-7b
      gemma: gemma-7b
      llama3: Llama-3-8B
      olmo2: OLMo-2-7B
      openchat: OpenChat-7B
      qwen2: Qwen2-7B
      phi4: phi-4
    subject_label_evidence:
      source: https://arxiv.org/html/2507.05528v2#S5 and appendix A identify the seven open model families and
        sizes used by the released configurations.
      scope: Use paper-supported model families and sizes. Preserve complete teacher/learner/evaluator configurations;
        exact historical checkpoint hashes remain unknown.
    layout:
      conversations: conversations/T-*_corrected.json
      configurations: protocol/conf/*.yaml
      rubrics: protocol/data/evaluation_rubrics.json
    labels:
      harness: WikiHowAgent
sources:
  upstream:
  - name: conversations
    url: https://huggingface.co/datasets/Jiahuan/WikihowAgentDataset
    revision: 2c672001151e566e31c6cd964ea9b8a03ad8d394
    files:
    - match: conversations/T-[^/]+_corrected\.json
      path: '{path}'
  - name: protocol_reference
    url: https://github.com/Jiahuan-Pei/WikiHowAgent
    revision: c61e4b0d7ba635956e59753fd59c9db65f289a5e
    files:
    - match: data/evaluation_rubrics\.json|README\.md|LICENSE|main\.py|config\.py|Agents/evaluator_agent\.py|Agents/teacher_agent\.py|Agents/learner_agent\.py|manager/multiple_agent_manager_workflow\.py|manager/multiple_agent_manager_agentic\.py|utils/post_result_correction\.py|conf/ollama\-deepseek\.yaml|conf/ollama\-gemma\.yaml|conf/ollama\-llama3\.yaml|conf/ollama\-olmo2\.yaml|conf/ollama\-openchat\.yaml|conf/ollama\-phi4\.yaml|conf/ollama\-qwen2\.yaml
      path: protocol/{path}
grading:
  verifiers:
    completion:
      field: Completion Achieved
      rule: The released completion flag is one when any conversation line contains FINISHED or The tutorial is
        now complete, and zero otherwise. This marker does not establish pedagogic quality.
      spec:
        kind: published_completion_flag
        source: https://github.com/Jiahuan-Pei/WikiHowAgent/blob/c61e4b0d7ba635956e59753fd59c9db65f289a5e/Agents/evaluator_agent.py
        function: ConversationEvaluator.check_completion
        implementation: int(any("FINISHED" in line or "The tutorial is now complete" in line for line in conversation))
        corrected_release: Import the released flags unchanged; independently compare every flag with its original
          conversation. The original completion flag is retained alongside the separate released rubric judgments.
    rubric:
      kind: published_corrected_rubric
      rule: Import the corrected native criterion score on its recorded 1-to-5 scale. The correction can produce fractional scores, which remain fractional. Default zeros and out-of-range values have no valid rubric grade; retain their original values and judge text on the attempt.
      source: https://github.com/Jiahuan-Pei/WikiHowAgent/blob/c61e4b0d7ba635956e59753fd59c9db65f289a5e/utils/post_result_correction.py
