benchmark:
  name: HarmBench
  description: Released model generations and native attack-success judgments from the HarmBench text and multimodal
    playground.
  testing_condition: 'Import the released playground observations, not new evaluations. The standard, contextual
    and copyright directories contain identical combined result files: retain one copy and record all aliases. The
    task is the actual released test_case, including the complete adversarial image for multimodal attempts. Behavior
    descriptions and grading context belong to the grading criterion. Each target-model generation can have a primary
    HarmBench judgment and a secondary AdvBench refusal-string judgment; these are annotations of one generation,
    not independent model trials. Missing secondary annotations remain absent. Native 1 means attack success, so
    lower is better for target-model robustness. Copyright primary labels use MinHash matching rather than an LLM
    judge. Preserve complete released generations; the upstream evaluation pipeline may already have truncated them.
    The captured author code documents grading but does not establish the exact historical execution revision or
    model inference settings. The separate classifier-validation collection is retained in the raw author archive,
    outside these measurement tables: it overlaps playground outputs, has missing model basenames and three behavior
    IDs absent from the captured current bank, and needs separate annotation-identity reconciliation. No generated
    attack code or upstream classifiers are executed.'
  paper_url: https://arxiv.org/abs/2402.04249
  data_source_url: https://github.com/justinphan3110cais/harmbench_website/tree/data/playground_data
  subject_type: model
  item_type: task
  license: Author code is MIT-licensed. The website data archive has no separate dataset license; retain the original
    attribution and the upstream terms of included materials.
  citation: 'Mazeika et al. (2024). HarmBench: A Standardized Evaluation Framework for Automated Red Teaming and
    Robust Refusal. ICML.'
  tags:
  - safety
  - red_teaming
  - robust_refusal
  modality:
  - text
  - image
  domain:
  - safety
  response_type: binary
  categorical: true
  release_date: '2024-02-06'
  multi_single_turn: single_turn
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: lower_is_better
    meanings:
      '0': This evaluator did not mark attack success
      '1': This evaluator marked attack success
build:
  contract_version: 2
  parameters:
    paths:
      website_archive: website-data.tar.gz
      website_root: harmbench_website-894c6021d1c3334d5ac8bc15faff9d093a27032a
      author_archive: author.tar.gz
      author_root: HarmBench-8e1604d1171fe8a48d8febecd22f600e462bdcdd
      playground: playground_data
    banks:
      text: data/behavior_datasets/harmbench_behaviors_text_all.csv
      multimodal: data/behavior_datasets/harmbench_behaviors_multimodal_all.csv
    subject_features:
      harness: HarmBench published playground results
      configuration_scope: Source model key retained. Exact generation settings and historical checkpoint revisions
        are not specified per result.
    presentation:
      input_scope: The original exported test_case. No inferred system prompt or chat template.
      trace_scope: One published generation with multiple native grading annotations. Directory aliases are copies,
        not independent runs.
