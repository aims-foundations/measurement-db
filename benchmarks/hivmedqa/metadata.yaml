benchmark:
  name: HIVMedQA
  description: Published HIV question-answering runs and five clinical judge ratings, retaining reference-guided,
    reference-free and reference-paraphrasing conditions separately.
  testing_condition: 'Preserve all 3465 original release records as aliases of their corresponding author runs,
    not additional trials. The rephrased-reference controls were generated by GPT-4o with the reference answer supplied:
    retain their complete generation prompts and mark them as reference_paraphrasing rather than unaided question
    answering. Include the expanded author task bank, RAG runs and saved reference-free ratings. Native iteration
    numbers remain trials. Each clinical dimension and grading protocol contributes a distinct item grading criterion.
    Missing judge outputs, replies without JSON and nonnumeric interval grades remain null with their original evidence;
    valid zero scores are retained. Historical CSV records recover Gemini answers whose current raw JSON lists are
    empty, with exact agreement of all overlapping saved scores. Source association keys ignore only whitespace
    and straight quotation marks, while original text remains preserved. The separate questions.csv contains damaged
    Unicode and is not used to replace recorded questions. Recorded retrieval references are included for RAG inputs;
    full retrieved passages and per-run system/chat serialization are unavailable. Complete answers, judge prompts,
    judge replies and source aliases are retained where released. No new inference or regrading.'
  paper_url: https://arxiv.org/abs/2507.18143
  data_source_url: https://zenodo.org/records/15868085
  subject_type: model
  item_type: task
  license: CC-BY-4.0
  citation: 'Cardenal-Antolin et al. (2025). HIVMedQA: Benchmarking large language models for HIV medical decision
    support. arXiv:2507.18143.'
  tags:
  - medical
  - clinical
  - hiv
  - llm_as_a_judge
  modality:
  - text
  domain:
  - medicine
  response_type: continuous
  categorical: false
  release_date: 2025-07
  multi_single_turn: single_turn
  response_scale:
    kind: interval
    min: 0
    max: 5
    direction: higher_is_better
