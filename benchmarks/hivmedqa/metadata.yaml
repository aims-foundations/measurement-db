        s answer is mostly accurate, with only minor lapses in wording or depth, but no significant errors in interpretation.\n\
        \       - 4-5: The student\u2019s answer shows complete and precise understanding with no evidence of misinterpretation.\n\
        \    \n    2. Reasoning Steps\n       - Deduct points for any logical fallacies, unclear rationale, or steps\
