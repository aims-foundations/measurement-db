benchmark:
  name: Emoji Attack (released EasyJailbreak results)
  description: Original EasyJailbreak attack inputs, model outputs and binary success annotations redistributed
    with Emoji Attack.
  testing_condition: These are the EasyJailbreak experimental records redistributed in the Emoji Attack repository,
    not the Emoji Attack paper's separate emoji-insertion or judge-detection outcomes. Preserve one attempt per
    original JSONL row, including four empty queries and two empty jailbreak prompts. Item content is a JSON descriptor
    containing the complete released query, jailbreak_prompt and translated_query components; it does not assert
    an exact rendered API request or supply unrecorded conversation history. Different prompt components remain
    distinct items. The original and decoded outputs remain in the complete native record. A value of 1 is a reported
    jailbreak success, so lower is better for target-model safety. The record does not identify its grading model
    or historical evaluator version; preserve eval_results without assigning one from the repository's later judge
    implementations. The two file labels intern7b and internlm7b denote the sole InternLM target in the original
    ten-model study; other model labels remain as released, without guessing checkpoint versions. Retain original
    file positions and repeated attempts.
  paper_url: https://arxiv.org/abs/2411.01077
  data_source_url: https://github.com/zhipeng-wei/EmojiAttack
  subject_type: model
  item_type: task
  license: No explicit license file in the captured Emoji Attack repository. EasyJailbreak reference code is GPL-3.0;
    this does not establish a separate license for the redistributed result files.
  citation: 'Wei, Z., Liu, Y., and Erichson, N. B. Emoji Attack: Enhancing Jailbreak Attacks Against Judge LLM Detection.
    ICML (2025). Original result context: Zhou, W. et al. EasyJailbreak: A Unified Framework for Jailbreaking Large
    Language Models. arXiv:2403.12171 (2024).'
  tags:
  - safety
  - jailbreak
  - easyjailbreak
  - released_annotations
  modality:
  - text
  domain:
  - safety
  response_type: binary
  response_scale:
    kind: discrete
    values:
    - 0
    - 1
    direction: lower_is_better
    meanings:
      '0': The original annotation does not mark this attempt as a successful jailbreak.
      '1': The original annotation marks a successful jailbreak of the target model.
  categorical: true
  release_date: 2024-11
  multi_single_turn: single_turn
build:
  contract_version: 2
  parameters:
    paths:
      results: release/EasyJailbreaking-Results
    model_aliases:
      intern7b: internlm7b
    subject_features:
      harness: EasyJailbreak
      configuration_scope: Released target label only. Exact checkpoint version and request settings are not recorded.
    item_features:
      input_scope: Complete released input components. Rendered request and prior conversation are not established.
sources:
  upstream:
  - name: release
    url: https://github.com/zhipeng-wei/EmojiAttack
    revision: 1a81c327b74f7c23911b7d1c2ec2c537dc29f27a
    files:
    - match: (?:ReadMe\.md|EasyJailbreaking-Results/[^/]+/[^/]+\.jsonl)
      path: release/{path}
  - name: reference
    url: https://github.com/EasyJailbreak/EasyJailbreak
    revision: 6731d6f627d43895f59ef03c6ce04348746659e6
    files:
    - match: (?:README\.md|LICENSE|easyjailbreak/metrics/Evaluator/.*\.py)
      path: reference-code/{path}
grading:
  rule: Preserve the sole eval_results element. Boolean true or the literal string True maps to 1; false or False
    maps to 0. Do not infer a grade from answer text. This is recorded jailbreak success, not a fresh human safety
    assessment.
  verifiers:
    published:
      kind: released_binary_success_annotation
      field: eval_results[0]
      source: https://github.com/zhipeng-wei/EmojiAttack/tree/1a81c327b74f7c23911b7d1c2ec2c537dc29f27a/EasyJailbreaking-Results
      scope: Original grader identity and version are not stored per record. Keep annotations separate by released
        attack family; the captured EasyJailbreak evaluator code is explanatory context, not a claim about the exact
        historical invocation.
