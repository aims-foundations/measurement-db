$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aimslab.stanford.edu/measurement-db/benchmark_metadata_schema.yaml
title: Measurement-DB benchmark metadata
description: >-
  Authoring contract for benchmarks/<slug>/metadata.yaml. Contract 2 uses compact
  upstream references and named file selections; downloads use the shared loader.
  Contract 1 is retained only for unmigrated builders.
type: object
additionalProperties: false
required:
  - benchmark
  - build
allOf:
  - if:
      properties:
        build:
          properties:
            contract_version: {const: 2}
    then:
      required: [sources]
      properties:
        sources:
          $ref: "#/$defs/snapshot_sources"
        archive_layout: {not: {}}
        expectations: {not: {}}
        validation: {not: {}}
    else:
      properties:
        sources:
          $ref: "#/$defs/sources_mapping"
properties:
  benchmark:
    type: object
    additionalProperties: false
    required:
      - name
      - description
      - paper_url
      - data_source_url
      - license
      - modality
      - domain
      - response_type
      - response_scale
      - release_date
      - multi_single_turn
    allOf:
      - if:
          properties:
            response_type: {enum: [binary, error_presence, likert_5, likert_10, ordinal]}
        then:
          properties:
            categorical: {const: true}
      - if:
          properties:
            response_type: {enum: [continuous, continuous_bounded, continuous_unbounded]}
        then:
          properties:
            categorical: {const: false}
      - if:
          properties:
            response_type: {enum: [fraction, win_rate, mixed]}
        then:
          required: [categorical]
    properties:
      name:
        $ref: "#/$defs/nonempty_string"
      version:
        description: >-
          Optional upstream benchmark release identifier, copied verbatim to
          benchmarks.parquet.version. Omit or use null when unavailable.
          Distinct from the table schema, build contract, and source revisions.
        anyOf:
          - $ref: "#/$defs/nonempty_string"
          - type: "null"
      one_line_description:
        $ref: "#/$defs/one_line_description"
      description:
        $ref: "#/$defs/nonempty_string"
      paper_url:
        type:
          - string
          - "null"
      data_source_url:
        $ref: "#/$defs/nonempty_string"
      license:
        $ref: "#/$defs/nonempty_string"
      modality:
        $ref: "#/$defs/nonempty_string_list"
      domain:
        $ref: "#/$defs/nonempty_string_list"
      response_type:
        enum:
          - binary
          - likert_5
          - likert_10
          - win_rate
          - ordinal
          - fraction
          - continuous_bounded
          - continuous_unbounded
          - continuous
          - error_presence
          - mixed
      response_scale:
        $ref: "#/$defs/response_scale"
      categorical:
        description: >-
          Optional for binary/error-presence, Likert, ordinal, or continuous
          types: the builder derives the classification and rejects conflicts.
          Fractions, rates, and mixed scales require an explicit boolean.
        type: boolean
      release_date:
        description: >-
          Known benchmark release date as a quoted YYYY-MM or YYYY-MM-DD string;
          use explicit null when unknown. Full dates must be valid calendar dates.
        anyOf:
          - type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?$'
          - type: "null"
      multi_single_turn:
        enum:
          - single_turn
          - multi_turn
          - multi_turn, single_turn
      granularity:
        enum:
          - item
          - aggregate
          - not_released
      release:
        enum:
          - public
          - private
      benchmark_features:
        type:
          - object
          - string
          - "null"
      testing_condition:
        type:
          - string
          - "null"
      subject_type:
        type:
          - string
          - "null"
      item_type:
        type:
          - string
          - "null"
      citation:
        type:
          - string
          - "null"
      tags:
        $ref: "#/$defs/nonempty_string_list"

  build:
    type: object
    additionalProperties: false
    required:
      - contract_version
    properties:
      contract_version:
        enum: [1, 2]
      parameters:
        description: >-
          Optional named groups of string constants used by the builder, such as
          source paths, marker patterns, and verbatim prompt text. Transformations
          remain in build.py; these values are data, not executable instructions.
        type: object
        minProperties: 1
        propertyNames:
          $ref: "#/$defs/nonempty_string"
        additionalProperties:
          type: object
          minProperties: 1
          propertyNames:
            $ref: "#/$defs/nonempty_string"
          additionalProperties:
            type: string

  sources:
    type: object
  grading:
    description: >-
      Optional fixed grading descriptions reused across items. These are data,
      not executable rules; item-specific criteria still come from source tables.
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      rule:
        description: Known grading criterion shared by the benchmark's items.
        $ref: "#/$defs/nonempty_string"
      verifiers:
        description: >-
          Named, nonempty JSON-compatible verifier descriptions. Builders select
          a description and serialize it into the existing item verifier spec.
          Description fields follow the upstream grading protocol.
        type: object
        minProperties: 1
        propertyNames:
          $ref: "#/$defs/nonempty_string"
        additionalProperties:
          type: object
          minProperties: 1
      fallback_rule:
        description: >-
          Known grading criterion used when an item-specific rule is unavailable.
          It must describe the available evidence without inventing a missing rule.
        $ref: "#/$defs/nonempty_string"
  archive_layout:
    $ref: "#/$defs/open_mapping"
  expectations:
    $ref: "#/$defs/open_mapping"
  validation:
    $ref: "#/$defs/validation_mapping"

$defs:
  snapshot_sources:
    type: object
    additionalProperties: false
    required: [upstream]
    properties:
      upstream:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [url, revision]
          allOf:
            - if:
                required: [name]
              then:
                oneOf:
                  - required: [file, size, sha256]
                    not: {required: [files]}
                  - required: [files]
                    not: {anyOf: [{required: [file]}, {required: [prefix]}, {required: [html_index]}]}
                    properties:
                      revision: {type: string, pattern: '^[0-9a-f]{40}$'}
                      url:
                        not: {pattern: '^https://drive\.google\.com/'}
                  - required: [files, tree_sha256]
                    not: {anyOf: [{required: [file]}, {required: [prefix]}, {required: [html_index]}, {required: [helm_index]}, {required: [git_lfs]}, {required: [tree_paths]}]}
                    properties:
                      url: {type: string, pattern: '^https://drive\.google\.com/drive/folders/[A-Za-z0-9_-]+$'}
                  - required: [files, prefix, tree_sha256]
                    not: {required: [file]}
                    properties:
                      url: {type: string, pattern: '^https://storage\.googleapis\.com/[a-z0-9._-]+$'}
                  - required: [files, html_index, tree_sha256]
                    not: {anyOf: [{required: [file]}, {required: [prefix]}]}
            - if:
                anyOf:
                  - required: [files]
                  - required: [file]
              then:
                required: [name]
            - if:
                required: [helm_index]
              then:
                required: [files, prefix, tree_sha256]
                properties:
                  prefix: {type: string, pattern: '/$'}
                  url: {type: string, pattern: '^https://storage\.googleapis\.com/[a-z0-9._-]+$'}
            - if:
                required: [html_index]
              then:
                required: [files, tree_sha256]
                not: {anyOf: [{required: [file]}, {required: [prefix]}, {required: [helm_index]}, {required: [git_lfs]}, {required: [tree_paths]}]}
            - if:
                required: [git_lfs]
                properties: {git_lfs: {const: true}}
              then:
                required: [files]
                properties:
                  url: {type: string, pattern: '^https://github\.com/[^/]+/[^/]+$'}
            - if:
                required: [tree_paths]
              then:
                required: [files]
                properties:
                  url: {type: string, pattern: '^https://github\.com/[^/]+/[^/]+$'}
          properties:
            name:
              description: Name selected by the builder's fetch_sources() call.
              type: string
              pattern: '^[a-z][a-z0-9_]*$'
            url:
              type: string
              pattern: '^https?://\S+$'
            revision:
              anyOf:
                - $ref: "#/$defs/nonempty_string"
                - type: 'null'
            file:
              description: Raw-relative destination for one HTTP download.
              type: string
              pattern: '^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$'
            size: {type: integer, minimum: 0}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            git_lfs:
              description: Resolve selected GitHub LFS pointers to their SHA-256-pinned large files.
              type: boolean
            tree_paths:
              description: Optional repository-relative paths or component-wise globs limiting GitHub tree traversal; selected directories include their descendants.
              type: array
              minItems: 1
              uniqueItems: true
              items: {$ref: '#/$defs/nonempty_string'}
            prefix:
              description: Object-name prefix in a public GCS bucket; file patterns match relative to this prefix.
              $ref: '#/$defs/nonempty_string'
            tree_sha256:
              description: SHA-256 of the selected source tree. GCS includes object versions, sizes, MD5 hashes and encodings; HTML indexes include linked paths, sizes and SHA-256 content hashes; public Google Drive folders include paths, file IDs, sizes and SHA-256 content hashes.
              type: string
              pattern: '^[0-9a-f]{64}$'
            html_index:
              description: Name of a pinned HTML source whose same-site links are selected by files patterns.
              type: string
              pattern: '^[a-z][a-z0-9_]*$'
            helm_index:
              description: Select all run directories in a pinned HELM release manifest, optionally limited to one group.
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
                group: {$ref: '#/$defs/nonempty_string'}
            files:
              description: Select files from a pinned source tree and map them into raw/.
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [match, path]
                properties:
                  match:
                    description: Full-match regular expression on the upstream path; optional named groups.
                    $ref: '#/$defs/nonempty_string'
                  path:
                    description: Raw-relative path with named captures or {path} for the complete upstream path.
                    $ref: '#/$defs/nonempty_string'
  response_scale:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, values]
        properties:
          kind: {const: discrete}
          values:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: number}
          meanings:
            description: >-
              Optional meanings for known allowed values. Keys are quoted
              numeric strings; each must match an allowed value, with no
              numerically duplicate keys. Omit values whose meaning is unknown.
            type: object
            minProperties: 1
            propertyNames: {type: string}
            additionalProperties:
              $ref: "#/$defs/nonempty_string"
          direction:
            $ref: "#/$defs/score_direction"
      - type: object
        additionalProperties: false
        required: [kind, min, max]
        properties:
          kind: {const: interval}
          min: {type: [number, 'null']}
          max: {type: [number, 'null']}
          direction:
            $ref: "#/$defs/score_direction"
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: {const: mixed}
  score_direction:
    description: >-
      Declared preference for larger or smaller recorded grades. Unordered
      means no preferred numeric order; null or omission means unknown.
      This metadata never reverses or rescales grades. For mixed benchmarks,
      declare it on each item's concrete scale.
    enum: [higher_is_better, lower_is_better, unordered, null]
  nonempty_string:
    type: string
    pattern: "\\S"
  one_line_description:
    description: >-
      Optional migration-era display summary: one verb-led logical line, at
      most 160 characters. The benchmark name is omitted by authoring
      convention rather than structural validation.
    type: string
    maxLength: 160
    pattern: "^(?:Measures|Evaluates|Tests|Assesses)\\b"
    not:
      pattern: "[\\r\\n]"
  nonempty_string_list:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/nonempty_string"
  open_mapping:
    type: object
    additionalProperties: true
  sources_mapping:
    type: object
    properties:
      downloads:
        $ref: "#/$defs/http_downloads"
      inputs:
        type: object
        minProperties: 1
        propertyNames:
          type: string
          pattern: "^\\S+$"
        additionalProperties:
          $ref: "#/$defs/custom_input"
    additionalProperties: true
  custom_input:
    description: >-
      Cached upstream input acquired by a custom download hook. Declare every
      input before building; the shared lifecycle verifies its bytes and locator.
    type: object
    additionalProperties: false
    required: [url, file, size, sha256]
    properties:
      url:
        type: string
        pattern: "^\\S+$"
      file:
        type: string
        pattern: >-
          ^(?!/)(?!.*//)(?!.*(?:^|/)\.\.?(?:/|$))[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$
      size: {type: integer, minimum: 0}
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      revision:
        $ref: "#/$defs/nonempty_string"
  http_downloads:
    type: object
    minProperties: 1
    propertyNames:
      type: string
      pattern: "^\\S+$"
    additionalProperties:
      $ref: "#/$defs/http_download"
  http_download:
    type: object
    additionalProperties: false
    required:
      - url
      - file
      - size
      - sha256
    properties:
      url:
        type: string
        pattern: "^https?://\\S+$"
      file:
        type: string
        pattern: >-
          ^(?!/)(?!.*//)(?!.*(?:^|/)\.\.?(?:/|$))[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*$
      size:
        type: integer
        minimum: 0
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      timeout:
        type: integer
        minimum: 1
  validation_mapping:
    type: object
    additionalProperties: false
    required:
      - source_claims
    properties:
      source_claims:
        $ref: "#/$defs/source_claims_mapping"
  source_claims_mapping:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      counts:
        $ref: "#/$defs/count_claims"
      aggregate_tables:
        $ref: "#/$defs/aggregate_table_claims"
    anyOf:
      - required:
          - counts
      - required:
          - aggregate_tables
  count_claims:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-z0-9_]*$"
    additionalProperties:
      $ref: "#/$defs/count_claim"
  count_claim:
    type: object
    additionalProperties: false
    required:
      - entity
      - expected
      - source_ref
      - locator
      - scope
    properties:
      entity:
        enum:
          - items
          - assets
          - subject_configurations
          - responses
          - traces
      expected:
        type: integer
        minimum: 0
      source_ref:
        $ref: "#/$defs/nonempty_string"
      locator:
        $ref: "#/$defs/nonempty_string"
      scope:
        $ref: "#/$defs/nonempty_string"
  aggregate_table_claims:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[a-z][a-z0-9_]*$"
    additionalProperties:
      $ref: "#/$defs/aggregate_table_claim"
  aggregate_table_claim:
    type: object
    additionalProperties: false
    required:
      - metric
      - grouping
      - expected_groups
      - reported_scale
      - aggregation
      - absolute_tolerance
      - source_ref
      - locator
      - scope
    properties:
      metric:
        $ref: "#/$defs/nonempty_string"
      grouping:
        $ref: "#/$defs/nonempty_string"
      expected_groups:
        type: integer
        minimum: 1
      reported_scale:
        $ref: "#/$defs/nonempty_string"
      aggregation:
        $ref: "#/$defs/nonempty_string"
      absolute_tolerance:
        type: number
        minimum: 0
      source_ref:
        $ref: "#/$defs/nonempty_string"
      locator:
        $ref: "#/$defs/nonempty_string"
      scope:
        $ref: "#/$defs/nonempty_string"
